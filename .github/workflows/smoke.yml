        run: |
          node tests/anon-rate-gate.mjs
          node tools/mutant-gate.mjs node tests/anon-rate-gate.mjs --selftest

      # RETIRED 2026-10-22 (world-actions cut, Tyler): tests/raid-band-denial.mjs (+ tests/sql/raid-*.sql) proved raid_claim's band rule over raid_strike's contributions; raid_claim (12-03), raid_strike and raid_contributions (12-04) are dropped. tests/old-rewards-gone.mjs keeps them cut (OR-4).

      # RETIRED 2026-10-22 (old-client reward cut, Tyler): tests/goal-counter-kinds.mjs guarded the ev:planted backfill against hr_claim_goal and hr_claim_quest; both doors are dropped, and their revival is red in old-rewards-gone OR-4. tests/old-rewards-gone.mjs keeps it cut.

