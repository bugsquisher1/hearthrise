# ============================================================
# CI gate for Hearthrise (b215)
#
# The 168-test smoke suite lived only behind Ctrl+Shift+T in a browser, so it
# could never block a bad push — by the repo's own workflow note it usually ran
# *after* a bug was already live on Pages. This runs the same suite headlessly
# on every push and PR, plus the cache-buster invariant that keeps a deploy from
# shipping half-stale modules.
#
# Deliberately no build step: the game is a static folder, so CI serves the repo
# exactly as GitHub Pages does.
# ============================================================
name: smoke

on:
  push:
    # main deploys (Pages); release/** and next are GATE-ONLY branches — the same
    # six-job matrix runs there so a release never waits on a developer machine.
    branches: [main, 'release/**', next]
    # DOCS-ONLY COMMITS DO NOT GATE CODE. The ledger and the audit
    # reports are updated many times a day; each one was starting a full
    # ~40-minute run, which queues behind the real ones and delays the
    # signal that actually matters. A release commit always touches
    # src/ (the cache-buster bump), so it is never skipped by this.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

# ── LEAST PRIVILEGE FOR THE WORKFLOW TOKEN (2026-08-23, open-beta hardening) ──
# The repository is PUBLIC and hearthrise.net is served from main, so the
# GITHUB_TOKEN handed to a job that runs on `push: main` is, if the repository
# default is "read and write", a token that can PUSH TO THE DEPLOYED SITE.
# Three steps of this job run third-party code with that token in the
# environment: `actions/checkout`, `actions/setup-node`, and — the big one —
# `npm install`, which executes lifecycle scripts from Playwright, PGlite and
# their whole transitive tree. One compromised package, and the site is theirs.
#
# `permissions:` here overrides the repository default, so this holds even if
# somebody flips that setting later. Nothing in this workflow writes anything:
# it checks out, installs, and runs tests. `contents: read` is the whole need.
permissions:
  contents: read

# ── THE MATRIX (cleanup slice 8a, 2026-09-07) ───────────────────────────────
# This was ONE sequential job of 58 commands. The b514 run took 50.2 minutes
# and was CANCELLED by its own `timeout-minutes: 50` — a red build with no
# failing assertion in it, which is the most misleading way a gate can fail,
# and the second time this workflow has raised that number rather than the
# question underneath it.
#
# The steps are now partitioned by what they NEED, into SEVEN jobs that run in
# parallel, so the wall clock is the slowest family rather than the sum:
#
#   job                  needs                      MEASURED   timeout (= x2)
#   in-page              a real Chromium            ~15.5 min * 30
#   economy-selftests    an applied migration chain  15.8 min  32
#   db-replay            an applied migration chain   7.75 min 16 [1]
#   db-replay-2          an applied migration chain   9.2 min  19 [1]
#   utc-midnight-replay  an applied migration chain   6.85 min 14 [2]
#   client-guards        nothing but this repo        4.3 min   9 [3]
#   edge                 the live gateway              0.5 s    5 (floor)
#
# [1] db-replay SPLIT IN TWO 2026-09-20 (b550 follow-up): the GitHub run for
#     7b509de8 (branch next) cancelled db-replay at its own 14-min timeout —
#     mid "Gem unlock buy", with Recipe learn and Projected key set never
#     run — even though nothing measured in it was failing. The family the
#     2026-09-07 line ([228.0 s]) described predates most of the guards now
#     in it (rejections journal, buff queue, renown projection, restore
#     census, town presence, world finds projection, gem unlock buy, recipe
#     learn, projected key set) and was never re-measured whole. Re-measured
#     2026-09-20 from the GitHub run for 7b509de8's own steps (782 s through
#     World finds projection) plus the three steps that never ran, measured
#     locally on a box independently cross-checked against that same run
#     (Retreat apply: 19.9 s local vs 19 s on GitHub) — Gem unlock buy 100.4 s,
#     Recipe learn 73.8 s, Projected key set 2.4 s — for a real family total of
#     960 s (16.0 min), well past the "~10 min per job" guideline. Split by
#     family at the Buff queue / Renown projection boundary, PGlite snapshot
#     cache verification repeated FIRST in the new job per CI-SHAPE-4 (no
#     command may run in two jobs, so it is a second, independent
#     verification, not a shared one): db-replay 465 s (7.75 min) x2 = 15.5,
#     rounded up to 16; db-replay-2 552 s (9.2 min) x2 = 18.4, rounded up to
#     19. No single step regressed — the whole family measured 20-35% slower
#     on this GitHub run than on an earlier one the same day (7120434), which
#     is shared-runner variance, not a code change (the two commits between
#     them touch only smoke.yml/ci-shape.baseline.json/lane-done.mjs
#     comments); the split is sized off the SLOWER, more conservative run.
# [2] SPLIT OUT of db-replay 2026-09-19 (b550) — see the utc-midnight-replay
#     job's own header comment for the measurement and the cancelled run that
#     forced it.
# [3] client-guards RE-MEASURED 2026-09-20: the 2.0-min line was never revised
#     after the b550 guard wave. GitHub runs for ab7572e7 and 7120434 (branch
#     next) both completed the full family at 255-258 s (4.3 min); the run for
#     7b509de8 was cancelled by the old 5-min (300 s) timeout mid "hr_state_of
#     final body" — a margin of ~40 s over the measured total, nowhere near
#     x2. Budget = 258 s x2 = 8.6 min, rounded up to 9.
#
# RE-MEASURED 2026-09-07 after merging main, which brought SIXTEEN steps this
# branch forked before (guard-hygiene, window-globals, no-client-farm-mint,
# no-duplicate-rpc-callers, no-blob-branches, signup-door x2, worker-accrual x2,
# goal-counter-kinds, icon-boot-order, and the bump-version / rpc-resolution /
# edge-jwt-gate / raid-card-copy mutation proofs). Each was RE-SLOTTED into the
# family that matches what it needs, never dropped: run-ci-local --list on this
# tree is a strict SUPERSET of the list main's smoke.yml produces (84 commands
# vs 81; the three extras are the ci-shape guard and the PGlite cache verify).
# Only ONE budget moved: economy-selftests 30 -> 32, because goal-counter-kinds
# --selftest (49.2 s, PGlite) + worker-accrual (6.2 s) push the family from
# 14.9 to 15.8 min and 15.8 x 2 = 31.6.
#
# MEASURED 2026-09-07 on the dev machine with `node tests/run-ci-local.mjs
# --job <name>`, every job green (economy 20/20 in 895.2 s + 55.4 s of merged-in
# steps, db-replay 16/16 in 228.0 s, client-guards 35/35 in 122.7 s, edge 1/1 in
# 0.5 s) and with two other
# suites running on the same box, so the numbers are pessimistic rather than
# flattering. (*) in-page is not re-measured here: run-smoke was measured at
# ~12.8 min on 2026-09-05 and the browser install adds ~2 min; running the
# in-page suite while two others were running would have measured the machine,
# not the suite. The two smallest budgets are a FLOOR, not a measurement --
# checkout + setup-node + npm install is ~40 s before a guard runs at all, and
# a budget under about five minutes would be measuring the runner.
#
# EVERY STEP LANDS IN EXACTLY ONE JOB, and `tests/ci-shape.mjs` is the guard
# that says so: it fails if a command is in two jobs, if a command that was
# registered has vanished from all of them, if a new command is unregistered,
# if a job has no timeout, or if `run-ci-local --list` stops enumerating the
# whole matrix. A split is exactly the kind of change that loses a guard
# quietly, so the split ships with the thing that would notice.
#
# `timeout-minutes` per job is the MEASURED family time x2 — stated on each
# job. A margin is not a licence to slow down: a genuine hang still fails,
# it just fails after the evidence has been collected.
#
# The second half of the fix is that a chain replay no longer costs 9-20 s a
# time: tests/pglite-template.mjs snapshots the applied prefix and restores
# it (measured 12.9 s -> 1.1 s). Measured end to end on two guards:
# bank-cap-rungs --selftest 182.0 s -> 52.8 s, bounty-hunter-xp --selftest
# 121.5 s -> 39.1 s, with every mutation still caught.
#
# History of the number this replaces: 15 -> 20 (2026-08-31, the mutation
# proofs), 20 -> 30 (2026-09-04, measured: 856.6 s of CI-only guards), 30 ->
# 50 (2026-09-05, measured: run-smoke ~12.8 min PLUS 793 s of guards). Every
# raise was honest and every one bought less headroom than the next guard
# cost. This is the first change that makes the work smaller instead.
jobs:

  # ── in-page ── THE PLAYER'S-EYE HALF: everything that needs a real Chromium.
  # The 1,150-test headless suite, the Hunt card's rendered copy and the visual
  # QA gate. This is the LONG POLE of the matrix by design — it is the only
  # family that pays for `playwright install --with-deps` (~2 min) and it runs
  # a browser for ~13 min — and every other family finishes inside it, so the
  # wall clock of the whole workflow is this job plus queueing.
  #
  # MEASURED 2026-09-05 on the dev machine: run-smoke ~12.8 min. A shared
  # runner is slower, and checkout + setup-node + npm install + the browser
  # download add ~3 min. Budget = measured x2 (see the note above `jobs:`).
  #
  # The two browser mutation proofs merged in from main on 2026-09-07 —
  # raid-card-copy --selftest (9.0 s) and icon-boot-order --selftest (22.4 s,
  # and it is the one that runs the CPU-load control) — add 31.4 s between them.
  # Half a minute on a ~15 min family: budget stays 30.
  in-page:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke suite (headless)
        # THE IN-PAGE BUDGET IS NOT THE JOB TIMEOUT. run-smoke.mjs caps the
        # page.evaluate at HR_SUITE_TIMEOUT_MS (default 120_000). CI ran with
        # the default while every local run used 300_000, so from b488 the
        # in-page step timed out here and passed on a dev machine -- a red
        # build with no failing assertion in it. The suite has since grown to
        # 1134 tests and a shared runner is slower than the machine that
        # wrote them, so this is set explicitly and generously. Only the wall
        # clock flexes; every assertion still has to pass.
        env:
          HR_SUITE_TIMEOUT_MS: '600000'
        run: node tests/run-smoke.mjs

      # ...and that the rule is READABLE. A reward rule a player cannot see is
      # the same failure as a stat that renders no number. Drives the real
      # raids.js in real Chromium and asserts on the card's own text.
      - name: Hunt card states the band rule
        if: ${{ !cancelled() }}
        run: node tests/raid-card-copy.mjs

      # The Hunt card copy, mutation-proven in the REAL browser: each defect is
      # planted into the real src/features/raids.js on the way to Chromium.
      # Includes C6, the value-crossing one — the clan gate ceasing to fire, so
      # a functional Strike/Claim/Declare card renders while the claim and
      # weekly-reset server half is still deferred.
      - name: Hunt card copy — mutation proof
        if: ${{ !cancelled() }}
        run: node tests/raid-card-copy.mjs --selftest

      # ICON BOOT-ORDER — THE MUTATION PROOF, AND THE LOAD CONTROL.
      # run-smoke.mjs already runs this guard's base pass; what it cannot run is
      # the proof that the guard still BITES. --selftest plants three defects and
      # requires each to be caught: an icon path written after first paint
      # (property A), a neutered __hrRepaintActive (property B), and a suppressed
      # __hrFirstPaint marker (the "cannot observe" branch). Its fourth control
      # is a clean run under artificial CPU load — 4 busy workers plus main-
      # thread jank — which is exactly the condition the pre-b517 5 ms polling
      # hook lost first paint in (measured 2/3 loaded runs vs 0/3 idle), turning
      # a guard precondition into a red suite and blocking the gate for every
      # later build. The load control is what stops that regressing.
      - name: Icon boot-order — mutations caught, and green under CPU load
        if: ${{ !cancelled() }}
        run: node tests/icon-boot-order.mjs --selftest

      # BOOT BUDGET — THE PLAYER DOES NOT DOWNLOAD THE TEST SUITE (b535).
      # main.js imported src/features/smoke-test.js statically, so 3.75 MB of
      # test code — 36% of all the JavaScript a cold boot delivers — was paid by
      # every player before the account gate was usable ("it takes long to
      # start", Paione, 2026-09-11). It is a dynamic import now, and this boots a
      # real Chromium to hold all four: a player boot never fetches the
      # suite (BOOT-1), and a harness boot does and publishes it (BOOT-2) —
      # without which every runner here would silently fall through to
      # legacy.js block 29's ~40-test v1 __smokeTest and report a green that
      # means nothing; every page runner pins the ESM suite by its signature
      # (BOOT-3); and Ctrl+Shift+T still fetches it on demand (BOOT-4), because a
      # dynamic import is one keystroke away from a dead control. It lives in
      # THIS family because it needs the Chromium
      # installed above; client-guards installs no browser. Measured 41 s + 71 s for
      # the two commands (5 cold boots + 2 throttled, then 2 controls + 4 mutated) on
      # the dev machine: ~2 min on a ~15.5 min family, so the 30 min budget stands.
      - name: Boot budget - the player never downloads the test suite
        if: ${{ !cancelled() }}
        run: |
          node tests/boot-budget.mjs
          node tests/boot-budget.mjs --selftest

      # Needs the Chromium installed above. The gate half is a pure function and
      # is proven by --selftest without a browser, so a Chromium problem shows up
      # as exit 2 (harness) rather than as a visual verdict. The SWEEP half is
      # proven by visual-qa --selftest, which boots one page and plants a broken
      # value on the Boss-of-the-Day card: b536 went red on "22:56:23RevenantUndead"
      # — text no player could see — and narrowing a detector is how a guard
      # quietly stops biting, so the narrowing carries its own mutation proof.
      # One extra page boot, measured 5 s on the dev machine (the gate below boots
      # the same page 2x and walks 24 screens), on a family budgeted for 30 min.
      - name: Presentation floor - visual QA gate (P0 / new P1)
        if: ${{ !cancelled() }}
        run: |
          node tests/visual-qa-gate.mjs --selftest
          node tests/visual-qa.mjs --selftest
          node tests/visual-qa-gate.mjs

      # A failing run is far easier to diagnose with the page state attached.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            tests/**/*.png
            tests/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ── db-replay ── DOES THE REPO STILL REBUILD THE DATABASE, AND DOES IT MATCH
  # WHAT PRODUCTION RUNS? The rebuild/drift/ledger/apply-execution half of the
  # family: schema drift, ledger rollup, catalogue literal drift, live-hash
  # drift, apply-order honesty, retreat apply and rejections journal, plus buff
  # queue. They share one PGlite chain snapshot (tests/pglite-template.mjs),
  # which is why the cache's own verification step is the FIRST thing in this
  # job: if the snapshot mechanism is not sound, nothing measured after it in
  # this job means anything.
  #
  # SPLIT FROM db-replay-2 2026-09-20 (see the note above `jobs:` for the full
  # measurement). This half MEASURED 465 s (7.75 min) on the GitHub run for
  # 7b509de8 (branch next). Budget = measured x2 = 15.5 min, rounded up to 16.
  db-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 16

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # node_modules, NO browser. `playwright install --with-deps` is ~2 minutes
      # and buys nothing for a guard that never opens a page, so it stays in the
      # in-page job. The install itself runs in every family: a job that fails on
      # a dependency it did not know it had is a red build with no failing
      # assertion in it, and that is the class this whole slice is about.
      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # THE SNAPSHOT CACHE'S OWN PROOF. Every guard below (and every guard in
      # economy-selftests) boots its PostgreSQL from a data-directory snapshot
      # of the applied migration prefix instead of replaying it. A STALE
      # snapshot would make every ✓ in this workflow a statement about a
      # database the repo does not build — the always-null-probe family, with a
      # speedup as its motive. This replays the chain three ways (build,
      # restore, and again with the cache switched off), requires all three
      # fingerprints to be equal, and then plants two corruptions and requires
      # each to be REFUSED. It runs FIRST because nothing measured after it is
      # worth reading if it is red.
      - name: PGlite snapshot cache - restored == replayed, corruption refused
        if: ${{ !cancelled() }}
        run: node tests/pglite-template.mjs --verify --for=db-replay

      # CAN THE REPO REBUILD THE DATABASE? After cutover the database is the ONLY
      # copy of every player's progression, and disaster recovery rests entirely
      # on "we can rebuild the schema from the repo". On 2026-08-14 that was
      # FALSE — 15 objects existed in production and in no file, and applying the
      # migrations in filename order got 23 of 41 files in — and there was no
      # test that could have said so. This replays supabase/schema.sql + every
      # migration onto a real in-process PostgreSQL in the order declared by
      # tests/schema-apply-order.json, then fingerprints the result against a
      # committed baseline. It ALSO fails if a new migration is not placed in
      # that order, so a file cannot be silently omitted from a rebuild.
      # No credentials; production untouched.
      #
      # --mutate plants seven real defects in the real migration text (a gutted
      # reconstruction, a vanished policy, a renamed column, RLS switched off on
      # a watched table AND on an unwatched one, a silent type change, and the
      # A11 lockdown GUC removed) and demands every one is caught. This repo has
      # shipped a guard that asserted nothing twelve times; this one does not get
      # to claim it works.
      #
      # --live-selftest proves the PRODUCTION half can fail. That half cannot run
      # here (it needs a live database, and no credentials belong in CI), but the
      # classifier behind it can: it plants a prod-only table, a repo-only table,
      # a changed table, a changed category with no per-table breakdown, and a
      # partial paste, and requires each to be reported. From 2026-08-14 to
      # 2026-08-30 the production delta was unfalsifiable prose that had been
      # measured exactly once; this is what stops it going back to that.
      - name: Schema drift — the repo must rebuild the database
        if: ${{ !cancelled() }}
        run: |
          node tests/schema-drift.mjs
          node tests/schema-drift.mjs --mutate
          node tests/schema-drift.mjs --live-selftest

      # UTC MIDNIGHT REPLAY MOVED TO ITS OWN JOB 2026-09-19 (b550). Measured on
      # the GitHub run for ab7572e7 (branch next): this step alone cost 411 s,
      # and the family's steps up to and including it (752 s) plus buff-queue
      # already running blew past this job's `timeout-minutes: 14` — CANCELLED
      # with no failing assertion, and eleven more steps never ran. See the
      # `utc-midnight-replay` job below for the guard and its full comment.

      # THE 90-DAY LEDGER ROLLUP HAS NEVER FIRED ON PRODUCTION (first real fire ~2026-11-21).
      # This replays the chain, seeds aged ledger rows, runs hr_ledger_prune the way cron
      # does and asserts every currency is conserved to the unit (gold, xp in AND out, qty,
      # gems), the prune is idempotent, no per-day ceiling moves, and takes a census of every
      # function that reads a LIFETIME fact out of a 90-day table. --mutate plants five defects.
      - name: Ledger rollup — a prune conserves every currency and moves no ceiling
        if: ${{ !cancelled() }}
        run: |
          node tests/ledger-rollup.mjs
          node tests/ledger-rollup.mjs --mutate

      # ...AND DO THE ROWS THE REBUILD PRODUCES MATCH src/data?
      # schema-drift proves the SCHEMA replays. This is the CONTENT half, and it
      # exists because of Security finding F2 (2026-09-13, Deep Seam review):
      # several migrations hand-restate hr_items / hr_item_slots / hr_activities
      # rows that src/data/*.js already owns and tools/gen-catalogues.mjs already
      # generates. `gen-catalogues --check` compares the GENERATED file to a fresh
      # generation and is blind to those restatements — so a rebalance of
      # ITEMS.verdite_bar.v leaves the generated catalogue correct, --check green,
      # and a LAST-in-chain `on conflict do update` quietly reverting a tradeable
      # item's price on every replay or re-apply.
      #
      # The property asserted is the only one indifferent to which file holds the
      # stale copy: replay the whole chain, then compare the rows the database
      # ENDS UP WITH to the rows src/data produces, field by field.
      #
      # --selftest plants four defects and demands each is caught: a price literal
      # stale in a migration only, ITEMS re-valued in src/data only, a slot pair
      # dropped from a seeding migration, and an activity authored in src/data
      # with no migration behind it.
      # No credentials; production untouched.
      - name: Catalogue literal drift — the chain end must equal src/data
        if: ${{ !cancelled() }}
        run: |
          node tests/catalogue-literal-drift.mjs
          node tests/catalogue-literal-drift.mjs --selftest

      # ...AND DOES PRODUCTION CARRY THE BODIES THE REPO BELIEVES IT CARRIES?
      # schema-drift fingerprints SIGNATURES; its own header names function
      # BODIES as blind spot (C). On 2026-08-30 the renown-faucet migration ran
      # on production while the repo went on recording it as staged for a full
      # day, and nothing in this repository could have said so: the platform's
      # migration ledger is frozen (applies go through execute_sql) and the
      # migrations' own md5 pins fire only at APPLY time — they answer "may I
      # install?", never "what is installed right now?".
      #
      # This is the credential-free half. It DERIVES every hash-pinned and
      # programmatically-patched function from supabase/migrations/** — never a
      # hand list, which would be one migration from being wrong, and the
      # function that fell off it is the one nobody is watching — replays the
      # chain, and fails if the repo no longer rebuilds to the body the baseline
      # records. --selftest plants 16 defects (a mutated live hash, a deleted
      # baseline entry, a prod-only OVERLOAD of a hash-pinned function, a STAGED
      # migration found applied, a truncated paste, an unexplained divergence,
      # --write's own REVIEW placeholder left in place, two unreadable patcher
      # idioms) and requires each to be caught by the NAMED assertion written
      # for it, after a false-positive floor check. --mutate plants three in the
      # REAL migration text, including a comment edited into a body after it was
      # applied — invisible to every other guard in this repo.
      #
      # The PRODUCTION half (--live / --live-sql / --live-compare / --codediff)
      # is deliberately NOT here: the repository is public and this job runs npm
      # lifecycle scripts, so no database credential belongs in it. It is an
      # operator ritual — run it before any migration, restore or cutover step.
      - name: Live-hash drift — the repo's belief about deployed bodies
        if: ${{ !cancelled() }}
        run: |
          node tests/live-hash-drift.mjs
          node tests/live-hash-drift.mjs --selftest
          node tests/live-hash-drift.mjs --mutate

      # ...AND DOES THE DEPLOYMENT RECORD AGREE WITH THAT MEASUREMENT?
      # The step above measures what production runs. tests/schema-apply-order.json
      # is what an OPERATOR reads to decide what still has to be run — and on
      # 2026-09-06 its `_order_notes` said "STAGED, NOT APPLIED" for FOURTEEN
      # migrations that were measurably live, including three whose own notes
      # predicted the post-apply hash the baseline had already measured as the
      # LIVE one. Both records existed; nothing compared them. An operator acting
      # on the file would have re-applied all fourteen believing they were new;
      # every one happened to be anchor-guarded and idempotent, so they would have
      # failed closed — the next one might not.
      #
      # Credential-free by construction: it reads those two JSON files and
      # nothing else, no replay and no database, so it costs milliseconds and can
      # sit next to the guard whose measurements it consumes. A file is called
      # APPLIED only when it is the LAST file in the apply order touching a
      # tracked body that production carries — "last" because a later restatement
      # already contains an earlier file's change, so anything short of that
      # proves nothing and the guard stays silent rather than accusing.
      # --selftest plants both directions (a STAGED note on a live migration, an
      # APPLIED note on a body the baseline measured as absent), a structural
      # drift between the two files, and two NEGATIVE CONTROLS that must stay
      # silent.
      - name: Apply-order honesty — the deployment record vs the measurement
        if: ${{ !cancelled() }}
        run: |
          node tests/apply-order-honesty.mjs
          node tests/apply-order-honesty.mjs --selftest

      # AND DOES THE MIGRATION'S VALIDATION ACTUALLY *RUN*?
      # 2026-09-07-retreat.sql adds player_state.consec_falls and teaches hr_apply
      # to allowlist, validate and write it. Its own §4 self-check is strong, but it
      # proves the validation BY strpos — it asserts that the strings
      # 'bad_consec_falls' and 'v_consec <> trunc(v_consec)' appear in the installed
      # body. Text is not behaviour: a body can carry every one of those markers in
      # a branch that never runs, and §4 reports success. This repo has shipped a
      # guard that asserted nothing twelve times and they all had that shape.
      #
      # So this replays the REAL ordered chain and CALLS hr_apply as the engine
      # role with each value a buggy engine or an attacker would send: 2.5, -1, 65,
      # the string "3", null, true and 1e30 are each refused as bad_consec_falls
      # with the column UNMOVED (a rejection has to roll back, not merely report);
      # 0 — a kill's reset, which IS the rule — and 64, the blast radius, are
      # admitted and written; the retreat delta (counter + idle pointer) applies as
      # ONE write; an ACTIVITY key does not void the counter, which is the exploit
      # that bites hardest here because every retreat carries one; an unknown delta
      # key is still refused; hr_state_of projects the column; no client role holds
      # EXECUTE and a real call as `authenticated` is refused 42501; and a second
      # apply of the file leaves both bodies byte-identical with exactly one CHECK
      # constraint (it patches bodies that are ten patches deep — a double-apply
      # would be a silent corruption of the engine).
      #
      # --selftest plants two defects in the REAL migration text, both chosen
      # because they APPLY CLEAN: the range predicate loses its ceiling arm (65 is
      # admitted by the function and only the table CHECK stops it) and the type
      # predicate is disarmed (a client-shaped STRING writes a server counter).
      # Neither is covered by §4, which is exactly why an EXECUTED guard has to be.
      # Per C4, base AND selftest: a selftest-only registration cannot tell a
      # broken migration from a working guard.
      #
      # No credentials; production untouched. Measured 2026-09-07: 1 s base + 2 s
      # selftest on the shared PGlite snapshot, so the 12-minute budget is unmoved.
      - name: Retreat apply — hr_apply's consec_falls validation, by execution
        if: ${{ !cancelled() }}
        run: |
          node tests/retreat-apply.mjs
          node tests/retreat-apply.mjs --selftest

      # DOES A REFUSAL LEAVE A TRACE, WITH ITS VERB, AND CHANGE NOTHING?
      # 2026-09-11: Paione needed 4-8 taps to equip a staff and stop-combat
      # snapped back into the fight — version_conflict refusals during a fight.
      # His hr_rejections row for the day read `version_conflict | accrue | n=10`
      # and the equips were IN that 10, unreadable: the aggregate key is (user,
      # slot, day, code) and `intent` was last-writer-wins. Worse, most refusals
      # never reached the journal at all — hr_farm_plant had 12 refusal sites and
      # 0 recorder calls, and farming sat at zero for ten days with nobody able
      # to see it.
      #
      # 2026-09-12-hr-rejections-journal.sql fixes both by PATCHING 56 bodies it
      # does not own, so CHAIN END is the only place the property can be
      # asserted: a later migration restating any of them from a template
      # silently deletes the seam (the b484-b487 wave). This replays the WHOLE
      # chain and drives a real player through the REAL rate-gated RPCs.
      #
      # The load-bearing assertion is not "a row appears". It is that the
      # envelope the PLAYER receives is byte-identical across the decorator, that
      # an ACCEPTED call writes nothing, and that the journal cannot become
      # game_events: one row per (user, slot, day, code) however many verbs, at
      # most 25 keys in the map however many a caller invents, at most one
      # occurrence per transaction, and — the four the security review found in
      # the first revision — rate_limited never journalled here (a 200-call
      # storm costs 63 writes, MEASURED with pg_stat_get_xact_*, not 203), a
      # client-chosen slot folded to -1 instead of multiplying rows in the
      # primary key, a caller-shaped code folded to malformed_code, and a
      # wrapper that does not return jsonb SKIPPED rather than decorated —
      # claim_beta_invite returns json, and json -> jsonb is an ASSIGNMENT cast,
      # so decorating it installs clean, passes every text sweep and kills the
      # signup door at first execution. That one is why P6c CALLS it.
      #
      # 2026-09-13-rejections-verb-map-2.sql adds the second half, and this step
      # grades both files in one replay: it RESTATES hr_record_rejection (chain
      # depth 1 -> 0), so P15 requires every one of the 29 catalogued Security
      # rulings in c_incident / c_escalating to survive the restatement - the
      # named reason the first file refused to restate that body. P14 and P19
      # prove bad_zone and buff_not_paid escalate on the COUNTER (each normal at
      # 49, incident at 50, with a code on neither list still normal at 60;
      # buff_not_paid is ESCALATING and not c_incident because it is a release
      # code on an unwritten emitter, so the incident profile would make a
      # first-version missing-debit bug an alarm on every honest eat), P16 proves the new whys
      # breakdown splits buff_at_max's segment-budget fuse from its duration cap
      # in ONE row whose values sum to n and cap at 12 + (other), P17 proves the
      # code-to-verb fallback names the gesture under hr_apply's unattributable
      # 'apply' label and NEVER overrides a real one, and P18 bounds the why
      # token. Note for the next person restating anything: cap_loosened went
      # MISSED the first time this landed because the cap literal moved files
      # with the restatement - re-run --selftest after any restatement.
      #
      # --selftest plants twenty defects and requires each to be caught here.
      #
      # No credentials; production untouched. Base AND selftest, per C4.
      - name: Rejections journal — a refusal is recorded, and nothing else moves
        if: ${{ !cancelled() }}
        run: |
          node tests/rejections-journal.mjs
          node tests/rejections-journal.mjs --selftest

      # CAN A BROWSER GIVE ITSELF A BUFF?
      # 2026-09-13-consumable-buffs.sql moves the buff clock onto the server:
      # player_state.buffs = [{type, magnitude, until}] with an ABSOLUTE expiry, one
      # delta key `buff_apply = {item}` that resolves type/magnitude/duration from
      # the generated hr_item_buffs catalogue under the character lock and stamps
      # `until` from now(), merge-by-type with a 60-minute ceiling, and a top-level
      # projection the accrual engine drains. Its companion takes the forgeable
      # client_state copy away.
      #
      # The migrations' own §4 blocks are strong, but a §4 fires ONCE at apply time;
      # the regression that brings a forgery back is a LATER migration restating
      # hr_apply from a stale template, at which point no §4 runs again. So this
      # replays the REAL ordered chain and CALLS hr_apply as the engine role: a
      # forged until/magnitude/type/duration_ms/remaining_ms/scale is refused BY
      # NAME with the queue unmoved, an unknown or non-buff item is refused, a
      # second helping extends rather than restarts, magnitude is max(old,new) in
      # both directions, the tail clamps onto the ceiling and the next consume is
      # refused buff_at_max WITHOUT debiting the same delta's gold, a replayed
      # intent buffs once, the catalogue equals src/data/items.js row for row, and
      # the accrual engine is byte-identical with no live buff and demonstrably
      # richer with one (the arm that separates "inert" from "not wired").
      #
      # ⚠ IT ALREADY EARNED ITS KEEP: the first draft refused only on
      #   `base >= cap`, which is UNREACHABLE in production because the cap moves
      #   with now(). The migration's §4 passed (a migration applies inside ONE
      #   transaction, where now() is frozen) and THIS guard, which calls hr_apply
      #   the way production does, showed 200 consumes with no refusal at all.
      #
      # --selftest plants 14 defects in the REAL migration text and runs every one
      # GATE-BLIND (both §4 blocks short-circuited), so each tick comes from the
      # guard's own assertions rather than from the migration refusing to install.
      # Base AND selftest, per C4. No credentials; production untouched.
      - name: Buff queue — the server owns the buff clock, by execution
        if: ${{ !cancelled() }}
        run: |
          node tests/buff-queue.mjs
          node tests/buff-queue.mjs --selftest

  # ── db-replay-2 ── THE SECOND HALF OF db-replay, SPLIT OUT 2026-09-20. Same
  # inputs (an applied migration chain), same reason for the split as
  # utc-midnight-replay: the family had outgrown one job's budget with no
  # failing assertion anywhere in it (see the note above `jobs:`). Renown
  # projection through Projected key set — the read-surface and purchase
  # guards that landed after db-replay's 2026-09-07 measurement was last
  # revised. Shares NO snapshot with db-replay: PGlite snapshot cache
  # verification runs again, FIRST, as its own independent step (CI-SHAPE-4 —
  # no guard command may run in two jobs, and that includes the cache verify).
  #
  # MEASURED 552 s (9.2 min): 494 s of this job's own steps on the GitHub run
  # for 7b509de8 (branch next), through World finds projection, plus Gem
  # unlock buy / Recipe learn / Projected key set measured locally after that
  # run's own timeout cancelled them (see the note above `jobs:`), plus this
  # job's own PGlite snapshot cache verify (46 s, not in the original single-
  # job total). Budget = measured x2 = 18.4 min, rounded up to 19.
  db-replay-2:
    runs-on: ubuntu-latest
    timeout-minutes: 19

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # THE SNAPSHOT CACHE'S OWN PROOF, AGAIN. This job shares no PGlite
      # snapshot with db-replay — each job is a fresh runner — so the same
      # proof that stopped every guard below from reading a stale rebuild
      # (build, restore, and again with the cache switched off; two planted
      # corruptions, both refused) runs here too, FIRST, for the same reason
      # it runs first in db-replay: nothing measured after it means anything
      # if it is red.
      - name: PGlite snapshot cache - restored == replayed, corruption refused
        if: ${{ !cancelled() }}
        run: node tests/pglite-template.mjs --verify --for=db-replay-2

      # DOES THE PLAYER SEE WHAT THE SERVER HAS COUNTED?
      # b535 pointed the renown headline and the rank-up card at a SERVER mirror,
      # but hr_state_of projected no renown — so after a reload the mirror's only
      # continuous source was the `renown_claim:<rank>` once-guard flag, i.e. the
      # threshold of the last rank the player PAID for. Measured live 2026-09-11:
      # the QA account read 400 (the Serf floor) while the server had counted 779
      # toward Squire (900), and the only thing that moves the number is clicking
      # Claim.
      #
      # 2026-09-12-renown-high-projection.sql ratchets player_state.renown_high
      # from hr_renown_of inside hr_apply and projects it top-level on the
      # envelope. Both halves are ANCHORED PROGRAMMATIC SPLICES into hr_state_of
      # and hr_apply, so a later migration restating either body from a stale
      # template silently deletes them and the migration's own §3 gate never runs
      # again — CHAIN END is the only place the property can be asserted.
      #
      # The load-bearing assertion is not "a key appears". It is that the number
      # the envelope projects is the number hr_claim_rank DECIDES on (a headline
      # the authority disagrees with promises a rank and then refuses it), that
      # the REAL shipped reader (src/features/renown.js noteServerRenown) learns
      # it off a plain envelope, that a CLIENT kill credit moves it by exactly
      # zero — a cached score that counted credited kills would make the
      # 2026-09-02 faucet permanent instead of self-correcting — and that it
      # never falls when the live score does. --selftest plants six defects, each
      # twice (with and without the migration's own gate), plus a comment-only
      # negative control.
      #
      # No credentials; production untouched. Base AND selftest, per C4.
      - name: Renown projection — the counted score reaches the headline
        if: ${{ !cancelled() }}
        run: |
          node tests/renown-projection.mjs
          node tests/renown-projection.mjs --selftest

      # AND WHICH ROWS DOES THE REBUILD *NOT* GIVE BACK?
      # schema-drift proves the SCHEMA rebuilds and says, in its own header, that
      # it "says nothing about whether any row survives a restore". This is that
      # half: every base table in `public` must state whether a repo rebuild
      # reproduces its rows or whether only a BACKUP has them.
      #
      # ⚠ It existed since 2026-08-15 and was WIRED INTO NOTHING — not here, not
      #   run-smoke, not package.json. In that fortnight the schema went from 67
      #   to 90 base tables and 23 arrived with no DR class at all, including
      #   player_bank and player_workers, which hold player value, while every
      #   other player_* table was classified restore_only. Nobody could have
      #   known: no build ran it. That is the whole reason this step exists.
      #
      # The census now also fails on a rationale-free classification, on a
      # player-value table quietly downgraded to make a red build green, and on
      # any NEW table carrying a user_id that appears in neither the player-value
      # manifest nor the written exemption list. Adding a player-scoped table
      # without ruling on it is one red line and one line to fix.
      #
      # --mutate plants six defects in the real migration text (a catalogue that
      # rebuilds one row long past its own floor check, a lost retention cron, an
      # unclassified table, an unruled player-scoped table, a restore_only table
      # that starts being seeded) and demands each is caught BY THIS GUARD rather
      # than by a neighbour. --baseline-selftest does the same for the half that
      # lives in the baseline rather than in SQL: nine planted classification
      # defects, each pinned to the specific message that must fire.
      #
      # No credentials; production untouched. The PRODUCTION half is
      # `--live-sql` / `--live-compare` and is deliberately NOT here: it needs a
      # live database, and no database credential belongs in a job that runs npm
      # lifecycle scripts (see `permissions:` above). It is a pre-apply ritual —
      # run it before any migration that touches a data-bearing table, and before
      # any rebuild or restore.
      - name: Restore census — which rows only a backup gives back
        if: ${{ !cancelled() }}
        run: |
          node tests/restore-census.mjs
          node tests/restore-census.mjs --mutate
          node tests/restore-census.mjs --baseline-selftest

      # REALTIME COST. Measured on production 2026-09-06 over 20.25 days: the
      # Realtime WAL poller is 2,706,517 calls / 15,669 s / max 9.8 s — ~61% of
      # all exec time and ~36x the #2 statement — for two published tables, one
      # of which no client subscribed to. The guard asserts an EQUALITY, both
      # directions: the publication set == the postgres_changes subscriptions in
      # src/**. Published-but-unsubscribed is pure poller cost; subscribed-but-
      # unpublished is a feature that silently never fires (which is what the
      # market panel shipped for months). Per C4, base AND selftest: a
      # selftest-only registration cannot tell a broken migration from a working
      # guard.
      - name: Realtime cost — publication == client subscriptions, both directions
        if: ${{ !cancelled() }}
        run: node tests/realtime-cost.mjs --selftest

      - name: Realtime cost — base run (the trim migration itself is green)
        if: ${{ !cancelled() }}
        run: node tests/realtime-cost.mjs

      # THE POSTGREST RPC RESOLUTION GATE.
      # The A9 retrofit (2026-08-11) rewrapped 35 live RPCs; every wrapper had to
      # keep the original PARAMETER NAMES, because that is what PostgREST resolves
      # on. Get one wrong and the migration reports success while the RPC starts
      # answering PGRST202 to real players. That was checked by hand exactly once.
      # This checks it on every push, against a committed baseline, with a control
      # that must NOT resolve so the probe cannot silently go blind.
      #
      # Read-only against production and needs no secret: 38 of the 41 calls are
      # refused by Postgres before the body runs, 2 read the public leaderboard,
      # and the anon key is public by design and already committed in
      # src/net/supabase-bootstrap.js. `continue-on-error` is DELIBERATELY ABSENT —
      # an RPC the client can no longer see is a player-facing outage.
      - name: RPC resolution vs baseline
        if: ${{ !cancelled() }}
        run: node tests/rpc-resolution.mjs

      # The RPC resolution comparator, mutation-proven against a REAL probe of
      # production: an RPC that vanished (PGRST202 — the shipped failure), one
      # opened to anon, a retired signature that resolved again, a changed
      # return shape, an unbaselined RPC, one that stopped being probed, and the
      # control blinded. Probes once and mutates the measurement, so this adds
      # no extra network round trips.
      - name: RPC resolution — mutation proof
        if: ${{ !cancelled() }}
        run: node tests/rpc-resolution.mjs --selftest

      # IS PRESENCE A SERVER FACT, AND DOES THE PLAZA LEAK EXACTLY SEVEN KEYS?
      # 2026-09-13-town-presence.sql opens the first cross-player READ surface in
      # the game that is not a leaderboard: a named list of who is in town and what
      # they are doing. Nothing economic moves in it, so the failure modes are a
      # forged presence, a leaked column and an ignored opt-out — and none of those
      # is visible to any other guard in this repo.
      #
      # The migration's §13 gate asserts all of it at APPLY time and does bite
      # (measured 2026-09-12: three arms each fail the apply by name). That is the
      # second layer, and it is exactly the layer a later file restating hr_state_of
      # or hr_rpc_gate can quietly remove — so this replays the whole ordered chain
      # with §13 DISARMED and proves the properties by EXECUTION: the flag closes
      # the surface AND the cron body; a heartbeat stamps now() on the caller's own
      # row, bumps no version and journals NOTHING (at one call per 25 s a journal
      # row is the game_events 1.6M-row mistake at ledger scale); a second beat
      # inside 20 s writes nothing; the signature carries no uuid and no clock and
      # user A never moves user B's stamp; the projection is EXACTLY the 7-key peer
      # / 6-key crier allowlist by jsonb_object_keys with no economy or identity
      # key in it; a quiet character is absent from peers AND from the named crier
      # feed with one ledger row per CHANGE; away/seen_ago_s are read-time so a
      # stale snapshot shows nobody; the level is a BAND; an uncatalogued
      # active_id has no label; an account is one body; town_snapshot is reachable
      # by no client role; and the envelope gained `place` and carries no peers.
      #
      # --selftest plants 12 real defects and requires each to be caught by THIS
      # guard's assertions (0 by a declared refusal — the gate is disarmed on
      # purpose so a green arm cannot be an explosion). Per C4, base AND selftest:
      # a selftest-only registration cannot tell a broken migration from a working
      # guard. No credentials; production untouched.
      #
      # MEASURED 2026-09-12 on the dev machine: 2 s base + 16 s selftest on the
      # shared PGlite snapshot. The 12-minute budget is unmoved.
      - name: Town presence — a forged presence, a leaked key, an ignored opt-out
        if: ${{ !cancelled() }}
        run: |
          node tests/town-presence.mjs
          node tests/town-presence.mjs --selftest

      # IS THE FINDER'S NAME MINTED IN ONE PLACE, AND IS `presence_quiet` REAL?
      # 2026-09-08-hearthfind.sql granted SELECT on ALL of world_finds — user_id
      # and slot included — to anon AND authenticated, while profiles and
      # display_names are public-read. Naming every finder in the realm was one
      # join, and the SHIPPED client did it (src/features/hearthfind.js read
      # user_id off the board and resolved it through display_names into global
      # chat). So when 2026-09-13-town-presence.sql added presence_quiet and
      # filtered quiet characters out of the crier, its own header recorded that
      # the filter "buys nothing today". That was the named pre-launch P2.
      #
      # 2026-09-13-world-finds-projection.sql moves the name behind
      # hr_world_finds_of and revokes the identity columns. Its §6 gate asserts
      # all of it at APPLY time and does bite — and is exactly the layer a later
      # file can silently remove (a restated hr_rpc_gate, a `grant select on
      # world_finds` in a convenience sweep, a re-created wrapper without the
      # quiet rule). So this replays the whole ordered chain with §6 DISARMED and
      # proves the properties BY EXECUTION from chain end: the 8-key allowlist by
      # key set with no user_id, no slot and no account uuid in any value; a LOUD
      # finder named (the control) and a QUIET one nameless with the ROW STILL
      # PRESENT, because the board is where "the 3rd ever found" comes from and
      # one player's privacy must not renumber everybody else; `nth` a realm
      # ordinal proven against a find deliberately OUTSIDE the returned window;
      # anon AND authenticated unable to read user_id or slot by
      # has_column_privilege AND by a real SELECT under `set role` that must raise
      # 42501, while every anonymous column still reads and no write privilege
      # exists; the inner owner-only and only `authenticated` on the verb; the rate
      # gate before exactly one hr_note_rejection seam with the 6/min bucket
      # biting and six pre-existing buckets intact; the verb in
      # hr_client_rpc_baseline with grant hygiene quiet; an unauthenticated call
      # refused carrying no rows; a read that journals nothing; and the shipped
      # CLIENT no longer joining display_names.
      #
      # --selftest plants 12 real defects and requires each to turn THIS guard
      # red (12/12 by assertion, 0 by a declared refusal — the gate is disarmed on
      # purpose so a green arm cannot be an explosion). Per C4, base AND selftest:
      # a selftest-only registration cannot tell a broken migration from a working
      # guard. No credentials; production untouched.
      - name: World finds projection — a named quiet finder, a leaked user_id, a window ordinal
        if: ${{ !cancelled() }}
        run: |
          node tests/world-finds-projection.mjs
          node tests/world-finds-projection.mjs --selftest

      # DID THE REALM ACTUALLY SELL YOU THAT THEME?
      # `ownedThemes`/`ownedCosmetics` are RESIDUE and the server has never held a
      # theme or a cosmetic for anybody — the half of the b371 gem dupe that made
      # a free purchase STICK, and the reason src/legacy.js REFUSES the gesture
      # outright today (nine gem sinks the shop renders are dead buttons).
      # 2026-09-14-gem-unlock-buy.sql is the server half: one verb, one price
      # read from a GENERATED catalogue under the character lock, one flag row,
      # one ledger row, and a top-level `gem_unlocks` projection so ownership
      # stops living in a store a cloud restore can rewind.
      #
      # The load-bearing assertions are not "a key appears". They are that the
      # generated catalogue IS src/data/shops.js in BOTH directions (a hand edit
      # to the SQL is the money-number double-copy this repo generates to
      # prevent), that the debit is EXACTLY the catalogue price, that the FREE
      # theme is owned by everybody and sellable to nobody (missing => the
      # starting theme becomes unequippable the moment ownership reads
      # server-first; priced => a 0-gem faucet), that a replay and a re-buy each
      # charge zero, and that the ungated twin never became client-executable.
      # --selftest plants ten defects, each twice (with and without the
      # migration's own §7 gate), plus a comment-only negative control.
      #
      # No credentials; production untouched. Base AND selftest, per C4.
      # MEASURED 2026-09-14 on this machine: base 12 s, --selftest 36 s.
      - name: Gem unlock buy — the price is the server's and the theme is the server's
        if: ${{ !cancelled() }}
        run: |
          node tests/gem-unlock-buy.mjs
          node tests/gem-unlock-buy.mjs --selftest

      # AND DOES THE NIGHT KNOW WHICH RECIPES YOU HAVE READ?
      # 2026-08-16-artisan-progress-model.sql built the STORAGE for a learned
      # recipe and left the WRITE to a later author who never arrived: nothing has
      # ever written a `recipe:<scroll>` flag for anybody. Attended, the client
      # flips G.unlockedRecipes (residue) and deletes the scroll locally; away,
      # hr-accrue reads hr_perks_of.unlockedRecipes = {} and src/core/artisan-sim
      # .js stops the span at tick 0 — so all eight gated recipes pay NOTHING for
      # the night while the browser shows them unlocked. CLAUDE.md §6, 2026-09-14.
      #
      # The two assertions that matter are the ones a key-exists check cannot
      # make: that the ENVELOPE, the verb's verdict and hr_perks_of (what the away
      # engine prices from) all carry the SAME set, and that the REAL shipped
      # reader — src/core/artisan.js gateOk, the same pure function the browser
      # and the simulation both call — flips from locked to open off that
      # envelope. Plus: exactly one of two scrolls consumed, an uncatalogued
      # `recipe:` flag row is NOT a capability (the hr_unlocks join is the
      # allowlist), and a re-learn and a replay each eat nothing.
      # --selftest plants twelve defects, each twice, plus a negative control.
      #
      # No credentials; production untouched. Base AND selftest, per C4.
      # MEASURED 2026-09-14 on this machine: base 12 s, --selftest 39 s.
      - name: Recipe learn — a gated recipe is learned on the server or the night ignores it
        if: ${{ !cancelled() }}
        run: |
          node tests/recipe-learn.mjs
          node tests/recipe-learn.mjs --selftest

      # THE PROJECTED KEY SET, BY EXECUTION. hr_state_of is created once and then
      # programmatically PATCHED by later migrations, so its shipped body is in no
      # file and a grep is a guess. This replays the chain, calls hr_state_of on a
      # probe character and fails if the real key set is not the one
      # tests/no-client-copy-of-projection.baseline.json pins — i.e. the day a
      # migration adds a projection, this is red until the client half is mapped.
      # The TEXT half of the same guard (residue collisions, missing readers, the
      # raw-read ratchet) runs in client-guards with no database.
      - name: Projected key set — hr_state_of's real keys vs the client's pin
        if: ${{ !cancelled() }}
        run: node tests/no-client-copy-of-projection.mjs --execute

      # ── THE WORLD TICK, REGISTERED 2026-09-21 ──────────────────────────────
      # docs/planning/WORLD_TICK_DESIGN.md §13 asked for this the moment the
      # tick became a writer for any channel "and NOT LATER", and
      # tests/guards-unregistered.json carried the debt with that condition
      # written into it. 2026-09-21-world-tick-settle-fence.sql is that writer:
      # hr_tick_settle takes the player_state row lock, checks the lease,
      # compare-and-sets the settled watermark and then calls hr_apply. It
      # ships DISARMED (hr_tick_config.enabled = false, shadow = true), but a
      # disarmed writer is still a writer the moment somebody runs one UPDATE,
      # and a tripwire nothing runs is not a tripwire.
      #
      # All five arms cost ~9 s together against the restored snapshot, so they
      # sit in this job rather than earning one of their own.
      #
      # PARITY. The same engine, asked by two callers, must answer identically:
      # P-G1 compares N tick windows against one accrual call over the span
      # (exact — gathering has no rare roll, so a correct decomposition is equal
      # digit for digit), and P-G9 compares the SAME 90 s windows settled as
      # `caller:'tick'` against `caller:'accrue'` and demands a byte-identical
      # delta. AWAY-1's rule, on the channel the tick is about to own.
      # --mutate plants four defects (unaligned windows, a dropped fight
      # checkpoint, the cadence passed as capMs, a per-character constant seed
      # — that last one measured +48% gold and three rare drops at rate zero).
      - name: World tick — parity with the accrual path
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-parity.mjs
          node tests/world-tick-parity.mjs --mutate

      # ONE WINDOW IS PAID ONCE. The lane that staged the tick claimed two
      # defences against a replayed window and had one: Security executed the
      # "belt and braces" watermark claim and found hr_apply clamps the
      # TIMESTAMP and applies the VALUE regardless, so a replay carrying a fresh
      # version paid twice and moved accrued_to zero milliseconds
      # (SEC_WORLD_TICK_GATHER_2026-09-19.md S-3). This guard is the exit code
      # for the defence that closes it, plus the two rollout controls the
      # milestone is armed behind: the kill switch and SHADOW mode.
      #
      # --mutate re-runs every arm against RAW hr_apply — the pre-fence path,
      # which is production behaviour and not a synthetic defect — and requires
      # each one to go red. The two arms whose defence hr_apply ALREADY had (the
      # version compare-and-set) are marked as shared and do not invert; they
      # are regression arms, so neither path can quietly lose it.
      - name: World tick — one window is paid once, and only when armed
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-double-pay.mjs
          node tests/world-tick-double-pay.mjs --mutate

      # THE SECURITY VERDICT, AS AN EXIT CODE. Every arm of
      # SEC_WORLD_TICK_GATHER_2026-09-19.md, executed: the tick reaches the
      # writer only through the fence (S-1), the version CAS prevents a
      # tick/accrue double pay (S-2), a replayed window is refused on the
      # watermark alone (S-3), one gather roster call leases one channel and
      # returns the character once (S-4), and an honest deferral is no longer
      # counted as an overlap (S-5). It was RED BY DESIGN and deliberately
      # unregistered while the review was open; it is green, so it is here.
      - name: World tick — the security verdict, executed
        if: ${{ !cancelled() }}
        run: node tests/world-tick-writer-authz.mjs

      # THE SHADOW RUN MUST SURVIVE ITS OWN DRIVER
      # (SEC_WORLD_TICK_M1_2026-09-21.md finding M-1, P0, which BLOCKED the
      # cron file and SHADOW-on-production). The sibling above and
      # world-tick-double-pay both call hr_tick_settle DIRECTLY with a
      # window_from already chained on the shadow mark, so they prove the FENCE
      # chains and are blind to whether the DRIVER ever delivers the mark. No
      # test read hr_tick_cron_run's payload. That is how the lane was green and
      # wrong: while shadowed the tick pays nothing, accrued_to never moves, and
      # every fire after the first re-proposed the SAME window and was refused
      # window_already_settled — 1 shadow row per character where 1,920 are
      # expected over 48 h, so the parity measurement that GATES arming could
      # not be taken. The dangerous "fix" for that stall is to loosen the
      # watermark CAS, which is the double pay the step above exists to prevent.
      #
      # SC-3 is the built-in control and was green while SC-1/SC-2 were red,
      # which localised the defect to one jsonb_build_object key list. It was
      # RED BY DESIGN and deliberately unregistered while the review was open
      # (tests/guards-unregistered.json); it is green, so it is here.
      - name: World tick — SHADOW chains on its own watermark
        if: ${{ !cancelled() }}
        run: node tests/world-tick-shadow-chain.mjs

      # AND DOES THE ENTRY SPEAK THE TRANSPORT IT DEPLOYS ON?
      # (SEC_WORLD_TICK_M1_2026-09-21.md OP:TICK REVIEW findings T-1 and T-2,
      # both P0.) tests/edge-tick-gate.mjs drives the same entry and was GREEN
      # through both of them, because its `exec` stub answered `select now()`
      # with an ISO STRING while `postgres` — and PGlite — parse OID 1184 into a
      # JS Date. The entry did `String(<Date>)` and handed the result back as a
      # `$::timestamptz`, which Postgres refuses (22P02), so probeWatermark —
      # the FIRST engine statement of every character of every fire — threw, the
      # fire still answered HTTP 200, and the 48 h shadow parity run that GATES
      # arming would have journalled zero rows with every dashboard green.
      #
      # The same class covers the per-window PRNG label: hr_seed hashes the
      # LABEL, and the accrue path spells the instant the way Postgres renders a
      # timestamptz into JSON (`.739123+00:00`, index.ts:785) while the tick and
      # the roster spelled it `.739Z`. Same instant, different stream, so the
      # parity number would have measured the PRNG rather than the tick.
      #
      # So this file uses the transport: a real Postgres, the shipped `runTick`
      # driving its own round trips through it, tick.js's own SEED_LABEL_EXPR
      # and hr_tick_roster itself — no arm quotes the source back at itself.
      # EC-1c, EC-2b, EC-2c and EC-3d are the negatives and they stay: EC-2c in
      # particular pins a property nothing else asserts (the watermark probe is
      # WRITE-CAPABLE and what stops it is hr_tick_settle step (7)'s null-version
      # refusal — Security I-5). It was RED BY DESIGN and deliberately
      # unregistered while the review was open; it is green, so it is here.
      - name: World tick — the entry against the transport it deploys on
        if: ${{ !cancelled() }}
        run: node tests/world-tick-edge-contract.mjs

      # EC-3d, the control, carries its own proof since 2026-09-22. It shipped
      # asserting the literal `+00:00` on the accrue path's rendering, which is
      # the replay session's TimeZone talking — PGlite takes that GUC from the
      # host's UTC offset — so the arm was red on any machine off UTC and green
      # here, where the runner is UTC, with a failure message naming a spelling
      # collision that had not happened. Database-free and milliseconds: the
      # verdict is a pure function of three renderings and a label hash, and
      # --selftest plants four defects in it (a converged tick spelling, a
      # converged roster spelling, a canonicalising hr_seed, an accrue rendering
      # that is no longer Postgres's) plus the two negative controls — a UTC
      # session and an off-UTC one — that must stay silent. Per C4 the plain run
      # above stays registered: only it answers "is this green when it should
      # be" against the real Postgres renderings.
      - name: World tick — EC-3d control, mutation proof
        if: ${{ !cancelled() }}
        run: node tests/world-tick-edge-contract.mjs --selftest

  # ── utc-midnight-replay ── SPLIT OUT OF db-replay 2026-09-19 (b550). The
  # GitHub run on ab7572e7 (branch next) measured db-replay's own steps: PGlite
  # snapshot cache 46 s, schema drift 73 s, THIS GUARD 411 s, ledger rollup
  # 44 s, catalogue literal drift 38 s, live-hash drift 38 s, rejections
  # journal 102 s (752 s so far) — then buff-queue was CANCELLED at 73 s by the
  # job's own `timeout-minutes: 14`, with eleven more steps never run. No
  # failing assertion anywhere in it: the family had simply outgrown its
  # budget the moment this guard was registered (2026-09-17).
  #
  # This guard runs every arm with HR_PGLITE_CACHE=0 — a cached arm restores a
  # snapshot instead of replaying the chain and proves nothing about the UTC
  # clock (see the guard's own header) — so it shares no snapshot with
  # db-replay's other guards and gets no PGlite-cache-verify step of its own:
  # there is no cache here to verify.
  #
  # MEASURED 2026-09-19 on the GitHub run for ab7572e7: 411 s (6.85 min).
  # Budget = measured x2 = 13.7 min, rounded up to 14.
  utc-midnight-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # THE CHAIN MUST REPLAY AT EVERY SECOND OF THE DAY. From 2026-08-29 to 2026-09-17 this
      # job went red whenever a run started within seconds of UTC midnight: section-4
      # self-check fixtures backdated rows with `now() - interval` and read them back
      # through hr_utc_day_start(now()), so just after midnight they landed in
      # yesterday and the chain refused to apply. The guard parks the clock around the
      # boundary (in the fixture's own clock) and replays; --selftest proves it bites.
      - name: UTC midnight replay — the chain applies at every second of the day
        if: ${{ !cancelled() }}
        run: |
          node tests/utc-midnight-replay.mjs
          node tests/utc-midnight-replay.mjs --selftest

  # ── economy-selftests ── THE MUTATION HARNESSES. Twenty guards that each plant
  # 8-45 real defects in real migration text and demand every one turns the
  # guard red. Before the snapshot cache these replayed the whole chain per
  # mutation — several hundred replays per run, and the arithmetic that put the
  # b514 run through a 50-minute timeout.
  #
  # They are grouped because they share exactly one input: the applied chain.
  # One job builds the snapshot once and every guard after it restores.
  #
  # MEASURED 2026-09-07: 20/20 green in 895.2 s (14.9 min); the two longest are
  # conservation-fuzz 270.9 s and attended-loot-credit 94.9 s. The 2026-09-07
  # merge re-slotted three more steps here — goal-counter-kinds --selftest
  # (49.2 s; it replays the chain in PGlite, which is exactly this family's one
  # shared input) and worker-accrual --selftest + base run (6.2 s, a pure engine
  # harness but an ECONOMY faucet) — taking the family to 950.6 s (15.8 min).
  # Budget RAISED 30 -> 32, still measured x2.
  economy-selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 32

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # node_modules, NO browser. `playwright install --with-deps` is ~2 minutes
      # and buys nothing for a guard that never opens a page, so it stays in the
      # in-page job. The install itself runs in every family: a job that fails on
      # a dependency it did not know it had is a red build with no failing
      # assertion in it, and that is the class this whole slice is about.
      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # THE RENOWN FAUCET'S MUTATION HARNESS — the half that proves the guard
      # itself can fail. The guard already runs inside run-smoke; its --selftest
      # was wired into NOTHING, which is the restore-census mistake below,
      # repeated. Worse, until 2026-08-31 it graded ANY throw as a catch: eight
      # of eleven mutations demonstrated only "the apply threw", and a reviewer's
      # SYNTAX-ONLY non-defect duly reported ✓ CAUGHT. Every mutation now names
      # WHICH mechanism must catch it (the migration's own §3 gate, or this
      # file's assertions) and a regex the catch must MATCH; a syntax error or an
      # unplantable anchor is classified HARNESS and exits 2; and two permanent
      # NEGATIVE CONTROLS — the reviewer's syntax-only plant and a comment-only
      # plant — must never read as catches. Making `by` explicit also exposed
      # that R2's counter equality, R6 and R9 had no mutation that reached them
      # at all (§3 refused every defect aimed at them first), so all three were
      # assertions nothing had ever fired; they now have gate-blind twins.
      # 14 mutations + 2 controls, ~2 minutes of real PostgreSQL.
      - name: Renown faucet — every mutation caught by its NAMED assertion
        if: ${{ !cancelled() }}
        run: node tests/renown-kill-faucet.mjs --selftest

      # THE BOUNTY-HUNTER XP MUTATION HARNESS — same lesson as the step above,
      # applied on the way IN rather than after the fact. The guard itself runs
      # inside run-smoke; this is the half that proves it can fail.
      #
      # It matters more here than usual because of WHAT the guard is watching.
      # Bounty-Hunter XP was never credited by any server code for the whole
      # life of the beta (production 2026-09-05: 36 characters, max(xp) = 0), so
      # every board tier above 1 was unreachable for every player — and nothing
      # in the repo noticed, because no test had ever driven the credit at all.
      # The regression that would bring it back is a LATER migration restating
      # hr_claim_bounty__ungated from a stale template, at which point the
      # migration's own §2 gate never runs and only this guard is left standing.
      # SEVEN of the fifteen mutations are therefore repeated with that gate
      # short-circuited, so the ✓ is the guard's and not the migration's.
      # 15 mutations, ~2.5 minutes of real PostgreSQL.
      - name: Bounty-Hunter XP — every mutation caught, gate-blind twins included
        if: ${{ !cancelled() }}
      # ⬇ THE FLOOR UNDER EVERY MUTATION PROOF (2026-09-12, tests/guard-hygiene.mjs
      # RULE 5). Each of the 22 steps below used to register ONLY the --selftest arm.
      # A security review planted `where kind = NOSUCHCOLUMN_XYZ` in a guard's OWN SQL:
      # every arm threw, the driver read each throw as "the guard went red", and the step
      # printed "All 6 mutations caught", exit 0 — while the plain run of the same file
      # was RED. A proof arm answers "can this go red"; only the plain arm answers "is it
      # green when nothing is wrong", and it runs FIRST for that reason. Cost measured
      # locally: ~110 s total for all 22. tests/snapshot-allowlist-guard.mjs is the
      # standing proof the plain arm carries information the proof arm does not — its
      # plain run is red on today's tree with its --selftest green beside it.
        run: |
          node tests/bounty-hunter-xp.mjs
          node tests/bounty-hunter-xp.mjs --selftest

      # SA-048: crediting Bounty-Hunter XP (b504, the step above) made the board a
      # RANKED surface, but hr_accept_bounty gated the target TIER by SERVER COMBAT
      # level ONLY. The board's DIFFICULTY ladder is client-only: slot-3 'hard'
      # appears only at BH>=15 and 'elite' is never board-generated, so a BH-1
      # caller could pass difficulty='hard' directly and buy the 1.3x XP
      # multiplier on the ranked skill. (The first draft also clamped the TIER to
      # a board-tier ladder; Security proved that premise FALSE — the board posts
      # unlockedTier(combatLevel), combat only — so the clamp was REMOVED as an
      # honest lockout and this is difficulty-only.) The guard drives a REAL
      # character through the rate-gated hr_accept_bounty on a replayed chain,
      # proves an honest tier-6 accept at BH-1 is NOT locked out, and replays the
      # chain a SECOND time stopping before the migration to prove an honest
      # accept is byte-identical. Like the two guards above it is STAGED-migration
      # and had no step of its own — it gets parity here: 8 mutations (four, each
      # twinned with the migration's own §3 short-circuited so the ✓ is the
      # guard's and not the migration's). No credentials.
      - name: Bounty-accept BH-clamp — difficulty gated by BH level, honest tier not locked out
        if: ${{ !cancelled() }}
        run: |
          node tests/bounty-accept-bh-clamp.mjs
          node tests/bounty-accept-bh-clamp.mjs --selftest

      # MAX HP IS THE HITPOINTS LEVEL — and on the server it never was. max_hp was
      # stamped once at character creation (hr_start_kit, 10) and no credit site
      # ever moved it again, so every server-resolved fight ran at a 10 HP ceiling
      # and Auto-Eat's percentage threshold was scaled to 10 with it. The fix is a
      # derivation attached to the DATA (an AFTER trigger on player_skills) rather
      # than a copy of the rule inside each of the six RPCs that credit hitpoints
      # XP, so it cannot drift; the migration also backfills every existing
      # character from its own persisted XP. It gets a step of its own for the
      # reason the loot-credit one above did: the guard drives the real rate-gated
      # hr_credit_combat_xp AND hr_apply on a replayed migration chain, and it is
      # the ONLY thing that can see a broken BACKFILL — on a fresh replay no
      # character exists yet, so the migration's own VERIFY block passes on a
      # backfill that corrects nothing. 9 mutations, one gate-blind. No credentials.
      - name: Max HP tracks hitpoints — attended, settle, backfill, raise-only
        if: ${{ !cancelled() }}
        run: |
          node tests/max-hp-tracks-hitpoints.mjs
          node tests/max-hp-tracks-hitpoints.mjs --selftest

      # The attended-loot top-up is the OTHER half of the beta-2 progression
      # wall (production 2026-09-04: ~62% of an attended fight's drops were
      # credited, the settle re-simulating the session as if the player had
      # been away). Its guard drives the REAL computeAccrual (A1-A10) and
      # replays the whole migration chain into in-process PostgreSQL (C1-C9).
      # Unlike the renown and Bounty-Hunter guards it had NO step of its own —
      # it ran only inside run-smoke (step 6), so a CI-specific failure in it
      # was indistinguishable from any other step-6 failure and left no
      # readable signal. It gets parity here: 26 mutations, and the clean
      # control the --selftest re-runs per arm proves the guard passes in CI
      # in its own right. No credentials; production untouched.
      - name: Attended loot-credit — top-up bounded, loot-only, botd per UTC-day segment
        if: ${{ !cancelled() }}
        run: |
          node tests/attended-loot-credit.mjs
          node tests/attended-loot-credit.mjs --selftest

      # THE DUNGEON-SCRIP SERVER-OF-RECORD GUARDS (SA-015, docs/design/
      # dungeon-settlement.md). Report #3 was "dungeon scrip goes to 0 on reload"
      # — scrip minted client-side, wiped by the blob-retired rebuild. These prove
      # the server-of-record fix END TO END on the REAL migration chain (PGlite):
      # the earn (hr_dungeon_settle) with its 5,000-gross / 250-count daily fuses
      # and the Condition-3 rule that a Quartermaster SPEND (negative meta.scrip)
      # can never net down the earn cap; the spend (hr_quartermaster_buy) server-
      # priced + debit-once + replay-safe; the marketability shape (scrip/keys
      # BoP, blueprints/deed tradeable — Tyler b268); and the reload survival
      # itself (hr_state_of projects the balance, record.js reads it back). Each
      # --selftest plants real defects and demands every one turns the guard RED.
      # The GREEN pass is the PLAIN line in each step below. (It used to say it ran
      # "inside run-smoke's dungeonServerGuardsPreflight" — there is no such function
      # in tests/run-smoke.mjs and there never was, so until 2026-09-12 no CI job ran
      # these four guards' plain bodies at all.)
      - name: Dungeon settle — scrip earn, positive-only cap, 250-count cap, key gate
        if: ${{ !cancelled() }}
        run: |
          node tests/dungeon-settle.mjs
          node tests/dungeon-settle.mjs --selftest

      - name: Quartermaster buy — server-priced, debit-once, replay-safe, negative spend row
        if: ${{ !cancelled() }}
        run: |
          node tests/quartermaster-buy.mjs
          node tests/quartermaster-buy.mjs --selftest

      - name: Dungeon marketability — scrip/keys BoP, blueprints/deed stay tradeable
        if: ${{ !cancelled() }}
        run: |
          node tests/dungeon-marketability.mjs
          node tests/dungeon-marketability.mjs --selftest

      - name: Dungeon scrip reload — report #3, scrip survives reload not reset to 0
        if: ${{ !cancelled() }}
        run: |
          node tests/dungeon-scrip-reload.mjs
          node tests/dungeon-scrip-reload.mjs --selftest

      # THE RE-ENTRY COOLDOWN (b536 residue-ahead census item 5,
      # supabase/migrations/2026-09-12-dungeon-cooldown.sql). The cooldown was
      # `G.dungeons.lastRun[id]` — a CLIENT CLOCK stamp in the residue — and under
      # the settle arm the client stopped stamping it at all, so canRun() always
      # said "ready" while the server refused an AUTO re-entry and let a MANUAL one
      # through unlimited. Dungeon loot is mostly ordinary TRADEABLE material, so
      # that was a faucet reachable with no clock tampering. This proves the window
      # is now derived from the append-only ledger's server-stamped `at` plus the
      # catalogue cooldown_s divided by the mode's DIVISOR, and that NO MODE IS
      # EXEMPT (game-designer ruling 2026-09-12: a mode chosen by the client selects
      # the window's LENGTH — auto 1, manual 1, scavenger 4 — never its existence,
      # because the payout is identical in all three). It also proves an unauthored
      # scavenger run is refused `bad_mode` from the catalogue flag, the refusal
      # costs no key/scrip/version and is journalled, the map is projected as
      # `dungeon_cooldowns` per dungeon PER MODE for ACTIVE windows only, per
      # (user, slot, dungeon), and a forged payload timestamp moves nothing.
      # 11 mutations, each required to turn it RED.
      # The PLAIN run is registered beside the mutation proof on purpose (Security
      # R2, 2026-09-12): a --selftest loop scores a THROW as RED, so a defect that
      # merely breaks the migration makes every arm "caught" and the suite exits 0.
      # The guard now runs its own clean baseline first AND CI runs it standalone, so
      # the green is a measurement in its own right. The same shape exists in the
      # dungeon/QM steps above and is a harness lane's to sweep.
      - name: Dungeon cooldown — server-derived window, every mode binds, projected
        if: ${{ !cancelled() }}
        run: |
          node tests/dungeon-cooldown.mjs
          node tests/dungeon-cooldown.mjs --selftest

      # THE TWO SERVER-OWNED FARM FACTS THAT WERE LOST ON RELOAD (Q-2 + Q-5,
      # supabase/migrations/2026-09-06-state-of-farm-projection.sql). hr_state_of
      # projected NEITHER player_state.plot_level nor player_farm.waterings, so a
      # paid Plot Lv 3 read back as Lv 1 (unlocked seeds gone, the Upgrade button
      # quoting the wrong tier's price) and a crop watered 4-8x came back with a
      # ONE-element history, its client isReady disagreeing with the server's and
      # stranding a ready crop behind a Water button. The guard drives the WHOLE
      # path on a replayed chain: the real hr_farm_upgrade_plot / hr_farm_water
      # write the rows, hr_state_of projects them, the real accrue.js
      # reconcileFarm rebuilds a FRESH G, and src/core/farm.js growthHours() on
      # the rebuilt plot must EQUAL hr_farm_growth_hours() on the server row --
      # the agreement check, which a projection that is array-SHAPED but not
      # array-VALUED fails while passing every key-existence assertion.
      # 5 defects x 2 arms; the gate-blind arm short-circuits the migration's own
      # SEC-2 commit gate so the tick is the guard's and not the migration's.
      # No credentials; production untouched.
      - name: State-of farm projection - plot tier and watering history survive a reload
        if: ${{ !cancelled() }}
        run: |
          node tests/state-of-farm-projection.mjs
          node tests/state-of-farm-projection.mjs --selftest

      # THE LAST AWAY-CLASSIFIED RECEIPT (ruling 2026-09-07,
      # supabase/migrations/2026-09-07-last-away-receipt.sql). A receipt the
      # server PAID is progression, not preference: G.lastOfflineSummary is a
      # NO_SYNC field (src/net/events.js:93), so ONE reload deleted the Home
      # "While you were away" card, the welcome-back modal and the combat recap
      # for a night the server had already paid, journalled and banked.
      # The feature can fail in two OPPOSITE directions and the guard asserts
      # both: it can write TOO LITTLE (the card is still empty), or TOO OFTEN --
      # a receipt on every 90 s settle is ~40 column writes/hour/character on the
      # hottest row in the database, which is the game_events mistake with a new
      # name (1.6M rows / 229 MB from SIX players in FOUR days).
      # It grades the SHIPPED code, not a transcription: awayReceiptFor lives in
      # supabase/functions/hr-accrue/away-receipt.js (plain ESM, imports in Node
      # AND Deno) exactly so this file can import what deploys, and hr_apply is
      # CALLED FOR REAL on a replayed chain -- the builder's own output lands, is
      # projected, round-trips through summaryFromAway and survives a settle that
      # omits the key, while sync-sized / over-window / oversized / unknown-key /
      # negative / gold-over-delta / window-less / non-object receipts are all
      # refused with bad_receipt. It also holds the two allowlists and the three
      # copies of SYNC_MAX_MS to each other, and proves index.ts recomputes the
      # receipt on EVERY degrade attempt (the ladder halves the span; a receipt
      # computed once would be refused as sync-sized and 409 the whole absence).
      # 8 mutations; the four SQL arms are run GATE-BLIND (the migration's own
      # SEC4 short-circuited) so the tick is the guard's and not the migration's.
      # No credentials; production untouched.
      - name: Away receipt journal - the night the server keeps, and the 90s one it must not
        if: ${{ !cancelled() }}
        run: node tests/away-receipt-journal.mjs --selftest

      # Security C4 (2026-09-06): a --selftest-only registration cannot tell a broken
      # migration from a working guard (every arm throws either way). Run the base too.
      - name: Away receipt journal - base run (the migration itself is green)
        if: ${{ !cancelled() }}
        run: node tests/away-receipt-journal.mjs

      # SA-010 / Q-4: PURCHASED BANK SPACE WAS ENFORCED AT THE BASE CAP.
      # hr_unlock_buy sells bank space as a 30-rung ladder and files it as a
      # player_progress unlock row; NOTHING ever wrote player_state.bank_cap,
      # which is the only number hr_apply's bank_full check reads. Ten paid rungs
      # = client cap 300, server cap 100, and every item-touching apply past 100
      # stacks refused. The guard drives the REAL hr_unlock_buy and the REAL
      # hr_apply on a replayed chain (PGlite, no credentials): the ladder is
      # measured back against src/data (the `20` per rung is the one magnitude no
      # server catalogue carries), the boundary is driven at the cap and one past
      # it, and the chain is replayed a SECOND time stopping BEFORE the migration
      # to REPRODUCE the bug and then prove the backfill heals it. 14 mutations
      # (seven, each twinned with the migration's own §5/§6 short-circuited so the
      # ✓ is the guard's and not the migration's).
      - name: Bank cap tracks rungs — purchased bank space is the enforced bank space
        if: ${{ !cancelled() }}
        run: node tests/bank-cap-rungs.mjs --selftest

      # Security C4 (2026-09-06): a --selftest-only registration cannot tell a broken
      # migration from a working guard (every arm throws either way). Run the base too.
      - name: Bank cap tracks rungs — base run (the migration itself is green)
        if: ${{ !cancelled() }}
        run: node tests/bank-cap-rungs.mjs

      # THE FREE CREW (live 2026-09-09, b527). hr_worker_hire read its paid crew
      # cap as coalesce(greatest(0, least(max(pp.value), 6)), 0) — and LEAST/GREATEST
      # DROP null arguments, so a player who had bought NOTHING got least(NULL,6)=6
      # and up to six workers for zero gold. This drives the REAL hr_unlock_buy and
      # the REAL hr_worker_hire on a replayed chain (PGlite, no credentials): the
      # unpaid hire must be refused with paid_cap 0, the six-rung price must be the
      # one src/data/gold-ladders.js declares, the paid path must debit 500g exactly
      # once, and the chain is replayed a SECOND time stopping BEFORE the migration
      # to REPRODUCE the bug. Four mutations, each required to be caught.
      - name: Worker hire cap — an unpaid crew cap is zero, not six
        if: ${{ !cancelled() }}
        run: node tests/worker-hire-cap.mjs --selftest

      # Security C4 (2026-09-06): a --selftest-only registration cannot tell a broken
      # migration from a working guard. Run the base too.
      - name: Worker hire cap — base run (the migration itself is green)
        if: ${{ !cancelled() }}
        run: node tests/worker-hire-cap.mjs

      # THE RECOVERY RULE'S SQL HALF (First-Night Idle Rescue, rev. 2).
      # A death INTERRUPTS a run; it does not terminate it. The JS half -- the
      # escalating ladder, the 40% resume, the gating of every payable kind --
      # is asserted by tests/accrual-engine.mjs RECOVER-1..8 inside run-smoke.
      # THIS is the half that lives in Postgres, driven against the real ordered
      # migration chain: hr_rest (the food-only relief valve) eats from the
      # SERVER's bag and clears the timer, is all-or-nothing, is replay-safe, and
      # refuses a free cure / a character who is up / an unpaid window; hr_apply
      # writes recovering_until absolute, ADMITS an honest 64-minute ladder stamp
      # (the assertion that would have caught rev. 1's 15-minute ceiling silently
      # deleting the top four rungs in production), refuses a forgery, and is NOT
      # voided by an activity switch; the death ledger is one value-free row per
      # death and BOUNDED; hr_set_auto_eat stamps the touch on every call so the
      # one-time switch-on offer cannot be made twice; and the ladder's two
      # counters survive a truncated `progress` array, which is the whole reason
      # they are projected as their own scalars.
      # 13 mutations, no credentials, production untouched.
      - name: Recovery rule - hr_rest, the ladder ceiling, the death ledger, the auto-eat stamp
        if: ${{ !cancelled() }}
        run: |
          node tests/recovery-rest.mjs
          node tests/recovery-rest.mjs --selftest

      # THE HEARTHFIND (Feature Slate 2) -- the super-rare drop moment.
      # THE CATALOGUE IS GENERATED, NEVER HAND-TYPED. hr_hearthfind_items /
      # hr_hearthfind_sources are machine-written from src/data/hearthfind.js +
      # src/data/items.js; a hand edit to the .sql is reverted by the next
      # generation, and here the copy would be the CLAMP on the rarest odds in the
      # game, so drift would silently widen them.
      - name: Hearthfind catalogue - generated from src/data, never hand-typed
        if: ${{ !cancelled() }}
        run: node tools/gen-hearthfind.mjs --check

      # THE ENGINE HALF + THE MINT GUARD. The roll is seeded and replayable (an
      # away grant that cannot be re-derived cannot be audited); a source with NO
      # table row draws NO random number, which is what keeps every pre-existing
      # seeded replay byte-identical to its pre-Hearthfind self; an away span and
      # an attended replay find the SAME trophy at the SAME tick (AWAY-1, one
      # engine); no drop multiplier, dropRate buff or featured boss moves the roll
      # at all ("must NOT be boostable by anything paid"); there is exactly ONE
      # roll site per engine file and NONE in legacy.js (AWAY-12); and no trophy
      # is tradeable, vendorable, a priced currency, or reachable from any other
      # faucet -- drop table, recipe, start kit, dungeon loot or Quartermaster.
      # 7 mutations, no credentials, production untouched.
      - name: Hearthfind - the seeded roll, AWAY-1 parity, and the mint guard
        if: ${{ !cancelled() }}
        run: |
          node tests/hearthfind-roll.mjs
          node tests/hearthfind-roll.mjs --selftest

      # THE MEASUREMENT BEHIND THE ODDS (Designer ruling 2026-09-08 SS4).
      # A hearthfind is authored as EXPECTED HOURS at its source and the build
      # derives the per-roll denominator: nodes from the node's own `ms`, bosses
      # from a MEASURED kills/hour. For a node that is self-checking; for a boss
      # it is a number somebody wrote down -- and every other guard in the repo
      # still passes if it is wrong, because expected_hours is oneIn/killsPerHour
      # and oneIn is round(killsPerHour x hours), i.e. the band is true by
      # construction whatever the rate says. This step re-measures the rate with
      # the ONE engine (simulateSpan, 1 h, fixed seed, the tier-8 level-90 band
      # character, fed) and demands the pinned number match EXACTLY, so a combat
      # balance change that moves the kill rate turns this red instead of
      # silently retuning the rarest event in the game. It also enforces the
      # ruling's BOSSES-ONLY rule on combat sources (the cut goblin row).
      # 4 mutations + a clean-tree negative control, no credentials, no DB.
      - name: Hearthfind - the boss kill rate IS what the one engine does
        if: ${{ !cancelled() }}
        run: |
          node tests/hearthfind-boss-rate.mjs
          node tests/hearthfind-boss-rate.mjs --selftest

      # THE SQL HALF, ON A REAL DATABASE (PGlite, the ordered migration chain).
      # An honest find pays ONE trophy + ONE ledger row + ONE broadcast + a
      # receipt, with the SERVER's odds read from the catalogue (there is no delta
      # field that could supply them); every shape forgery is bad_hearthfind and
      # moves nothing; the ordinary `items` delta CANNOT mint a trophy, so the
      # hearthfind arm is the only door and "broadcast what the ledger journalled"
      # is true by construction; the 3-per-UTC-day clamp DROPS the find without
      # costing the player the rest of the apply; the 30-second clamp suppresses
      # only the public line, never the value; world_finds is public-read and
      # client-unwritable; and re-applying the migration is a no-op.
      # 15 mutations, no credentials, production untouched.
      - name: Hearthfind - hr_apply grants, journals, broadcasts, and clamps
        if: ${{ !cancelled() }}
        run: |
          node tests/hearthfind-authority.mjs
          node tests/hearthfind-authority.mjs --selftest

      # SECURITY F1 -- THE ATTENDED HALF OF THE SAME RULE.
      # The Recovery Rule shipped with a hole its own header named: the AWAY path
      # pays nothing inside the window, but the ATTENDED cadence RPCs
      # (hr_credit_kills__ungated / hr_credit_combat_xp__ungated) did NOT floor
      # their credit window at recovering_until, so a MODIFIED client could keep
      # reporting kills and combat XP straight through a knockout and be paid at
      # the physical cap -- and those are the RANKED surfaces (combat XP is the
      # server-sourced leaderboard number; the kill counters are graded by
      # hr_renown_of and PAID by hr_claim_daily). This asserts the floor exists in
      # BOTH bodies and in all THREE windows (the bounty-free anchor, the bounty
      # accepted_at window, the combat-XP watermark), that a knockout credits ZERO
      # with a named reason, that the migration is an ANCHORED PATCH rather than a
      # restatement (a restated hr_credit_kills__ungated would silently delete the
      # renown credited counters), that the refusal writes nothing and therefore
      # retires no unpaid watermark, and that its audit row is bounded to one
      # value-free row per character per UTC day.
      # 14 mutations, static, no credentials, production untouched.
      # (`--replay` additionally reads the same properties off a rebuilt pglite
      # chain; not run here because schema-drift already replays the chain.)
      - name: Recovery floor - the attended cadence RPCs obey recovering_until
        if: ${{ !cancelled() }}
        run: |
          node tests/cadence-recovery-floor.mjs
          node tests/cadence-recovery-floor.mjs --selftest

      # THE CONSERVATION FUZZ. Randomised, seeded operations across several
      # characters against the REAL server-authority migrations, running on an
      # in-process PostgreSQL — no database credentials, no branch, nothing to
      # clean up. --selftest runs the clean pass AND plants ten known
      # conservation violations, demanding that every one of them is caught: a
      # fuzz that cannot fail on a planted bug is decoration, and this repo has
      # shipped six always-null probes. Bounded op count here (~25s); soak with
      # `npm run test:conservation:soak`.
      - name: Conservation fuzz + injection selftest
        if: ${{ !cancelled() }}
        run: |
          node tests/conservation-fuzz.mjs --ops=400
          node tests/conservation-fuzz.mjs --selftest --ops=400

      # THE PLAYER INTENTS. Both run the REAL Edge-Function modules — the same
      # bytes tools/pack-edge.mjs ships — behind their one injected `exec` seam,
      # against the REAL migration chain on an in-process PostgreSQL.
      #
      # ⚠ activity-intent was NOT ON THIS LIST until b349, and it should have
      #   been from the day it landed: 27 mutation-proven invariants that
      #   nothing on any push ever ran. It is the whole contract the other eight
      #   intents copy. Found while wiring the second intent in, which is the
      #   ordinary way a coverage hole surfaces — the second time you do a thing.
      - name: The activity intent — collect-before-switch, replay, key hygiene
        if: ${{ !cancelled() }}
        run: node tests/activity-intent.mjs --selftest

      # THE GRANT INTENT (b349). The first intent that MOVES MONEY, so the
      # invariants are about payment: a claim lands exactly once, the price and
      # the period and the streak are all the server's, a replay receipts
      # nothing, and one key reused on a later day is a loud intent_mismatch
      # rather than a silent no-op. --selftest plants 23 regressions and demands
      # every one is caught.
      - name: The grant intent — claim once, server-priced, server-dated
        if: ${{ !cancelled() }}
        run: |
          node tests/claim-intent.mjs
          node tests/claim-intent.mjs --selftest

      # THE CLAN JOURNAL INVARIANT (F1 + F3, 2026-08-13). "Every RPC that writes
      # a shared table emits a clan_ledger row in the same transaction" — proven
      # by calling the real RPCs on an in-process PostgreSQL with the real clan
      # migration chain applied, not by a regex over migration text. --selftest
      # plants seven regressions; FOUR of them are invisible to the migrations'
      # own commit gates and are caught only here.
      - name: Clan journal + per-day caps (F1/F3)
        if: ${{ !cancelled() }}
        run: |
          node tests/clan-journal-guard.mjs
          node tests/clan-journal-guard.mjs --selftest

      # THE ANON RATE GATE (F4, 2026-08-13). Reproduces Security's probe — 30
      # anonymous calls against a limit of 20 must produce refusals — with the
      # authenticated control that made the original finding legible, plus the
      # forged-x-forwarded-for test that separates a real key from a decorative
      # one. Must stay green before A11's server half is applied.
      - name: Anon rate gate (F4)
        if: ${{ !cancelled() }}
        run: |
          node tests/anon-rate-gate.mjs
          node tests/anon-rate-gate.mjs --selftest

      # THE HUNT BAND. Proves, by running the real migration bodies on an
      # in-process PostgreSQL, that the retired median rule DID let one member's
      # honest good week pay a teammate nothing, that the shipped rule does not,
      # and that a free-rider still collects nothing either way. --selftest
      # mutates the real fix SQL five ways and demands every mutation is caught.
      - name: Hunt band — denial before, gone after, free-rider still refused
        if: ${{ !cancelled() }}
        run: |
          node tests/raid-band-denial.mjs
          node tests/raid-band-denial.mjs --selftest

      # THE BACKFILLED LIFETIME PLANT COUNTER MUST STAY UNPAYABLE (Security P2 on
      # supabase/migrations/2026-09-07-farm-plant-lifetime-counter.sql). That file
      # backfilled a lifetime stat/'ev:planted' row for 27 (user, slot) pairs from
      # the plant ledger - a stock of already-completed work that no catalogue
      # grades today. Two independent paths could make it payable, and neither is
      # covered by the other: a row in hr_goal_rewards naming a lifetime kind
      # (now refused by a CHECK constraint), and a fifth branch in
      # hr_claim_quest__ungated's hardcoded CASE over LIFETIME stat keys, which
      # no constraint anywhere can reach. The guard proves the constraint EXISTS,
      # is VALIDATED and bites (an executed counter_kind='stat' insert must raise
      # 23514 after a control insert succeeds), that the quest body names no
      # ev:planted, AND - the property that actually matters - drives a character
      # holding 40x the target as a LIFETIME counter through the real
      # hr_goal_state / hr_claim_goal and requires have=0 and a 'not_complete'
      # refusal, with a non-vacuity arm showing the same reads do say yes to a
      # real daily counter. 4 defects x 2 arms (gate / SEC-4-blind) plus a GREEN
      # control that deletes the CREATE TABLE's inline check so the migration's
      # own ADD path is exercised rather than assumed. No credentials.
      - name: Goal counter kinds - the backfilled lifetime ev:planted stock cannot be claimed
        if: ${{ !cancelled() }}
        run: |
          node tests/goal-counter-kinds.mjs
          node tests/goal-counter-kinds.mjs --selftest

      # ORPHAN ADOPTED. W1-W13 on the shipped hired-crew accrual engine. Its
      # header claimed run-smoke.mjs invoked it; nothing did, so thirteen
      # assertions about an economy faucet went uncollected. --selftest plants
      # six real rebalances/refactors against a scratch copy of the engine —
      # including WA6, which proved the file's own "no second copy" assertion
      # was vacuous (=== on a number cannot tell a re-export from an equal
      # mirror, the exact state b389 shipped at 1.60x from). Now structural.
      - name: Hired-crew accrual — mutation proof
        if: ${{ !cancelled() }}
        run: node tests/worker-accrual.mjs --selftest

      - name: Hired-crew accrual — base run
        if: ${{ !cancelled() }}
        run: node tests/worker-accrual.mjs

  # ── client-guards ── STATIC AND SOURCE-SCANNING GUARDS: censuses, ratchets,
  # parity checks, the cache-buster invariant. No database, no browser, no
  # network; the whole family is text in this repository. Seconds, not minutes —
  # which is the point of separating it: a red ratchet should be readable in the
  # Actions list one minute after the push, not forty.
  #
  # MEASURED 2026-09-07 on the merged tree: 35/35 green in 122.7 s (2.0 min) —
  # thirteen more steps than before the merge for LESS wall clock, because every
  # one of them is a text scan (no-client-farm-mint, no-duplicate-rpc-callers,
  # no-blob-branches, window-globals-exist, signup-door x2, guard-hygiene x2 and
  # bump-version.sh --selftest at 12.3 s, the heaviest of them). That line was
  # never revised after the b550 guard wave (hr_apply/hr_state_of final-body
  # execution, dead-export/dead-CSS censuses, monolith and patch-chain guards)
  # more than doubled the family: the 5-min budget was still the ORIGINAL
  # 2.0-min floor, not a re-measurement.
  #
  # RE-MEASURED 2026-09-20: the GitHub runs for ab7572e7 and 7120434 (branch
  # next) both completed the full 39-step family at 255-258 s (4.3 min); the
  # run for 7b509de8 was CANCELLED by the stale 5-min (300 s) timeout mid
  # "hr_state_of final body" — no failing assertion, a margin of ~40 s over the
  # measured total instead of x2. No single step regressed: cross-run step
  # times differ by 10-20 s each (e.g. "hr_apply final body" 58-59 s vs 78 s,
  # "Cleanup slice 3 - dead export census" 68 s vs 79 s), consistent with
  # shared-runner variance rather than a code change — the commit between the
  # green runs and the cancelled one touched only smoke.yml, ci-shape.baseline
  # .json and a lane-done.mjs comment. Budget = measured (258 s) x2 = 8.6 min,
  # rounded up to 9.
  client-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # node_modules, NO browser. `playwright install --with-deps` is ~2 minutes
      # and buys nothing for a guard that never opens a page, so it stays in the
      # in-page job. The install itself runs in every family: a job that fails on
      # a dependency it did not know it had is a red build with no failing
      # assertion in it, and that is the class this whole slice is about.
      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # THE SHAPE OF THIS FILE IS ITSELF A GUARD. The matrix above is six jobs;
      # a step can be dropped while moving between them, land in two jobs, or be
      # added while run-ci-local stops enumerating it -- and none of those shows
      # up as red, because four jobs go green and the fifth simply never had the
      # step. This asserts the partition: every guard command in exactly one job,
      # every registered command still present, every job with a timeout and a
      # checkout, and run-ci-local --list still covering the whole matrix.
      # --selftest plants one defect per assertion and two negative controls.
      - name: CI shape - every guard command in exactly one job
        if: ${{ !cancelled() }}
        run: |
          node tests/ci-shape.mjs --selftest
          node tests/ci-shape.mjs

      # DOES EVERY SHIPPED SCRIPT STILL PARSE? It runs FIRST-ish and it is the
      # cheapest question in the matrix: a file that does not parse does not
      # run, so every guard below it that imports one would be red for a reason
      # that has nothing to do with what it asserts.
      #
      # 2026-09-12, b536: tools/vitals.mjs shipped with a backtick inside an SQL
      # comment inside a JS template literal. The backtick ends the string, so
      # the whole tool failed to load -- `SyntaxError: Unexpected identifier
      # 'verbs'`, in 40 ms. NOTHING IN THE REPO RAN THAT COMMAND: measured the
      # same day, `grep -rl "node --check" tests tools .github` returned zero
      # files. It reached integration and blocked a merge, and a human reading
      # the branch is the most expensive way to find a syntax error.
      #
      # 450 files: tools/*.mjs (the operator surface -- nothing else notices a
      # broken one), tests/*.mjs (a guard that cannot parse reports nothing) and
      # src/**/*.js (parsed as ESM, because package.json says "type": "module").
      # supabase/functions/** is deliberately out: index.ts is TypeScript and
      # --check cannot read it; the edge has pack-edge and its own deploy parse.
      # --selftest plants four real defects into COPIES of a shipped file in an
      # OS temp dir -- the b536 backtick, a dangling `${`, an unterminated
      # string and a stray brace -- and requires each to be caught, plus a
      # positive control that the untouched copy still passes.
      #
      # MEASURED 2026-09-12 on the dev machine: 10.3 s for the sweep (pool of 8)
      # and 1.4 s for the selftest, so the 5-minute client-guards budget is
      # unmoved.
      - name: Parse check - every shipped script still parses
        if: ${{ !cancelled() }}
        run: |
          node tests/parse-check.mjs
          node tests/parse-check.mjs --selftest

      # THE BESTIARY TROPHY LADDER (docs/design/BESTIARY_LADDER.md). Two things
      # it refuses. (1) src/data/bestiary.js is DERIVED -- buildBestiary(MONSTERS)
      # runs at module load -- so a monster added to the roster gets its ladder
      # for free, and the day someone flattens that into a literal the census
      # stops following the roster with nothing else going red. B9 rebuilds from
      # a synthetic roster and is the only assertion a hand-typed table fails.
      # (2) THE MAGNITUDES. A trophy is a memory of work done, not a build: the
      # class charm (<=1.03) and the monster trophy (<=1.03) apply against the
      # same monster at the same time, so it is their PRODUCT a reviewer approved
      # (MAX_MEMORY_DROP_MULT), and the damage half multiplies into the ONE
      # `damageMult` expression in src/core/combat.js that MAX_TOTAL_DAMAGE_MULT
      # clamps. B6 owns both. 12 mutations, one per assertion, each required to
      # be caught by its NAMED assertion, plus two negative controls (a display
      # rename, a twelfth monster class) that must stay silent. No database, no
      # credential, milliseconds.
      - name: Bestiary trophy ladder - every monster has one, every bonus is tiny
        if: ${{ !cancelled() }}
        run: node tests/bestiary-ladder.mjs --selftest

      # A --selftest-only registration cannot tell a broken guard from a caught
      # defect. Run the plain body too: only it answers "green when nothing is wrong".
      - name: Bestiary trophy ladder - base run
        if: ${{ !cancelled() }}
        run: node tests/bestiary-ladder.mjs

      # The cache-buster must agree across build-info.js, index.html and every
      # ESM import specifier. Cheap, so run it before spending time on a browser.
      - name: Cache-buster invariant
        run: bash bump-version.sh --check

      # THE HEARTHFIND MINT GUARD -- cited by name in src/core/hearthfind.js,
      # src/data/hearthfind.js and src/data/items.js as the reason "a find mints
      # nothing and nothing scales it" is safe to rely on. It lives HERE rather
      # than in economy-selftests because it needs no database and no engine: it
      # reads two data modules and one source file in milliseconds. The roll has
      # exactly the parameters (index, kind, id, rng) and scales its odds by
      # nothing (the structural half of "must NOT be boostable by anything paid";
      # hearthfind-roll.mjs ROLL-4 is the behavioural half, in a real span), every
      # hearthfind:true item is v:0, bind-on-pickup and not a currency, and the
      # flagged set is the same set as HEARTHFIND_ITEMS -- the allowlist the
      # server catalogue is generated from.
      # 7 mutations + a clean-tree negative control, no credentials.
      - name: Hearthfind mint guard - no gold, no market, no multiplier
        if: ${{ !cancelled() }}
        run: |
          node tests/hearthfind-mint-guard.mjs
          node tests/hearthfind-mint-guard.mjs --selftest

      # The cache-buster rule, mutation-proven: 6 defects caught (stale tag,
      # stale ESM specifier = the b493 double-load, the b511 bare quoted pin, a
      # stripped ?v=, build-info moved alone, build-info unreadable) AND 2
      # shapes it must keep ignoring, so the fix for a false negative cannot be
      # a grep that flags everything.
      - name: Cache-buster invariant — mutation proof
        if: ${{ !cancelled() }}
        run: bash bump-version.sh --selftest

      # ARM-FLAG HONESTY: the comment above an arm flag is the ONLY documentation
      # of where authority lives for that field, and every reader trusts it before
      # the value. The b454 cutover armed everything in one commit and left eight
      # comments saying "DORMANT" over a literal `true`; on 2026-08-31 the same
      # staleness on MARKS_RECORD_ARM_ENABLED produced a real misdiagnosis. Pure
      # source scan, no browser — run it with the other cheap gates.
      - name: Arm-flag honesty — no comment may contradict its flag's value
        run: |
          node tests/arm-flag-honesty.mjs --selftest
          node tests/arm-flag-honesty.mjs

      # SUITE ISOLATION: what a test writes to `G`, restoreG must put back.
      # ~1,200 in-page tests share ONE live window.G and isolation is a hand-
      # written allowlist inside snapshotG(). b252 wrote G.activeAction, which
      # the allowlist did not name, and ~2,000 later registrations inherited a
      # topbar reading "Cooking — shrimp"; the cause was 26,000 lines above the
      # first test that noticed. SNAP-2 is the same defect one layer down —
      # JSON.stringify DROPS undefined, so a bare `traits: G.traits` protects
      # nothing on a character who has never bought a trait, which is why F7-1
      # fails when it runs after B495-4.
      - name: Suite isolation — snapshotG allowlist mutation proof
        run: node tests/snapshot-allowlist-guard.mjs --selftest

      # ⚠ continue-on-error IS DELIBERATE AND IS NOT PERMANENT. The plain run is
      # still RED ON TODAY'S TREE FOR REAL REASONS — 263 SNAP-1 writes across 41
      # fields — and allowlisting them to get a green tick would make this guard
      # the masked skip it was written to end (CLAUDE.md §2: guards are never
      # loosened to get green). The census is the deliverable until the offenders
      # are fixed.
      # BATCH 1 (SNAP-2) IS DONE, 2026-09-13: 566 write(s) across 26 field(s) → 0.
      #   NOT by 26 `?? null` operators — every one of those 26 is absent for a
      #   reason that names the correct restore value as ABSENT, and a guessed
      #   empty is worse than the leak (`skills: {}` is a level-1 character).
      #   `sealSnapshot()` in src/features/smoke-test.js stores the SNAP_ABSENT
      #   sentinel for an undefined value and `restoreG()` `delete`s that key, so
      #   value AND own-property presence round-trip for every field at once with
      #   no empty to choose. The guard now reads that seal as a structural answer
      #   to SNAP-2 (rule readSeal, three parts, each one mutation-proved by
      #   M7/M8/M9 above) and the in-page `SNAP-2` ratchet proves the property at
      #   RUNTIME over every field the list names, pinning the 13 pre-seal
      #   `?? <empty>` entries by exact value so that count can only fall.
      # TODO(Coordinator): batch 2 is SNAP-1 and needs a decision per field (the
      #   seal makes each fix a one-line addition with no empty to choose):
      #   G.monsterHp/monsterMaxHp ×73, G.lastOfflineSummary ×22, G.combatLog ×12,
      #   G.streak, G.dailyReward, G.collection, G.enchant, G.entitlements,
      #   G.settings, and the `_`-scratch family.
      #   When the plain run is green on the tree, DELETE continue-on-error and
      #   this comment, and add the plain run to tools/lane-done.mjs.
      - name: Suite isolation — the leak census (RED BY TRUTH, see TODO)
        continue-on-error: true
        run: |
          node tests/snapshot-allowlist-guard.mjs --report
          node tests/snapshot-allowlist-guard.mjs

      # DUPLICATE TOP-LEVEL FUNCTIONS: two declarations of one name in one scope
      # means the later hoists over the earlier and the earlier body is dead code
      # that can be edited, reviewed and shipped while changing nothing. Also
      # pins the eight legitimate cross-IIFE name collisions so a NEW one is loud.
      - name: Duplicate top-level fns — no dead twin in src/legacy.js
        run: |
          node tests/no-duplicate-toplevel-fns.mjs --selftest
          node tests/no-duplicate-toplevel-fns.mjs

      # QUEST ITEM REWARDS: THE SAME NUMBER IN ALL THREE PLACES.
      # Every quest item reward used to be PHANTOM — QUEST_DEFS authored it,
      # completeQuest paid it with addItem() (G.inventory only) and
      # hr_claim_quest credited gold only, so the next envelope that spoke about
      # the id erased it. 2026-09-06-quest-item-rewards.sql moves the credit
      # server-side, which puts the same authored number in three files:
      # src/data/goal-catalogue.js, src/legacy.js QUEST_DEFS and the SQL seed. A
      # one-sided edit means a player is promised 30 shrimp and paid 5 — or
      # promised an item and paid nothing. It also refuses an authored item that
      # is not server-credited (the phantom class being re-authored) and an id
      # that exists in no catalogue (authored, shipped, silently skipped).
      # Credential-free, database-free, seconds. --selftest plants all eight
      # defect classes and requires each to be caught by a named assertion.
      - name: Quest reward parity — data, client and server agree, every id real
        if: ${{ !cancelled() }}
        run: |
          node tests/quest-reward-parity.mjs
          node tests/quest-reward-parity.mjs --selftest

      # THE PLOT-TIER PRICE — the client and the server may never disagree.
      # b510 re-priced the farm plot tier in GOLD behind a farming level after
      # production measured farm plants per day falling to ZERO for nine days
      # (the only way off tier 1 was a 0.1%-drop Farmer's Deed, and turnip is
      # the only tier-1 crop). That price now exists in FOUR authored places —
      # the migration's UPDATE, the migration's own self-check, the client
      # mirror src/core/farm.js PLOT_TIER_PRICES, and the GENERATED deed_cost
      # catalogue — and a re-price that moves three of them quotes the player a
      # number the RPC will not charge. It also guards the RULING: every tier's
      # required farming level must stay STRICTLY BELOW the earliest crop it
      # unlocks, so the tier can never become the wall again.
      # Credential-free and text-only (it parses the four files, no replay), so
      # it costs milliseconds. --selftest plants 9 defects, each of which must
      # be caught by its NAMED assertion, plus 2 negative controls (a comment
      # edit and a whitespace edit) that must stay silent; --mutate plants 3 in
      # the real file text.
      - name: Plot-tier price parity — client mirror vs server catalogue
        if: ${{ !cancelled() }}
        run: |
          node tests/plot-tier-parity.mjs
          node tests/plot-tier-parity.mjs --selftest
          node tests/plot-tier-parity.mjs --mutate

      # R10, THE STANDING RULE: RECOVERY IS NOT FOR SALE.
      # No trait, unlock, gold-ladder rung, Quartermaster offer, clan bond, perk,
      # renown rank, glyph or companion may key a mechanical effect on recovery
      # duration, a recovery skip, or a death counter. Relief is bought with FOOD
      # (hr_rest) or it is not bought. The catalogues are DATA and grow by rows,
      # so this fails on the day such a row is WRITTEN rather than the day it is
      # noticed. Static, credential-free, milliseconds.
      - name: Recovery relief - nothing in any catalogue sells a way off the floor
        if: ${{ !cancelled() }}
        run: |
          node tests/recovery-relief-guard.mjs
          node tests/recovery-relief-guard.mjs --selftest

      # A DEATH THE PLAYER WATCHED IS STILL THE SERVER'S.
      # b509's Recovery Rule held away and not live: the attended death called
      # stopCombat(), which declares `idle`, and hr_apply stamps
      # `accrued_to = now()` on any activity delta - so the window the death was
      # in was closed before anything simulated it. Measured on the QA account:
      # recovering_until NULL, hp 12/12, no deaths row, no ledger row, while the
      # sheet counted down from a rung the client had invented out of a LIFETIME
      # death tally. This guard drives the client fall-state machine headlessly
      # (up -> pending -> recovering/unconfirmed) and source-scans the three
      # places the bug can come back. 9 mutations, no credentials, milliseconds.
      - name: Attended fall - the client asks, the server answers, nobody invents a timer
        if: ${{ !cancelled() }}
        run: |
          node tests/attended-fall.mjs
          node tests/attended-fall.mjs --selftest

      # -- THE PRESENTATION-LAYER FLOOR (cleanup slice 1) --------------------
      # Three ratchets on the things CLAUDE.md has asserted for months while
      # nothing measured them. None of them asks for the existing debt to be paid
      # today; each one freezes today's number and goes red when it grows.
      #
      # 1. HARDCODED COLOURS. Section 7 says "every colour is a CSS token from
      #    theme-cozy.css". Nine stylesheets carry 2,011 raw colour literals and
      #    1,096 !important. Per file, per metric, that is now the ceiling.
      #    Token definitions inside :root / body[data-theme...] are exempt - the
      #    ladder is the fix, not the debt. A second table ratchets hex colours
      #    inside JS strings (533 across 43 files), the other door the same debt
      #    walks through.
      # 2. BREAKPOINTS. Twenty-eight distinct @media spellings across nine
      #    sheets, including three different spellings of the mobile rail. The
      #    set is frozen; a NEW spelling is red. (Measured: the mobile rail is
      #    540/1024 x25 vs 900/1024 x8, and the string section 7 documents
      #    appears zero times.)
      # 3. THE PLAYER'S-EYE PASS, with teeth. tests/visual-qa.mjs has always
      #    exited 0 by design - "a REPORT, not a gate" - so a clipped heading
      #    could ship at no cost. The wrapper fails ONLY on a P0/ERR or on a P1
      #    at a (screen, viewport, kind, selector) key that is not in the
      #    committed baseline. Pixel and copy deltas on a known finding are not
      #    regressions. `.hr-desktopmode-banner` is excluded as environmental -
      #    all 84 under-fixed-bar findings sit under that harness strip.
      #
      # Every one carries --selftest: planted mutations that must be caught by
      # THAT guard. A ratchet that has never bitten is a decoration.
      - name: Presentation floor - colour and !important ratchet
        if: ${{ !cancelled() }}
        run: |
          node tests/css-literal-ratchet.mjs --report
          node tests/css-literal-ratchet.mjs --selftest

      - name: Presentation floor - one set of breakpoints
        if: ${{ !cancelled() }}
        run: |
          node tests/breakpoint-guard.mjs --report
          node tests/breakpoint-guard.mjs --selftest

      # slice 5 step 1 - src/styles/tokens.css is the single source of design
      # tokens. Before it, 367 token declarations lived in four sheets at four
      # points in the load order and 41 of them were shadowed later with a
      # DIFFERENT value. This guard keeps the source single, keeps the four
      # legitimate component-scoped variables on an allowlist with reasons, and
      # ratchets the bare var() reads that nothing declares.
      - name: Presentation floor - one source for design tokens
        if: ${{ !cancelled() }}
        run: |
          node tests/token-single-source.mjs --report
          node tests/token-single-source.mjs --selftest

      # slice 3 — deletions proven dead (derived censuses, never hand-pinned).
      # Appended at the END of the file on purpose: slice 2 is appending its own
      # steps here too, and two blocks under distinct comments merge cleanly.
      - name: Cleanup slice 3 - dead export census
        if: ${{ !cancelled() }}
        run: |
          node tests/dead-exports.mjs --selftest
          node tests/dead-exports.mjs

      # Live-world program: client prediction is being RETIRED (docs/planning/
      # CLIENT_PREDICTION_RETIREMENT.md). This ratchet freezes the count of predict call
      # sites and reconcilers so no new one lands while the tick service is built.
      - name: Live world - no new client prediction
        if: ${{ !cancelled() }}
        run: |
          node tests/no-new-prediction.mjs
          node tests/no-new-prediction.mjs --selftest

      - name: Cleanup slice 3 - dead CSS class census
        if: ${{ !cancelled() }}
        run: |
          node tests/dead-css.mjs --selftest
          node tests/dead-css.mjs

      # NO CLIENT FARM MINT (cleanup slice 4, b514): plantCrop / waterPlot /
      # waterAllPlots / harvestPlot / upgradePlot may only SEND AN INTENT. Their
      # client-authored twins — the yield roll, the perennial ladder, the seed
      # debit, the watering window, the deed/gold spend, the plot_level write —
      # had survived the b454 cutover unreachable for 60 builds and are now
      # deleted. This is what stops them returning a line at a time.
      - name: No client farm mint — the farm gestures author nothing
        run: |
          node tests/no-client-farm-mint.mjs --selftest
          node tests/no-client-farm-mint.mjs

      # NO CLIENT XP MINT (b521): the same shape as the farm guard, one rung up.
      # buryBones() was `removeItem + addXp('prayer', …)` with no intent, no RPC
      # and no settle for 256 builds — paione: "I can bury a gazillion times and
      # get the exp and keep the bones." A grep for addXp is not a verdict (most
      # sites are legitimate predictions or apply a value the server returned),
      # so this RATCHETS the count of call sites OUTSIDE a written-down
      # classification, at 0, plus the three named direct `G.skills.x =` writes.
      # --selftest plants the exact deleted line back and requires it red.
      - name: No client XP mint — every addXp is a prediction or a server value
        run: |
          node tests/no-client-xp-mint.mjs --selftest
          node tests/no-client-xp-mint.mjs

      # NO DUPLICATE RPC CALLERS (b514): a RATCHET. The six hand-rolled
      # rpc(name, body) copies stay six (HearthriseRpc is the DECISION, not a
      # transport — folding them is the wrong abstraction), and the mayCall
      # adoption floor may rise but never fall. Adopting it in the other five was
      # tried and turned b340/F5 red: hr_clan_browser is legitimately session-free.
      - name: RPC callers — the copies do not grow and the b349 guard floor holds
        run: |
          node tests/no-duplicate-rpc-callers.mjs --selftest
          node tests/no-duplicate-rpc-callers.mjs

      # NO BLOB BRANCHES (b514 froze it at 13, b515 emptied it): a RATCHET AT
      # ZERO. The b353 kill switch is retired, so isBlobRetired() is the constant
      # BLOB_RETIRED and every fork — dormant client-authored half included — is
      # deleted. A1: no isBlobRetired() conditional survives under src/. A2: the
      # premise re-checked the other way — it must never AND the switch again.
      - name: Blob-retire forks — the census is empty, and the premise re-checked
        run: |
          node tests/no-blob-branches.mjs --selftest
          node tests/no-blob-branches.mjs

      # slice 3 (b515) - the window.Hearthrise* census. A misspelt global is silently
      # undefined, so the feature behind it is DEAD rather than loudly broken:
      # window.HearthriseAccrue kept the dungeon-settle arm off while the flag said ON.
      - name: Cleanup slice 3 - window globals census
        if: ${{ !cancelled() }}
        run: |
          node tests/window-globals-exist.mjs --selftest
          node tests/window-globals-exist.mjs

      # ORPHAN ADOPTED. The sign-up door rules (emailRedirectTo, the resend, the
      # refusal vocabulary, the invite link) live as pure functions in
      # src/net/signup-door.js and are graded against 21 mutations. beta-2 lost
      # 11 of 49 sign-ups at the email wall to three defects, none of which is
      # visible from the DOM. Nothing ran this file.
      - name: Sign-up door — every mutation caught
        if: ${{ !cancelled() }}
        run: node tests/signup-door.mjs --selftest

      - name: Sign-up door — base run
        if: ${{ !cancelled() }}
        run: node tests/signup-door.mjs

      # ── CLEANUP SLICE 1b: THE DEBT RATCHETS ─────────────────────────────
      # Four numbers that CLEANUP_PROGRAM's scoreboard tracked and nothing
      # enforced, measured from git on 2026-09-07:
      #   src/legacy.js  15,050 lines (08-10) → 22,511 (09-06) → 21,935
      #   src/render/*   0 files (08-10) → 11 (08-24) → 11, FLAT for two weeks
      #   smoke-test.js  16,008 lines → 57,853
      #   migrations     15 → 156, with hr_apply patched by anchored regex into a
      #                  body that exists in no file
      # Every one of those was added by somebody who had read the rule and agreed
      # with it. An unmeasured rule loses every argument it has with a deadline.
      # These four do not ask the debt to be paid — they refuse to let it grow,
      # and each prints the target list for the slice that pays it. All four are
      # pure text scans: credential-free, database-free, milliseconds.

      # THE MONOLITH MAY ONLY SHRINK, AND src/render MAY ONLY GROW. Five
      # ratchets (lines, top-level fns, the `const f = () =>` dodge, render file
      # count, render lines); the render pair are FLOORS, because an extraction
      # that gets reverted is worse than one that never happened. --selftest
      # plants each defect twice — once as a bent number to prove the comparator
      # and once as REAL TEXT in a temp tree to prove the reader — and requires
      # the three debt-payments to be notes rather than failures.
      - name: Monolith ratchet — legacy.js down, src/render up
        if: ${{ !cancelled() }}
        run: |
          node tests/monolith-ratchet.mjs --selftest
          node tests/monolith-ratchet.mjs --report

      # THE NARRATIVE MAY NOT OUTGROW THE CODE. src/net/record.js is 1,145
      # comment lines over 655 code lines. The comments here are unusually good,
      # which is precisely why nobody has ever been told no. Per-file ratio
      # ceilings on the 16 largest files, plus a corpus-wide ceiling on lines
      # that narrate a BUILD NUMBER — archaeology that git log already holds,
      # and that starts lying three builds later (the b454 arm-flag class).
      - name: Comment-ratio ratchet — prose may not outgrow code
        if: ${{ !cancelled() }}
        run: |
          node tests/comment-ratio-ratchet.mjs --selftest
          node tests/comment-ratio-ratchet.mjs --report

      # A BODY THAT EXISTS ONLY AS A STACK OF REGEXES IS NOT AUTHORED. hr_state_of
      # has taken 12 anchored programmatic edits from 11 migrations since its last
      # full restatement, hr_apply 10 from 3. The text production actually runs is
      # in no file — it must be replayed to be read or reviewed — and each new
      # anchor depends on what the previous patch happened to leave behind, the
      # failure mode being a patch that matches nothing and no-ops IN SILENCE.
      # Today's chains are grandfathered and named so slice 7 has its target list;
      # a NEW migration may not patch a chain already >= 2 deep without writing
      # `-- RESTATEMENT-DEBT-ACK: <why>` into its own header. Text-only: no
      # database, no replay, no credential.
      - name: Patch-chain guard — no new patch onto a chain 2+ deep
        if: ${{ !cancelled() }}
        run: |
          node tests/patch-chain-guard.mjs --selftest
          node tests/patch-chain-guard.mjs --report

      # …AND THE RESTATEMENT THAT PAID hr_apply's CHAIN DOWN KEEPS ITS PINS. A
      # restatement is the one migration shape that can silently DISCARD work: it
      # overwrites a body wholesale, so if production has drifted the drift
      # vanishes with no error. 2026-09-14-hr-apply-restatement.sql answers that
      # with two assertions — §0 refuses to run over a body it cannot name, §3(a)
      # sweeps one derived section-unique marker per section of the COMMENT-
      # STRIPPED text — and this is their mutation proof (Security C1/C2). It also
      # holds the FINAL-BODY constants tests/buff-queue.mjs, renown-projection.mjs
      # and away-receipt-journal.mjs import to find the file that owns the live
      # text, so a stale blind anchor fails here rather than making their arms
      # vacuous. Replays the chain in PGlite; no credential.
      - name: hr_apply final body — the restatement's pins still bite
        if: ${{ !cancelled() }}
        run: |
          node tests/hr-apply-final-body.mjs
          node tests/hr-apply-final-body.mjs --selftest

      # THE SAME, FOR THE ENVELOPE. 2026-09-14-hr-state-of-restatement.sql restates
      # hr_state_of (24 anchored patches from 23 files) COMMENT-ONLY, so §0 and
      # §3(a) pin ONE code constant and there is no re-apply escape hatch. §3(d)
      # additionally probes a real character's envelope for the EXACT 26 top-level
      # + 36 state keys tests/no-client-copy-of-projection.baseline.json pins,
      # because a restatement that quietly shipped a smaller envelope would make
      # that guard pass by agreeing with a smaller truth. This file is their
      # mutation proof AND the single source of the final-body constants
      # tests/buff-queue.mjs, renown-projection.mjs, state-of-farm-projection.mjs,
      # gem-unlock-buy.mjs and recipe-learn.mjs import. PGlite; no credential.
      - name: hr_state_of final body — the envelope restatement's pins still bite
        if: ${{ !cancelled() }}
        run: |
          node tests/hr-state-of-final-body.mjs
          node tests/hr-state-of-final-body.mjs --selftest

      # THE SUITE MAY GROW; THE COST PER TEST MAY NOT. smoke-test.js tripled in
      # four weeks. Ratchets lines-per-test and direct-G.*-seeds-per-test, with a
      # FLOOR under the test count so the ratios cannot be satisfied by deleting
      # tests. Measured over a CORPUS (smoke-test.js + src/features/smoke/**), so
      # slice 6's pure-move split leaves every number identical and arrives at a
      # green build — a guard that goes red on the refactor it was written to
      # protect is a guard that gets switched off.
      - name: Test-file ratchet — lines and seeds per test may not rise
        if: ${{ !cancelled() }}
        run: |
          node tests/test-file-ratchet.mjs --selftest
          node tests/test-file-ratchet.mjs --report

      # THE META-GUARD. Every tests/*.mjs must be registered here, invoked by
      # run-smoke.mjs, chained from another guard, or listed in
      # tests/guards-unregistered.json with a written reason — and every step
      # that passes --selftest must have a file that IMPLEMENTS it. Both halves
      # exist because both failed silently: 12 guard files were reachable by
      # nothing, and a --selftest flag a file ignores is a vacuous proof that
      # reads exactly like a real one in a green log.
      # THE CLASS TYLER NAMED ON 2026-09-14: "this has been part of releases like
      # over a dozen times now" — auto-eat food, the play streak and the Renown
      # record each regressed after they were fixed, because each fix landed the
      # SERVER projection while the client kept its own persisted copy in
      # RESIDUE_FIELDS and screens went on reading the copy. This forbids a
      # persisted client copy of a projected value (except by name, with a
      # reason), demands that every reader a mapping names actually EXISTS, and
      # ratchets raw `G.<field>` reads in src/render, src/features and legacy.js
      # so a new gate on the copy is red the day it is written. Text-only: the
      # executed key set is pinned by the db-replay half above.
      - name: No client copy of a server projection
        if: ${{ !cancelled() }}
        run: |
          node tests/no-client-copy-of-projection.mjs --selftest
          node tests/no-client-copy-of-projection.mjs

      # A SELF-CHECK MAY NOT DELETE A ROW IT DID NOT CREATE. 2026-09-20:
      # 2026-09-19-lifetime-facts-off-the-ledger.sql was refused by production
      # (23514) for running `delete from public.player_ledger where at < now() -
      # interval '1 day'` inside its section-4 block — every player's money
      # journal, in a self-check, on the only copy of every value movement in
      # the game. It failed closed on hr_ledger_immutable, which is luck and not
      # design: every fixture row in that block was dated outside the retention
      # window and therefore deletable. The replay could not see it (its
      # player_ledger holds nothing but the block's own fixture), so this reads
      # the TEXT of every migration instead: any DELETE/UPDATE/TRUNCATE on a
      # player-value table inside a DO block, or any call to a prune function
      # that is global by construction, must bind an owner column to a variable
      # the block declared — or carry a written acknowledgement here. Text-only,
      # no database, milliseconds; the executed half is schema-drift's bystander
      # seed in db-replay. --selftest plants sixteen defects — one per bypass
      # family from the 2026-09-20 security review (S-SC-1) — plus a stale and an
      # unused acknowledgement, with five negative controls. The .bypass proof is
      # the same ten shapes end to end; it went green with the families and is
      # registered here in that commit, never before (CLAUDE.md §4, b512).
      - name: Self-checks may not delete a row they did not create
        if: ${{ !cancelled() }}
        run: |
          node tests/selfcheck-no-global-dml.mjs --selftest
          node tests/selfcheck-no-global-dml.mjs
          node tests/selfcheck-no-global-dml.bypass.mjs

      - name: Guard hygiene — no orphans, no vacuous selftests
        if: ${{ !cancelled() }}
        run: node tests/guard-hygiene.mjs --selftest

      - name: Guard hygiene — base run
        if: ${{ !cancelled() }}
        run: node tests/guard-hygiene.mjs


  # ── edge ── THE DEPLOYED GATEWAY. One read-only probe against the live Edge
  # Functions with a garbage token, plus its control. It is alone in a job on
  # purpose: it is the only step whose result depends on something OUTSIDE this
  # repository, so a Supabase incident must not be able to present as a failure
  # of the guards that watch the code.
  #
  # MEASURED 2026-09-07: 1/1 green in 0.5 s, plus edge-jwt-gate --selftest
  # re-slotted here from main (it plants its six defects OFFLINE, so it belongs
  # with the gate it proves and adds no probe). Budget = 5, the same floor: twice
  # half a second is not a timeout, it is a coin flip on a slow runner.
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # node_modules, NO browser. `playwright install --with-deps` is ~2 minutes
      # and buys nothing for a guard that never opens a page, so it stays in the
      # in-page job. The install itself runs in every family: a job that fails on
      # a dependency it did not know it had is a red build with no failing
      # assertion in it, and that is the class this whole slice is about.
      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # IS verify_jwt ACTUALLY ON, ON THE DEPLOYED FUNCTIONS?
      # supabase/config.toml pins it true for both functions and
      # bug-report-bridge's own header states it as its contract. On
      # 2026-08-23 the deployed bug-report-bridge answered its own 400 to a
      # caller holding `Bearer aaa.bbb.ccc`, while hr-accrue — same header,
      # same project — was refused by the gateway. A file is not a deployment,
      # and the existing guard (accrual-engine.mjs) only ever read the file.
      #
      # Read-only against production and needs no secret, exactly like the RPC
      # probe above: one POST per function with a garbage token, plus a control
      # (the public leaderboard) that MUST succeed, so an unreachable project
      # is reported as INCONCLUSIVE rather than as a green tick.
      - name: Edge Functions verify JWT at the gateway
        if: ${{ !cancelled() }}
        run: node tests/edge-jwt-gate.mjs --strict

      # The verify_jwt verdict, mutation-proven offline: the 2026-08-23 finding
      # itself (our own body answered a garbage bearer), verify_jwt = false, an
      # undeclared function directory, declared-but-not-deployed, our own 401
      # mistaken for the gateway's, and the lookahead parser bug that would
      # check n-1 of n sections and report green.
      - name: Edge JWT gate — mutation proof
        if: ${{ !cancelled() }}
        run: node tests/edge-jwt-gate.mjs --selftest

      # ── THE op:'tick' BYPASS, REGISTERED 2026-09-21 (milestone 1b) ─────────
      # hr-accrue now has a branch that runs BEFORE the player JWT is verified.
      # That is a deliberate bypass of the gate the two steps above defend, and
      # it is the one place in the system where a request reaches the engine
      # with no player behind it — so the guard that says it is NARROWER than
      # what it bypasses runs beside them, not in a database job.
      #
      # It needs no credential and no network: it drives the SHIPPED module
      # (supabase/functions/hr-accrue/tick.js) with real Headers and a fake
      # `exec`, and it reads the PACKED bytes to prove the branch really does
      # sit before verifyJwt and really is the only call site. Nine arms: the
      # bearer (absent / wrong / unset-env / length-independent), a forged body
      # (only user_id and slot survive; holder, version, watermark and mode are
      # all re-derived server-side), the kill switch as a genuine no-op, SHADOW
      # paying nothing, and the pack-time fence round `caller: 'tick'`.
      #
      # --selftest plants the four mutations a reviewer would ask about —
      # remove the bearer check, accept a body-supplied user id, skip the kill
      # switch, write payable rows while shadowed — and fails if any of them
      # leaves the arms green.
      - name: The op:'tick' entry — is the bypass narrower than the gate?
        if: ${{ !cancelled() }}
        run: |
          node tests/edge-tick-gate.mjs
          node tests/edge-tick-gate.mjs --selftest

      # T-5. The tick bearer transits `net.http_request_queue` — pg_net inserts
      # the request row, headers included, and the worker deletes it after the
      # send. Measured on production 2026-09-22: SELECT on that table is granted
      # to PUBLIC by supabase_admin, and the applying role `postgres` is not a
      # member of supabase_admin, so we CANNOT revoke it (the staged
      # 2026-09-22-pg-net-queue-lockdown.sql refused the apply for exactly that
      # reason). What keeps the bearer unreadable is therefore not the grant but
      # REACHABILITY: PostgREST exposes only public + graphql_public, no routine
      # or view in an exposed schema reads the queue, and no queue table is
      # published over Realtime. All three are repo-controlled — CLAUDE.md §2
      # makes supabase/migrations the only write path to production — which is
      # what makes a static scan a complete detector rather than a sample.
      #
      # --selftest plants the eighteen ways in — a definer bridge, the same
      # bridge in a dynamic EXECUTE, a view and a matview, four grants, `net` on
      # PostgREST's schema list from a migration and from config.toml, three
      # publication spellings, and the variants a reviewer asks about (quoted
      # identifiers, uppercase, an unqualified routine, `from` across newlines,
      # _http_response alone) — and eight controls that must stay silent, among
      # them a public function ASSERTING on the privilege, which is the
      # in-database half of this guard and must never trip it.
      #
      # `--live` re-runs the external probe with the anon key. It needs egress
      # to the project and exits 2 if an intermediary answers, so it is the
      # Coordinator's before arming, not CI's.
      - name: T-5 — pg_net's request queue is unreachable from any client surface
        if: ${{ !cancelled() }}
        run: |
          node tests/pg-net-queue-unreachable.mjs
          node tests/pg-net-queue-unreachable.mjs --selftest

      # The settle watermark advances by ACCOUNTED time, not to now(): the sub-tick
      # remainder rolls into the next window instead of being forfeited (1.3-1.7% of
      # attended combat, up to 6.7% on 7 s nodes). Four refusals keep it from becoming a
      # mint (capped, final window, a whole tick left over, an attended row newer than
      # the watermark); --mutate plants the old now() stamp and each refusal's removal.
      - name: Settle carry - the watermark advances by accounted time
        if: ${{ !cancelled() }}
        run: |
          node tests/settle-carry-defer.mjs
          node tests/settle-carry-defer.mjs --mutate
