# ============================================================
# CI gate for Hearthrise (b215)
#
# The 168-test smoke suite lived only behind Ctrl+Shift+T in a browser, so it
# could never block a bad push — by the repo's own workflow note it usually ran
# *after* a bug was already live on Pages. This runs the same suite headlessly
# on every push and PR, plus the cache-buster invariant that keeps a deploy from
# shipping half-stale modules.
#
# Deliberately no build step: the game is a static folder, so CI serves the repo
# exactly as GitHub Pages does.
# ============================================================
name: smoke

on:
  push:
    # main deploys (Pages); release/** and next are GATE-ONLY branches — the same
    # six-job matrix runs there so a release never waits on a developer machine.
    branches: [main, 'release/**', next]
    # DOCS-ONLY COMMITS DO NOT GATE CODE. The ledger and the audit
    # reports are updated many times a day; each one was starting a full
    # ~40-minute run, which queues behind the real ones and delays the
    # signal that actually matters. A release commit always touches
    # src/ (the cache-buster bump), so it is never skipped by this.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
  # THE NIGHTLY MUTATION SWEEP (CLAUDE.md §3.6/§4, Tyler 2026-10-21): the whole
  # matrix, every --mutate/--selftest, on main once a night at 08:00 UTC (01:00
  # Pacific; clear of the 00:00-00:10 UTC day boundary). A red nightly blocks the
  # next release until fixed. On push and pull_request every proof command goes
  # through tools/mutant-gate.mjs and runs only when the diff touches its guard
  # (a skipped one prints why); plain guard runs always run.
  schedule:
    - cron: '0 8 * * *'

# ── LEAST PRIVILEGE FOR THE WORKFLOW TOKEN (2026-08-23, open-beta hardening) ──
# The repository is PUBLIC and hearthrise.net is served from main, so the
# GITHUB_TOKEN handed to a job that runs on `push: main` is, if the repository
# default is "read and write", a token that can PUSH TO THE DEPLOYED SITE.
# Three steps of this job run third-party code with that token in the
# environment: `actions/checkout`, `actions/setup-node`, and — the big one —
# `npm install`, which executes lifecycle scripts from Playwright, PGlite and
# their whole transitive tree. One compromised package, and the site is theirs.
#
# `permissions:` here overrides the repository default, so this holds even if
# somebody flips that setting later. Nothing in this workflow writes anything:
# it checks out, installs, and runs tests. `contents: read` is the whole need.
permissions:
  contents: read

# ── THE MATRIX (cleanup slice 8a, 2026-09-07) ───────────────────────────────
# This was ONE sequential job of 58 commands. The b514 run took 50.2 minutes
# and was CANCELLED by its own `timeout-minutes: 50` — a red build with no
# failing assertion in it, which is the most misleading way a gate can fail,
# and the second time this workflow has raised that number rather than the
# question underneath it.
#
# The steps are now partitioned by what they NEED, into THIRTEEN jobs that run in
# parallel, so the wall clock is the slowest family rather than the sum:
#
#   job                  needs                      MEASURED   timeout (= x2)
#   in-page              a real Chromium            ~15.5 min * 30
#   economy-selftests    an applied migration chain  15.8 min  32
#   db-replay            an applied migration chain   5.8 min  16 [1][5]
#   db-replay-4          an applied migration chain   6.9 min  16 [5]
#   db-replay-2          an applied migration chain  10.8 min  19 [1][4]
#   db-replay-3          an applied migration chain  10.4 min  21 [4][6]
#   db-replay-5          an applied migration chain   9.7 min  20 [6][8]
#   db-replay-6          an applied migration chain  10.0 min  21 [7]
#   db-replay-7          an applied migration chain  10.6 min  22 [7]
#   db-replay-8          an applied migration chain   9.0 min  20 [8]
#   utc-midnight-replay  an applied migration chain   6.85 min 14 [2]
#   client-guards        nothing but this repo        4.3 min   9 [3]
#   edge                 the live gateway              0.5 s    5 (floor)
#
# [1] db-replay SPLIT IN TWO 2026-09-20 (b550 follow-up): the GitHub run for
#     7b509de8 (branch next) cancelled db-replay at its own 14-min timeout —
#     mid "Gem unlock buy", with Recipe learn and Projected key set never
#     run — even though nothing measured in it was failing. The family the
#     2026-09-07 line ([228.0 s]) described predates most of the guards now
#     in it (rejections journal, buff queue, renown projection, restore
#     census, town presence, world finds projection, gem unlock buy, recipe
#     learn, projected key set) and was never re-measured whole. Re-measured
#     2026-09-20 from the GitHub run for 7b509de8's own steps (782 s through
#     World finds projection) plus the three steps that never ran, measured
#     locally on a box independently cross-checked against that same run
#     (Retreat apply: 19.9 s local vs 19 s on GitHub) — Gem unlock buy 100.4 s,
#     Recipe learn 73.8 s, Projected key set 2.4 s — for a real family total of
#     960 s (16.0 min), well past the "~10 min per job" guideline. Split by
#     family at the Buff queue / Renown projection boundary, PGlite snapshot
#     cache verification repeated FIRST in the new job per CI-SHAPE-4 (no
#     command may run in two jobs, so it is a second, independent
#     verification, not a shared one): db-replay 465 s (7.75 min) x2 = 15.5,
#     rounded up to 16; db-replay-2 552 s (9.2 min) x2 = 18.4, rounded up to
#     19. No single step regressed — the whole family measured 20-35% slower
#     on this GitHub run than on an earlier one the same day (7120434), which
#     is shared-runner variance, not a code change (the two commits between
#     them touch only smoke.yml/ci-shape.baseline.json/lane-done.mjs
#     comments); the split is sized off the SLOWER, more conservative run.
# [2] SPLIT OUT of db-replay 2026-09-19 (b550) — see the utc-midnight-replay
#     job's own header comment for the measurement and the cancelled run that
#     forced it.
# [3] client-guards RE-MEASURED 2026-09-20: the 2.0-min line was never revised
#     after the b550 guard wave. GitHub runs for ab7572e7 and 7120434 (branch
#     next) both completed the full family at 255-258 s (4.3 min); the run for
#     7b509de8 was cancelled by the old 5-min (300 s) timeout mid "hr_state_of
#     final body" — a margin of ~40 s over the measured total, nowhere near
#     x2. Budget = 258 s x2 = 8.6 min, rounded up to 9.
# [4] db-replay-2 SPLIT IN TWO 2026-09-26 (CI-SPLIT-2): runs 36219670449 and
#     36221547317 (next) were CANCELLED at db-replay-2's own 19-min timeout
#     (19.3 min), the second AFTER readonly-rpc had already moved out to
#     db-replay — three prior green runs measured 18.5/16.2/14.7 min, so the
#     job was structurally at its budget rather than one guard regressing.
#     Split at the family boundary (see db-replay-2's own header for the exact
#     step assignment); both halves stay on the SAME 19-min timeout as
#     before — the split buys headroom, not a bigger ceiling.
# [5] db-replay SPLIT IN TWO AGAIN 2026-09-28 (CI-SPLIT-4): runs 36435388338
#     (next@d996c262) and 36435597419 (next@ef3cb6d1) were CANCELLED at
#     db-replay's own 16-min timeout (964 s, 989 s). The "7.75 min" line was
#     stale: the green run 36431546863 (next@926bbef2, job 108958707424) took
#     722 s (12 min), and the cancelled runs were every step uniformly ~35%
#     slower (runner variance, not a new slow step) — a 12-min job on a 16-min
#     timeout has no room for that. Rejections journal, Buff queue and
#     Client-state retired fields moved to db-replay-4. Both halves measured
#     from job 108958707424's own step times: db-replay = verify 44 + Schema
#     drift 126 + Settle before mutate 19 + Ledger rollup 41 + Catalogue 32 +
#     Live-hash 39 + Apply-order 1 + Retreat 21 + readonly-rpc 25 = 348 s
#     (5.8 min); db-replay-4 = verify 44 + Rejections 113 + Buff queue 178 +
#     Client-state 67 = 402 s, + ~11 s setup = 6.9 min. Both keep 16 min.
# [6] db-replay-3 SPLIT IN TWO 2026-10-06 (CI-SPLIT-5): run 37470960216
#     (next@e585a031) CANCELLED db-replay-3 at 19 min (1151 s, every step
#     green). The world-tick family moved whole to db-replay-5. NOTE: the same
#     run measured db-replay 575 s, db-replay-4 616 s, db-replay-2 752 s,
#     utc-midnight-replay 521 s, economy-selftests 1455 s, in-page 813 s (up to
#     1105 s on other runs today) — the table lines above for those jobs are
#     STALE and every one of them is past x2 of its timeout; they are not
#     re-stated here (not moved by this split) and are owed a re-measure.
# [8] db-replay-5 SPLIT IN TWO 2026-10-08 (CI-SPLIT-6): run 37725703255
#     (next@3ea45544) CANCELLED db-replay-5 at 20 min; the probe step took
#     765 s (42 s on main@e6a12d3a) — single-core replay bars, fixed in the
#     same lane (see db-replay-8's header). The pricing family moved to
#     db-replay-8. db-replay-5 keeps the write-safety family: 313 s on the
#     green run 37722343238, x1.86 for the slow run's variance = 582 s
#     (9.7 min), inside its unchanged 20-min budget.
# [7] NEW 2026-10-07 (lane b564-hollow-mutants): thirteen mutation proofs that
#     no step ran, plus tests/mutant-control.mjs. Measured locally; see the
#     jobs' own header for the per-step sums.
#
# RE-MEASURED 2026-09-07 after merging main, which brought SIXTEEN steps this
# branch forked before (guard-hygiene, window-globals, no-client-farm-mint,
# no-duplicate-rpc-callers, no-blob-branches, signup-door x2, worker-accrual x2,
# goal-counter-kinds, icon-boot-order, and the bump-version / rpc-resolution /
# edge-jwt-gate / raid-card-copy mutation proofs). Each was RE-SLOTTED into the
# family that matches what it needs, never dropped: run-ci-local --list on this
# tree is a strict SUPERSET of the list main's smoke.yml produces (84 commands
# vs 81; the three extras are the ci-shape guard and the PGlite cache verify).
# Only ONE budget moved: economy-selftests 30 -> 32, because goal-counter-kinds
# --selftest (49.2 s, PGlite) + worker-accrual (6.2 s) push the family from
# 14.9 to 15.8 min and 15.8 x 2 = 31.6.
#
# MEASURED 2026-09-07 on the dev machine with `node tests/run-ci-local.mjs
# --job <name>`, every job green (economy 20/20 in 895.2 s + 55.4 s of merged-in
# steps, db-replay 16/16 in 228.0 s, client-guards 35/35 in 122.7 s, edge 1/1 in
# 0.5 s) and with two other
# suites running on the same box, so the numbers are pessimistic rather than
# flattering. (*) in-page is not re-measured here: run-smoke was measured at
# ~12.8 min on 2026-09-05 and the browser install adds ~2 min; running the
# in-page suite while two others were running would have measured the machine,
# not the suite. The two smallest budgets are a FLOOR, not a measurement --
# checkout + setup-node + npm install is ~40 s before a guard runs at all, and
# a budget under about five minutes would be measuring the runner.
#
# EVERY STEP LANDS IN EXACTLY ONE JOB, and `tests/ci-shape.mjs` is the guard
# that says so: it fails if a command is in two jobs, if a command that was
# registered has vanished from all of them, if a new command is unregistered,
# if a job has no timeout, or if `run-ci-local --list` stops enumerating the
# whole matrix. A split is exactly the kind of change that loses a guard
# quietly, so the split ships with the thing that would notice.
#
# `timeout-minutes` per job is the MEASURED family time x2 — stated on each
# job. A margin is not a licence to slow down: a genuine hang still fails,
# it just fails after the evidence has been collected.
#
# The second half of the fix is that a chain replay no longer costs 9-20 s a
# time: tests/pglite-template.mjs snapshots the applied prefix and restores
# it (measured 12.9 s -> 1.1 s). Measured end to end on two guards:
# bank-cap-rungs --selftest 182.0 s -> 52.8 s, bounty-hunter-xp --selftest
# 121.5 s -> 39.1 s, with every mutation still caught.
#
# History of the number this replaces: 15 -> 20 (2026-08-31, the mutation
# proofs), 20 -> 30 (2026-09-04, measured: 856.6 s of CI-only guards), 30 ->
# 50 (2026-09-05, measured: run-smoke ~12.8 min PLUS 793 s of guards). Every
# raise was honest and every one bought less headroom than the next guard
# cost. This is the first change that makes the work smaller instead.
jobs:

  # ── in-page ── THE PLAYER'S-EYE HALF: everything that needs a real Chromium.
  # The 1,150-test headless suite, the Hunt card's rendered copy and the visual
  # QA gate. This is the LONG POLE of the matrix by design — it is the only
  # family that pays for `playwright install --with-deps` (~2 min) and it runs
  # a browser for ~13 min — and every other family finishes inside it, so the
  # wall clock of the whole workflow is this job plus queueing.
  #
  # MEASURED 2026-09-05 on the dev machine: run-smoke ~12.8 min. A shared
  # runner is slower, and checkout + setup-node + npm install + the browser
  # download add ~3 min. Budget = measured x2 (see the note above `jobs:`).
  #
  # The two browser mutation proofs merged in from main on 2026-09-07 —
  # raid-card-copy --selftest (9.0 s) and icon-boot-order --selftest (22.4 s,
  # and it is the one that runs the CPU-load control) — add 31.4 s between them.
  # Half a minute on a ~15 min family: budget stays 30. b569 adds
  # reachability --mutate (~111 s locally): ~16.9 min x2 -> 34.
  # SPLIT 2026-10-20 (in-page-2 below took the window steps after three
  # cancels at 35.3 min). This half MEASURED: fast runner (39364497698)
  # install 26 + node suite 236 + client boot 67 + Alpha windows 721 = 1,050 s,
  # ~18 min with setup; slow runner (39374685521) ~1,320 s, ~22.5 min.
  # Budget = fast x2 = 36.
  # 2026-10-26 (v0.2.50, run 40314818369): cancelled at 36:33 with 0 failures — a
  # 12.2-min apt stall in the install, then death-popup --mutate re-run only because a
  # play.html preload href holds "millrace_sewer" (the gate judged play.html whole-file).
  # Lane a-ci-budget: the gate judges play.html by the LINES a diff really changes
  # (`?v=` taken out), and Observability / Report a problem / Death popup moved to
  # in-page-21. MEASURED, nightly full sweep (40196078710, every --mutate): setup 0.9 +
  # node suite 6.7 + client boot 6.6 (--mutate 6.3) = 14.2 min; x2 = 28, 30 so the apt
  # stall (14.2 + 12.2 = 26.4) keeps 12% slack.
  in-page:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        uses: ./.github/actions/playwright-chromium

      # The node guard suite (server, engine, economy, catalogue, secret,
      # supply-chain, migration and edge-payload checks). Until the client reset
      # (2026-10-17) this step also booted the old client and ran its in-page
      # suite; both are deleted.
      - name: Smoke suite (node guards)
        run: node tests/run-smoke.mjs

      # THE NEW CLIENT, BOOTED (2026-10-17). play.html in a real Chromium with
      # supabase-js and the two REST paths stubbed: sign-in, the characters
      # screen, the World pane + shell for a character, a second character
      # beside it, sign-out clearing every session copy, the reset link and the
      # closed-game notice; plus the static notice page at /. --mutate plants
      # six defects (one: the hunt panels never mount) and requires each to go red.
      - name: Client boot (play.html, index.html)
        if: ${{ !cancelled() }}
        run: |
          node tests/_chrome.mjs
          node tools/mutant-gate.mjs node tests/_chrome.mjs --selftest
          node tests/client-boot.mjs
          node tools/mutant-gate.mjs node tests/client-boot.mjs --mutate

      # A failing run is far easier to diagnose with the page state attached.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            tests/**/*.png
            tests/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ── in-page-21 ── TELEMETRY, REPORT A PROBLEM, DEATH POPUP, SPLIT OUT OF in-page
  # 2026-10-26 (lane a-ci-budget). release/v0.2.50 (run 40314818369) CANCELLED in-page
  # at 36:33 with 0 failures: 12.2 min of apt stall (23.9 MB at 32.8 kB/s) + node suite
  # 6.4 + client boot 6.7 + Observability 9.0 + Death popup cut at 0.7. MEASURED on the
  # nightly full sweep (40196078710, every --mutate): Observability 9.4 (--mutate 9.1;
  # it DECLARES play.html, so any real play.html change runs it) + Report a problem 1.4
  # + Death popup 4.1 + setup 0.9 = 15.7 min; x2 = 32. With the apt stall: 27.9 (87%).
  in-page-21:
    runs-on: ubuntu-latest
    timeout-minutes: 32

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        uses: ./.github/actions/playwright-chromium

      # TELEMETRY (2026-10-20): play.html served as hearthrise.net with the REAL
      # vendored Sentry and PostHog, their ingest hosts routed: both wired with
      # the account id only, inputs and chat masked, replay only in the game,
      # the named events sent; nothing loads on localhost or with ?noanalytics=1.
      # --mutate plants eleven defects (masking off, kill switch ignored, ...).
      - name: Observability (Sentry + PostHog)
        if: ${{ !cancelled() }}
        run: |
          node tests/observability.mjs
          node tools/mutant-gate.mjs node tests/observability.mjs --mutate

      # REPORT A PROBLEM (2026-10-21): the launcher row and Settings > Help open
      # it; Send posts ONE body to the bug-report-bridge Edge Function (stubbed)
      # with the player's token, the character, its hunt, the envelope version,
      # this load's console errors and a JPEG of the World; "Sent." and the rate
      # limit read plainly. --mutate plants eight defects (two: the phone sheet answer line).
      - name: Report a problem (play.html)
        if: ${{ !cancelled() }}
        run: |
          node tests/report-problem.mjs
          node tools/mutant-gate.mjs node tests/report-problem.mjs --mutate

      # THE DEATH POPUP (tracker r15, Tyler 2026-10-19): a death opens a centred
      # popup whose every line is the server's death row (where, the killer, the
      # XP dying cost, what a Blessing kept, back in town), viewed, after a reload
      # and on return from away; OK / Hunt summary store the dismissal so it never
      # shows twice. --mutate plants nine defects.
      - name: Death popup (play.html)
        if: ${{ !cancelled() }}
        run: |
          node tests/death-popup.mjs
          node tools/mutant-gate.mjs node tests/death-popup.mjs --mutate

      # A failing run is far easier to diagnose with the page state attached.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-in-page-21
          path: |
            tests/**/*.png
            tests/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ── in-page-10 / 11 / 12 ── THE ALPHA WINDOWS, SPLIT OUT 2026-10-22. in-page
  # was CANCELLED at its 36-min timeout on runs 39822946872 and 39833140559 with
  # the Alpha windows step still in its --mutate; in-page alone then measured
  # ~19 min (39850392139). One job for the windows was CANCELLED at 44 min too:
  # MEASURED (39850392139) every mutant re-runs the whole check suite, ~63 s
  # each, 45 mutants = ~47 min. So the --mutate was sharded in two (--shard=K/2).
  # lane b-hunts-detail (2026-10-22) added the Hunts window's AW-25..AW-29 and
  # the town ticker (AW-24) its own: 77 mutants, 62 of them page-judged (the 14
  # `ticker:` ones are pure, seconds each), and each run ~20 s longer (three more
  # page contexts; 87 s a run on Tyler's PC). Two shards would be ~31 x ~85 s =
  # ~44 min; three (--shard=K/3, every 3rd mutant) are ~21 page mutants = ~30 min,
  # plus install, the clean control and one ~4 min neighbour step = ~37 min per
  # job. Budget stays 60.
  # RE-SHARDED 2026-10-26 (lane/i-v0249): run 40280101746's in-page-10 hit its 60
  # min with 0 failures (shard 1/3 then preset-names --mutate ran out of time);
  # shards 2/3 and 3/3 MEASURED 49.8 and 54.9 min there (103 mutants, ~85 of them
  # page-judged at ~2 min each on a runner). Six shards (--shard=K/6: in-page-10,
  # 11, 12, 17, 18, 19) are ~14 page mutants = ~28 min + ~1 min install; budget
  # stays 60 (x2). preset-names and its --mutate move to in-page-19.
  in-page-10:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        uses: ./.github/actions/playwright-chromium

      # THE ALPHA WINDOWS (2026-10-18, week plan 16a + QoL 2/5): Bag, Gear,
      # Skills, Shop, Hunt prep and Find on the fixture envelope. Built once and
      # patched in place; the server's counts win; every action one intent with
      # its controls off until the server answers; a locked stack never reaches
      # a bulk sale; a sale and the one-tap refill show their total first; the
      # new sections missing fail safe. --mutate shard 1 of 6 (2: in-page-11, 3: in-page-12,
      # 4..6: in-page-17..19).
      - name: Alpha windows (play.html)
        if: ${{ !cancelled() }}
        run: |
          node tests/alpha-windows.mjs
          node tools/mutant-gate.mjs node tests/alpha-windows.mjs --mutate --shard=1/6

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-in-page-10
          path: |
            tests/**/*.png
            tests/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  in-page-11:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        uses: ./.github/actions/playwright-chromium

      # The Alpha windows --mutate shard 2 of 6 (see in-page-10), then the live
      # hunt scene.
      - name: Alpha windows mutants, shard 2 of 6 (play.html)
        if: ${{ !cancelled() }}
        run: |
          node tools/mutant-gate.mjs node tests/alpha-windows.mjs --mutate --shard=2/6
          node tests/hunt-scene-live.mjs

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-in-page-11
          path: |
            tests/**/*.png
            tests/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  in-page-12:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        uses: ./.github/actions/playwright-chromium

      # The Alpha windows --mutate shard 3 of 6 (see in-page-10).
      - name: Alpha windows mutants, shard 3 of 6 (play.html)
        if: ${{ !cancelled() }}
        run: |
          node tools/mutant-gate.mjs node tests/alpha-windows.mjs --mutate --shard=3/6

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-in-page-12
          path: |
