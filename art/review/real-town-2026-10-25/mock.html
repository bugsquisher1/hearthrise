async function loadSprites() {
  const m = await (await fetch('sprites.json')).json(); Object.assign(meta, m);
  const ids = new Set([...OBJECTS.map((o) => o[0]), ...OUTFITS]);
  for (const id of ids) if (meta[id]) meta[id].img = await img('../../../art/world/' + meta[id].dir + '/' + meta[id].src);
}
function scene(opt) {
  const x0 = 86, y0 = 18, W = 52, H = 54;
  const cv = document.createElement('canvas'); cv.width = W * T; cv.height = H * T;
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
  const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect((x - x0) * T, (y - y0) * T, w * T, h * T); };
  g.fillStyle = C.grassA; g.fillRect(0, 0, cv.width, cv.height);
  for (const [x, y, w, h, k] of GROUND) for (let ty = y; ty < y + h; ty++) for (let tx = x; tx < x + w; tx++) {
    const odd = (tx + ty) % 2;
    R(tx, ty, 1, 1, k === 'grass' ? (odd ? C.grassA : C.grassB) : k === 'cobble' ? (odd ? C.cobble : C.cobbleB) : k === 'flag' ? (odd ? C.flag : C.flagB)
      : k === 'water' ? (ty % 2 ? C.water : C.waterB) : k === 'bridge' ? (ty % 2 ? C.wood : '#6e5034') : '#9a8f7c');
    if (k === 'flag') { g.strokeStyle = 'rgba(40,34,28,0.5)'; g.strokeRect((tx - x0) * T + 1.5, (ty - y0) * T + 1.5, T - 3, T - 3); }
  }
  const draws = [];
  const tagBlock = (cx, cy, text, sub) => { g.fillStyle = C.ink; g.font = 'bold 11px Georgia, serif'; g.textAlign = 'center'; g.fillText(text, cx, cy); g.font = '9px Georgia, serif'; g.fillText(sub || 'PLACEHOLDER', cx, cy + 12); };
  for (const [x, y, w, h, name] of FACADES) draws.push({ foot: (y + h - y0) * T, f: () => {
    R(x, y, w, h - 2, C.roof); R(x, y + h - 2, w, 2, C.block);
    g.strokeStyle = C.blockEdge; g.lineWidth = 2; g.strokeRect((x - x0) * T + 1, (y - y0) * T + 1, w * T - 2, h * T - 2);
    tagBlock((x + w / 2 - x0) * T, (y + h - 1.4 - y0) * T, name);
  } });
  for (const [x, y] of STALLS) draws.push({ foot: (y + 3 - y0) * T, f: () => { R(x, y, 3, 1, '#8c3b2c'); R(x, y + 1, 3, 2, '#7c6a52'); tagBlock((x + 1.5 - x0) * T, (y + 2 - y0) * T, 'stall', 'later'); } });
  for (const [x, y] of BENCHES) draws.push({ foot: (y + 1 - y0) * T, f: () => { R(x, y + 0.4, 2, 0.45, C.wood); } });
  // THE GREAT HEARTH: footprint x112-122 y45-48, art 11 x 11 (y38-48). Placeholder shape after the reference: tall chimney, firebox, two log alcoves.
  const fire = [(117.5 - x0) * T, (46.6 - y0) * T];
  draws.push({ foot: (49 - y0) * T, f: () => {

    const glow = g.createRadialGradient(fire[0], fire[1], 10, fire[0], fire[1], 420);
    glow.addColorStop(0, opt.glow || 'rgba(255,180,70,0.5)'); glow.addColorStop(1, 'rgba(255,140,40,0)');
    g.fillStyle = glow; g.fillRect(fire[0] - 440, fire[1] - 440, 880, 880);
    R(115.5, 38, 4, 5, '#9a8c78'); R(115.2, 38, 4.6, 0.6, '#6f6455');                  // chimney
    R(114, 42, 7, 3, C.hearthStone);                                                  // breast
    R(112, 44, 3, 4.6, C.hearthDark); R(120, 44, 3, 4.6, C.hearthDark);              // alcoves
    for (let i = 0; i < 12; i++) { const bx = (i % 3) * 0.95, by = Math.floor(i / 3) * 0.95; R(112.2 + bx, 44.4 + by, 0.85, 0.75, '#7a5634'); R(120.2 + bx, 44.4 + by, 0.85, 0.75, '#7a5634'); }
    R(115, 44.5, 5, 4.1, C.hearthStone); R(115.4, 45.1, 4.2, 3.3, '#2a2018');         // firebox

    g.font = '9px Georgia, serif'; g.fillText('PLACEHOLDER: footprint 11 × 4, art 11 × 11 tiles (art in progress)', (117.5 - x0) * T, (41.9 - y0) * T);
    if (opt.motes) for (let i = 0; i < 24; i++) { g.fillStyle = ramp[3]; g.fillRect(fire[0] - 90 + ((i * 37) % 180), fire[1] - 60 - ((i * 53) % 200), 2, 2); }

}
function present(g, sc, vx, vy, vw, vh, cx, cy, labels, plateMode) {
  const k = 2, ox = Math.round(vx + vw / 2 - (cx - sc.x0 + 0.5) * T * k), oy = Math.round(vy + vh / 2 - (cy - sc.y0 + 0.5) * T * k);
  g.save(); g.beginPath(); g.rect(vx, vy, vw, vh); g.clip();
  g.imageSmoothingEnabled = false; g.drawImage(sc.cv, ox, oy, sc.cv.width * k, sc.cv.height * k);
  const laid = [];
  for (const [x, y, name, own] of sc.plates.slice().sort((a, b) => (b[3] - a[3]) || (b[1] - a[1]))) {
    const px = ox + x * k; let py = oy + y * k - 2; g.font = '12px Georgia, serif'; const w = g.measureText(name).width + 12;
    let tries = 0; while (laid.some((r) => Math.abs(r[0] - px) < (r[2] + w) / 2 && Math.abs(r[1] - py) < 19) && tries < 2) { py -= 19; tries++; }
    if (laid.some((r) => Math.abs(r[0] - px) < (r[2] + w) / 2 && Math.abs(r[1] - py) < 19)) continue;   // a crowd: a plate with no room is not drawn (yours always are)
    laid.push([px, py, w]); label(g, name, px, py, 12, own ? C.goldHi : C.ink);
  }
  for (const [t, x, y] of labels || []) label(g, t, ox + (x - sc.x0) * T * k, oy + (y - sc.y0) * T * k, 13);
  g.restore();
}

    present(g, scene({ ramp, glow: 'rgba(90,230,120,0.42)', motes: true, flare: 1.9 }), 0, 0, vw, vh, cx, cy, []);

    label(g, '[Square] Harrow fed the Hearth a Verdigris Cake.', 20, 870, 14, '#9cf0a0', 'left');
