# ============================================================================
# perf-measure — THE HUNT PAGE'S FRAME / HEAP / DOM TABLE IN FIREFOX AND CHROMIUM.
#
# tests/perf-budget.mjs --measure: the 10-minute Sewer party scenario (density 8,
# hero switch, alert storm, analyzer open, 60 s hidden tab, tank death) in each
# browser at desktop 1440x900 and the landscape phone 922x423. A MEASUREMENT,
# never a gate: the budget itself (Chromium, 3 minutes) runs in smoke.yml's
# in-page-2 job. Firefox lives here because Andy plays in it and the Windows
# boxes the lanes run on cannot launch Playwright's Firefox.
#
# Each cell prints one row and uploads its numbers (perf-<browser>-<size>.json).
# ============================================================================
name: perf-measure

on:
  workflow_dispatch: {}
  push:
    branches: ['lane/a-firefox-perf']
    paths: ['tests/perf-budget.mjs', '.github/workflows/perf-measure.yml', 'src/**']

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        size: ['1440x900', '922x423']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + ${{ matrix.browser }}
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Measure (10 minutes)
        run: node tests/perf-budget.mjs --measure --minutes 10 --browsers ${{ matrix.browser }} --sizes ${{ matrix.size }} --dump perf-${{ matrix.browser }}-${{ matrix.size }}.json
      - name: Upload the numbers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.browser }}-${{ matrix.size }}
          path: perf-*.json
          retention-days: 7
