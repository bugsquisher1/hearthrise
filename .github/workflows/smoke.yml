  # ── edge ── THE DEPLOYED GATEWAY. One read-only probe against the live Edge
  # Functions with a garbage token, plus its control. It is alone in a job on
  # purpose: it is the only step whose result depends on something OUTSIDE this
  # repository, so a Supabase incident must not be able to present as a failure
  # of the guards that watch the code.
  #
  # MEASURED 2026-09-07: 1/1 green in 0.5 s, plus edge-jwt-gate --selftest
  # re-slotted here from main (it plants its six defects OFFLINE, so it belongs
  # with the gate it proves and adds no probe). Budget = 5, the same floor: twice
  # half a second is not a timeout, it is a coin flip on a slow runner.
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # node_modules, NO browser. `playwright install --with-deps` is ~2 minutes
      # and buys nothing for a guard that never opens a page, so it stays in the
      # in-page job. The install itself runs in every family: a job that fails on
      # a dependency it did not know it had is a red build with no failing
      # assertion in it, and that is the class this whole slice is about.
      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # IS verify_jwt ACTUALLY ON, ON THE DEPLOYED FUNCTIONS?
      # supabase/config.toml pins it true for both functions and
      # bug-report-bridge's own header states it as its contract. On
      # 2026-08-23 the deployed bug-report-bridge answered its own 400 to a
      # caller holding `Bearer aaa.bbb.ccc`, while hr-accrue — same header,
      # same project — was refused by the gateway. A file is not a deployment,
      # and the existing guard (accrual-engine.mjs) only ever read the file.
      #
      # Read-only against production and needs no secret, exactly like the RPC
      # probe above: one POST per function with a garbage token, plus a control
      # (the public leaderboard) that MUST succeed, so an unreachable project
      # is reported as INCONCLUSIVE rather than as a green tick.
      - name: Edge Functions verify JWT at the gateway
        if: ${{ !cancelled() }}
        run: node tests/edge-jwt-gate.mjs --strict

      # The verify_jwt verdict, mutation-proven offline: the 2026-08-23 finding
      # itself (our own body answered a garbage bearer), verify_jwt = false, an
      # undeclared function directory, declared-but-not-deployed, our own 401
      # mistaken for the gateway's, and the lookahead parser bug that would
      # check n-1 of n sections and report green.
      - name: Edge request body is capped (64 KB, read through a counted stream)
        if: ${{ !cancelled() }}
        run: |
          node tests/edge-body-cap.mjs
          node tools/mutant-gate.mjs node tests/edge-body-cap.mjs --mutate

      - name: Edge JWT gate — mutation proof
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/edge-jwt-gate.mjs --selftest

      # ── THE op:'tick' BYPASS, REGISTERED 2026-09-21 (milestone 1b) ─────────
      # hr-accrue now has a branch that runs BEFORE the player JWT is verified.
      # That is a deliberate bypass of the gate the two steps above defend, and
      # it is the one place in the system where a request reaches the engine
      # with no player behind it — so the guard that says it is NARROWER than
      # what it bypasses runs beside them, not in a database job.
      #
      # It needs no credential and no network: it drives the SHIPPED module
      # (supabase/functions/hr-accrue/tick.js) with real Headers and a fake
      # `exec`, and it reads the PACKED bytes to prove the branch really does
      # sit before verifyJwt and really is the only call site. Nine arms: the
      # bearer (absent / wrong / unset-env / length-independent), a forged body
      # (only user_id and slot survive; holder, version, watermark and mode are
      # all re-derived server-side), the kill switch as a genuine no-op, SHADOW
      # paying nothing, and the pack-time fence round `caller: 'tick'`.
      #
      # --selftest plants the four mutations a reviewer would ask about —
      # remove the bearer check, accept a body-supplied user id, skip the kill
      # switch, write payable rows while shadowed — and fails if any of them
      # leaves the arms green.
      - name: The op:'tick' entry — is the bypass narrower than the gate?
        if: ${{ !cancelled() }}
        run: |
          node tests/edge-tick-gate.mjs
          node tools/mutant-gate.mjs node tests/edge-tick-gate.mjs --selftest

      # bug-report-bridge: a chunked body past 3 MB is refused by a byte counter
      # on the stream (never arrayBuffer()), and player text reaches the staff
      # Discord embed escaped (no masked links) and capped per field. Offline.
      - name: bug-report-bridge — metered body read + escaped staff embed
        if: ${{ !cancelled() }}
        run: |
          node tests/bug-report-bridge-bounds.mjs
          node tools/mutant-gate.mjs node tests/bug-report-bridge-bounds.mjs --selftest

      # T-5.The tick bearer transits `net.http_request_queue` — pg_net inserts
      # the request row, headers included, and the worker deletes it after the
      # send. Measured on production 2026-09-22: SELECT on that table is granted
      # to PUBLIC by supabase_admin, and the applying role `postgres` is not a
      # member of supabase_admin, so we CANNOT revoke it (the staged
      # 2026-09-22-pg-net-queue-lockdown.sql refused the apply for exactly that
      # reason). What keeps the bearer unreadable is therefore not the grant but
      # REACHABILITY: PostgREST exposes only public + graphql_public, no routine
      # or view in an exposed schema reads the queue, and no queue table is
      # published over Realtime. All three are repo-controlled — CLAUDE.md §2
      # makes supabase/migrations the only write path to production — which is
      # what makes a static scan a complete detector rather than a sample.
      #
      # --selftest plants the eighteen ways in — a definer bridge, the same
      # bridge in a dynamic EXECUTE, a view and a matview, four grants, `net` on
      # PostgREST's schema list from a migration and from config.toml, three
      # publication spellings, and the variants a reviewer asks about (quoted
      # identifiers, uppercase, an unqualified routine, `from` across newlines,
      # _http_response alone) — and eight controls that must stay silent, among
      # them a public function ASSERTING on the privilege, which is the
      # in-database half of this guard and must never trip it.
      #
      # `--live` re-runs the external probe with the anon key. It needs egress
      # to the project and exits 2 if an intermediary answers, so it is the
      # Coordinator's before arming, not CI's.
      - name: T-5 — pg_net's request queue is unreachable from any client surface
        if: ${{ !cancelled() }}
        run: |
          node tests/pg-net-queue-unreachable.mjs
          node tools/mutant-gate.mjs node tests/pg-net-queue-unreachable.mjs --selftest

      # The settle watermark advances by ACCOUNTED time, not to now(): the sub-tick
      # remainder rolls into the next window instead of being forfeited (1.3-1.7% of
      # attended combat, up to 6.7% on 7 s nodes). Four refusals keep it from becoming a
      # mint (capped, final window, a whole tick left over, an attended row newer than
      # the watermark); --mutate plants the old now() stamp and each refusal's removal.
      - name: Settle carry - the watermark advances by accounted time
        if: ${{ !cancelled() }}
        run: |
          node tests/settle-carry-defer.mjs
          node tools/mutant-gate.mjs node tests/settle-carry-defer.mjs --mutate
