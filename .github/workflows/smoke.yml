      # THE ENVELOPE CONTRACT (2026-10-18; two server-vs-client shape mismatches in a
      # row — party seats vs members, the raw world vs huntOf — are a CLASS): a
      # premium two-hero party settled through the player door on the replayed
      # chain, its body handed to the real CharacterSession, every client
      # section reader required to yield the fields its widget draws (hunt,
      # timeline, settings, analyzer, party, stamina, premium, account, bag,
      # gear, skills, state), and every read('k') in src/ either contracted or
      # PENDING with an owner. --mutate renames one field per server producer
      # (and the settle response's timeline keys) and each must go red.
      - name: Envelope contract — the real projections through the client's readers
        if: ${{ !cancelled() }}
        run: |
          node tests/envelope-contract.mjs
          node tools/mutant-gate.mjs node tests/envelope-contract.mjs --mutate
  artisan-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 56

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      - name: Artisan accrual — mutation proof (22 mutants, clean baseline first)
        run: node tools/mutant-gate.mjs node tests/artisan-accrual.mjs --selftest

      # MOVED HERE FROM client-guards 2026-10-24: client-guards ran 20.3-20.9 min of
      # its 24 (87%) on runs 40034325773..40043808165, this step 500-546 s of it; this
      # job ran 2.7-3.6 min of 56. Node only, no browser, no database: any job serves.
      # client-guards ~11.8 min (49%), this job ~12.7 min (23%).
      # The live view (option B, 2026-10-19): the browser's swings are the server's (determinism over
      # commits and seed refreshes, solo and party), loot is not foreseeable from what the browser
      # holds, a divergence eases back, and a melee hero holds its tile like the sim's.
      - name: Hunt live view
        if: ${{ !cancelled() }}
        run: |
          node tests/hunt-live.mjs
          node tools/mutant-gate.mjs node tests/hunt-live.mjs --mutate

      # MOVED HERE FROM economy-selftests 2026-10-24 (lane i-v0241): the market lane
      # grew the fuzz (Storage + packed hunt supplies, 22 plants), --selftest ~270 ->
      # ~370 s locally. economy-selftests ran 18.7-37.2 min of its 61 (61%) on runs
      # 39788815419..40072613184, this step 146-351 s of it; on v0.2.38's slow runner
      # (35.3 min, no fuzz) plus the grown fuzz (~466 s) it projected ~44 min (73%).
      # This job ran 0.5-13.6 min of 56. economy-selftests ~36 min worst (59%), this
      # job ~22.5 (40%, one cold chain-prefix build here). Its own PGlite chain, no browser.
      # THE CONSERVATION FUZZ. Randomised, seeded operations across several
      # characters against the REAL server-authority migrations, running on an
      # in-process PostgreSQL — no database credentials, no branch, nothing to
      # clean up. --selftest runs the clean pass AND plants known conservation
      # violations, demanding that every one of them is caught: a fuzz that
      # cannot fail on a planted bug is decoration, and this repo has shipped six
      # always-null probes. Bounded op count here; soak with
      # `npm run test:conservation:soak`.
      - name: Conservation fuzz + injection selftest
        if: ${{ !cancelled() }}
        run: |
          node tests/conservation-fuzz.mjs --ops=400
          node tools/mutant-gate.mjs node tests/conservation-fuzz.mjs --selftest --ops=400

  # ── utc-midnight-replay ── SPLIT OUT OF db-replay 2026-09-19 (b550). The
  # GitHub run on ab7572e7 (branch next) measured db-replay's own steps: PGlite
  # snapshot cache 46 s, schema drift 73 s, THIS GUARD 411 s, ledger rollup
  # 44 s, catalogue literal drift 38 s, live-hash drift 38 s, rejections
  # journal 102 s (752 s so far) — then buff-queue was CANCELLED at 73 s by the
  # job's own `timeout-minutes: 14`, with eleven more steps never run. No
  # failing assertion anywhere in it: the family had simply outgrown its
  # budget the moment this guard was registered (2026-09-17).
  #
  # This guard runs every arm with HR_PGLITE_CACHE=0 — a cached arm restores a
  # snapshot instead of replaying the chain and proves nothing about the UTC
  # clock (see the guard's own header) — so it shares no snapshot with
  # db-replay's other guards and gets no PGlite-cache-verify step of its own:
  # there is no cache here to verify.
  #
  # MEASURED 2026-09-19 on the GitHub run for ab7572e7: 411 s (6.85 min).
  # Budget = measured x2 = 13.7 min, rounded up to 14.
  utc-midnight-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # THE CHAIN MUST REPLAY AT EVERY SECOND OF THE DAY. From 2026-08-29 to 2026-09-17 this
      # job went red whenever a run started within seconds of UTC midnight: section-4
      # self-check fixtures backdated rows with `now() - interval` and read them back
      # through hr_utc_day_start(now()), so just after midnight they landed in
      # yesterday and the chain refused to apply. The guard parks the clock around the
      # boundary (in the fixture's own clock) and replays; --selftest proves it bites.
      # SHARDED 2026-10-24: 14 replays of ~40 s plus the control were 577 s of this job's
      # 12.1-12.2 min (87% of 14) on runs 40034325773 / 40038892149. --shard=1/2 runs the
      # control and every 2nd arm (~330 s), --shard=2/2 (db-replay-6) the rest: ~8.5 min
      # here with the --selftest (61%), db-replay-6 9.3 -> ~14.8 min of 25 (59%).
      - name: UTC midnight replay — the chain applies at every second of the day
        if: ${{ !cancelled() }}
        run: |
          node tests/utc-midnight-replay.mjs --shard=1/2
          node tools/mutant-gate.mjs node tests/utc-midnight-replay.mjs --selftest

  # ── economy-selftests ── THE MUTATION HARNESSES. Twenty guards that each plant
  # 8-45 real defects in real migration text and demand every one turns the
  # guard red. Before the snapshot cache these replayed the whole chain per
  # mutation — several hundred replays per run, and the arithmetic that put the
  # b514 run through a 50-minute timeout.
  #
  # They are grouped because they share exactly one input: the applied chain.
  # One job builds the snapshot once and every guard after it restores.
  #
  # MEASURED 2026-09-07: 20/20 green in 895.2 s (14.9 min); the two longest are
  # conservation-fuzz 270.9 s and attended-loot-credit 94.9 s. The 2026-09-07
  # merge re-slotted three more steps here — goal-counter-kinds --selftest
  # (49.2 s; it replays the chain in PGlite, which is exactly this family's one
  # shared input) and worker-accrual --selftest + base run (6.2 s, a pure engine
  # harness but an ECONOMY faucet) — taking the family to 950.6 s (15.8 min).
  # Budget RAISED 30 -> 32, still measured x2.
  # + login-reward (2026-10-10, measured locally): 6 s plain + 315 s mutate =
  # 321 s (5.4 min); budget x2 = +11, so 32 -> 43.
  # + daily-harvest-eligibility (2026-10-11, estimated from login-reward's
  # per-replay cost: 1 replay plain + 4 SQL mutants ~ 4 min); budget x2 = +8,
  # so 43 -> 51.
  # + claim-intent moved from the 2026-08 slice to the whole replayed chain
  # (2026-10-19: login-reward now applies after the account wallet, which the
  # slice cannot replay). Measured locally: --selftest 251 s; budget +5, 51 -> 56.
  # + b569 (origin/main): delta-transport --selftest (34 s) and skill-row-upsert
  # --mutate (~100 s locally) = ~134 s; budget x2 = +5, so 56 -> 61.
  economy-selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 61

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # node_modules, NO browser. `playwright install --with-deps` is ~2 minutes
      # and buys nothing for a guard that never opens a page, so it stays in the
      # in-page job. The install itself runs in every family: a job that fails on
      # a dependency it did not know it had is a red build with no failing
      # assertion in it, and that is the class this whole slice is about.
      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # THE HUNT CORE (HUNT_SCREEN_SPEC §1.6): every tests/hunt-core/*.mjs —
      # grid, the one leash, movement, the event schema, the persisted world,
      # stepSwing inside the one loop (split-parity with the world re-decoded
      # at every cut), purity. Each file runs its cases AND plants its own
      # mutants into temp copies, so this one line is the plain run and the
      # proof. Core lanes add files there, never a line here.
      - name: Hunt core — movement, leash, world step (cases + mutants)
        if: ${{ !cancelled() }}
        run: node tests/hunt-core/run-all.mjs

      # THE BALANCE SIMULATOR'S SMOKE (Tyler's balance ruling 2026-10-25, §11): one 15-minute cell played on the
      # real engine twice must answer identical, sane numbers. NOT a balance guard (no tolerances yet, by the
      # ruling): it keeps the local tool (tools/balance-sim, heavy runs stay local) runnable as the engine moves.
      - name: Balance simulator — smoke (one cell on the real engine, deterministic)
        if: ${{ !cancelled() }}
        run: node tools/balance-sim/sim.mjs --smoke

      # THE ONE BASIC-ATTACK INTERVAL (Tyler 2026-10-14: 2.0 s, every player and
      # monster basic attack). I1 the value; I2 core, hr-accrue and a real hunt
      # agree on it; I3 moving the constant moves the engine, and no second
      # numeric copy exists under src/ or the edge. --mutate: five defects.
      - name: Basic attack — one 2.0 s interval, one source
        if: ${{ !cancelled() }}
        run: |
          node tests/basic-attack-interval.mjs
          node tools/mutant-gate.mjs node tests/basic-attack-interval.mjs --mutate

      # THE RENOWN FAUCET'S MUTATION HARNESS — the half that proves the guard
      # itself can fail. The guard already runs inside run-smoke; its --selftest
      # was wired into NOTHING, which is the restore-census mistake below,
      # repeated. Worse, until 2026-08-31 it graded ANY throw as a catch: eight
      # of eleven mutations demonstrated only "the apply threw", and a reviewer's
      # SYNTAX-ONLY non-defect duly reported ✓ CAUGHT. Every mutation now names
      # WHICH mechanism must catch it (the migration's own §3 gate, or this
      # file's assertions) and a regex the catch must MATCH; a syntax error or an
      # unplantable anchor is classified HARNESS and exits 2; and two permanent
      # NEGATIVE CONTROLS — the reviewer's syntax-only plant and a comment-only
      # plant — must never read as catches. Making `by` explicit also exposed
      # that R2's counter equality, R6 and R9 had no mutation that reached them
      # at all (§3 refused every defect aimed at them first), so all three were
      # assertions nothing had ever fired; they now have gate-blind twins.
      # 14 mutations + 2 controls, ~2 minutes of real PostgreSQL.
      - name: Renown faucet — every mutation caught by its NAMED assertion
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/renown-kill-faucet.mjs --selftest

      # ⬇ THE FLOOR UNDER EVERY MUTATION PROOF (2026-09-12, tests/guard-hygiene.mjs
      # RULE 5). Each of the 22 steps below used to register ONLY the --selftest arm.
      # A security review planted `where kind = NOSUCHCOLUMN_XYZ` in a guard's OWN SQL:
      # every arm threw, the driver read each throw as "the guard went red", and the step
      # printed "All 6 mutations caught", exit 0 — while the plain run of the same file
      # was RED. A proof arm answers "can this go red"; only the plain arm answers "is it
      # green when nothing is wrong", and it runs FIRST for that reason. Cost measured
      # locally: ~110 s total for all 22. tests/snapshot-allowlist-guard.mjs is the
      # standing proof the plain arm carries information the proof arm does not — its
      # plain run is red on today's tree with its --selftest green beside it.

      # RETIRED 2026-10-22 (world-actions cut, Tyler): tests/muster-chest-xp-credit.mjs proved the rally chest's XP credit on world_event_claim / world_event_absence_claim; both doors and hr_rally_xp_credit are dropped (12-03, 12-04 cuts). tests/old-rewards-gone.mjs keeps them cut (OR-4).

      # RETIRED 2026-10-22 (old-client reward cut, Tyler): tests/quest-xp-absence-pay.mjs proved the quest XP credit; hr_claim_quest is dropped. tests/old-rewards-gone.mjs keeps it cut.

      # RETIRED 2026-10-19 (core rebuild): tests/max-hp-tracks-hitpoints.mjs, the Hitpoints skill and the stored max_hp are deleted; max HP is derived from Level and armour, guarded by tests/core-curves.mjs (JS = SQL) and tests/hunt-sessions-settle.mjs MAXHP.

      # The attended-loot top-up is the OTHER half of the beta-2 progression
      # wall (production 2026-09-04: ~62% of an attended fight's drops were
      # credited, the settle re-simulating the session as if the player had
      # been away). Its guard drives the REAL computeAccrual (A1-A10) and
      # replays the whole migration chain into in-process PostgreSQL (C1-C9).
      # Unlike the renown and Bounty-Hunter guards it had NO step of its own —
      # it ran only inside run-smoke (step 6), so a CI-specific failure in it
      # was indistinguishable from any other step-6 failure and left no
      # readable signal. It gets parity here: 26 mutations, and the clean
      # control the --selftest re-runs per arm proves the guard passes in CI
      # in its own right. No credentials; production untouched.
      # (Attended loot-credit — RETIRED 2026-10-14 by lane C2: the attended
      # top-up, hr_attended_kills and hr_credit_kills are deleted by the hunt
      # sessions ruling. What replaces it: settle-carry-defer D6 (an attended
      # claim is INERT on every path), hunt-sessions-settle TICK-2 (no edge file
      # names the attended credit; its --mutate plants "[attended-loot-credit
      # no_topup]" and "[combat-parity skipFoodDebit / attended-loot A5]") and
      # hunt-sessions-db D1 (the functions are dropped). Deliberately
      # unregistered, not forgotten.)


      # THE TWO SERVER-OWNED FARM FACTS THAT WERE LOST ON RELOAD (Q-2 + Q-5,
      # supabase/migrations/2026-09-06-state-of-farm-projection.sql). hr_state_of
      # projected NEITHER player_state.plot_level nor player_farm.waterings, so a
      # paid Plot Lv 3 read back as Lv 1 (unlocked seeds gone, the Upgrade button
      # quoting the wrong tier's price) and a crop watered 4-8x came back with a
      # ONE-element history, its client isReady disagreeing with the server's and
      # stranding a ready crop behind a Water button. The guard drives the WHOLE
      # path on a replayed chain: the real hr_farm_upgrade_plot / hr_farm_water
      # write the rows, hr_state_of projects them, the real accrue.js
      # reconcileFarm rebuilds a FRESH G, and src/core/farm.js growthHours() on
      # the rebuilt plot must EQUAL hr_farm_growth_hours() on the server row --
      # the agreement check, which a projection that is array-SHAPED but not
      # array-VALUED fails while passing every key-existence assertion.
      # 5 defects x 2 arms; the gate-blind arm short-circuits the migration's own
      # SEC-2 commit gate so the tick is the guard's and not the migration's.
      # No credentials; production untouched.
      - name: State-of farm projection - plot tier and watering history survive a reload
        if: ${{ !cancelled() }}
        run: |
          node tests/state-of-farm-projection.mjs
          node tools/mutant-gate.mjs node tests/state-of-farm-projection.mjs --selftest

      # SA-010 / Q-4: PURCHASED BANK SPACE WAS ENFORCED AT THE BASE CAP.
      # hr_unlock_buy sells bank space as a 30-rung ladder and files it as a
      # player_progress unlock row; NOTHING ever wrote player_state.bank_cap,
      # which is the only number hr_apply's bank_full check reads. Ten paid rungs
      # = client cap 300, server cap 100, and every item-touching apply past 100
      # stacks refused. The guard drives the REAL hr_unlock_buy and the REAL
      # hr_apply on a replayed chain (PGlite, no credentials): the ladder is
      # measured back against src/data (the `20` per rung is the one magnitude no
      # server catalogue carries), the boundary is driven at the cap and one past
      # it, and the chain is replayed a SECOND time stopping BEFORE the migration
      # to REPRODUCE the bug and then prove the backfill heals it. 14 mutations
      # (seven, each twinned with the migration's own §5/§6 short-circuited so the
      # ✓ is the guard's and not the migration's).
      - name: Bank cap tracks rungs — purchased bank space is the enforced bank space
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/bank-cap-rungs.mjs --selftest

