# ============================================================
# CI gate for Hearthrise (b215)
#
# The 168-test smoke suite lived only behind Ctrl+Shift+T in a browser, so it
# could never block a bad push — by the repo's own workflow note it usually ran
# *after* a bug was already live on Pages. This runs the same suite headlessly
# on every push and PR, plus the cache-buster invariant that keeps a deploy from
# shipping half-stale modules.
#
# Deliberately no build step: the game is a static folder, so CI serves the repo
# exactly as GitHub Pages does.
# ============================================================
name: smoke

on:
  push:
    branches: [main]
    # DOCS-ONLY COMMITS DO NOT GATE CODE. The ledger and the audit
    # reports are updated many times a day; each one was starting a full
    # ~40-minute run, which queues behind the real ones and delays the
    # signal that actually matters. A release commit always touches
    # src/ (the cache-buster bump), so it is never skipped by this.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

# ── LEAST PRIVILEGE FOR THE WORKFLOW TOKEN (2026-08-23, open-beta hardening) ──
# The repository is PUBLIC and hearthrise.net is served from main, so the
# GITHUB_TOKEN handed to a job that runs on `push: main` is, if the repository
# default is "read and write", a token that can PUSH TO THE DEPLOYED SITE.
# Three steps of this job run third-party code with that token in the
# environment: `actions/checkout`, `actions/setup-node`, and — the big one —
# `npm install`, which executes lifecycle scripts from Playwright, PGlite and
# their whole transitive tree. One compromised package, and the site is theirs.
#
# `permissions:` here overrides the repository default, so this holds even if
# somebody flips that setting later. Nothing in this workflow writes anything:
# it checks out, installs, and runs tests. `contents: read` is the whole need.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 15 -> 20 on 2026-08-31: live-hash-drift replays the whole migration chain
    # once for the guard and three more times for its mutation proof, and the
    # renown-faucet mutation harness replays it sixteen times (~2m). A timeout
    # that trims mutation proofs is a timeout that deletes the only evidence a
    # guard can fail.
    #
    # 20 -> 30 on 2026-09-04, on a MEASUREMENT rather than a hunch. With every
    # guard finally green, `node tests/run-ci-local.mjs` — which derives its list
    # from the steps below — runs the thirteen CI-only steps in 856.6s (14m17s),
    # of which conservation-fuzz --selftest is 219.5s, renown-kill-faucet
    # --selftest 151.1s, activity-intent 108.0s and claim-intent 91.0s. Add
    # checkout + setup-node + `npm install` + `playwright install --with-deps`
    # and the in-page suite, none of which that number includes, and 20 minutes
    # was inside the noise of the wall. A job that TIMES OUT presents as a red
    # build with no failing assertion in it — indistinguishable, in the Actions
    # list, from the reds this workflow spent 2026-08-29..09-04 accumulating, and
    # the single most misleading way for a gate to fail. The margin is deliberate
    # and it is not a licence to slow down: a genuine hang still fails, ten
    # minutes later.
    # MEASURED 2026-09-05 on the dev machine: run-smoke ~12.8 min plus the
    # CI-only guards 793 s = ~26 min for both halves. A shared runner is
    # slower, and checkout/setup-node/npm/playwright add ~3 min on top, so
    # 30 could not fit the work even when nothing failed. A timeout is a red
    # build with no failing assertion in it -- indistinguishable from the
    # forty reds this workflow just came out of.
    # MEASURED 2026-09-07 (b514, 899e42f1): the job ran 50.2 min against this 50-minute

    # budget and GitHub CANCELLED it mid-step (the visual gate happened to be current) --

    # a red with no failing assertion, the exact failure this comment warns about. The

    # workflow grew to 58 sequential steps with cleanup slices 1-2 (three presentation

    # guards, six new selftests); run-ci-local measures ~47 min locally. The budget below

    # is the measured cost x1.8 while the job is still one serial chain; cleanup slice 8a

    # (in flight) splits it into a matrix by guard family and derives per-job budgets.

    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The cache-buster must agree across build-info.js, index.html and every
      # ESM import specifier. Cheap, so run it before spending time on a browser.
      - name: Cache-buster invariant
        run: bash bump-version.sh --check

      # ARM-FLAG HONESTY: the comment above an arm flag is the ONLY documentation
      # of where authority lives for that field, and every reader trusts it before
      # the value. The b454 cutover armed everything in one commit and left eight
      # comments saying "DORMANT" over a literal `true`; on 2026-08-31 the same
      # staleness on MARKS_RECORD_ARM_ENABLED produced a real misdiagnosis. Pure
      # source scan, no browser — run it with the other cheap gates.
      - name: Arm-flag honesty — no comment may contradict its flag's value
        run: |
          node tests/arm-flag-honesty.mjs --selftest
          node tests/arm-flag-honesty.mjs

      # DUPLICATE TOP-LEVEL FUNCTIONS: two declarations of one name in one scope
      # means the later hoists over the earlier and the earlier body is dead code
      # that can be edited, reviewed and shipped while changing nothing. Also
      # pins the eight legitimate cross-IIFE name collisions so a NEW one is loud.
      - name: Duplicate top-level fns — no dead twin in src/legacy.js
        run: |
          node tests/no-duplicate-toplevel-fns.mjs --selftest
          node tests/no-duplicate-toplevel-fns.mjs

      - name: Install Playwright + Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke suite (headless)
        # THE IN-PAGE BUDGET IS NOT THE JOB TIMEOUT. run-smoke.mjs caps the
        # page.evaluate at HR_SUITE_TIMEOUT_MS (default 120_000). CI ran with
        # the default while every local run used 300_000, so from b488 the
        # in-page step timed out here and passed on a dev machine -- a red
        # build with no failing assertion in it. The suite has since grown to
        # 1134 tests and a shared runner is slower than the machine that
        # wrote them, so this is set explicitly and generously. Only the wall
        # clock flexes; every assertion still has to pass.
        env:
          HR_SUITE_TIMEOUT_MS: '600000'
        run: node tests/run-smoke.mjs

      # QUEST ITEM REWARDS: THE SAME NUMBER IN ALL THREE PLACES.
      # Every quest item reward used to be PHANTOM — QUEST_DEFS authored it,
      # completeQuest paid it with addItem() (G.inventory only) and
      # hr_claim_quest credited gold only, so the next envelope that spoke about
      # the id erased it. 2026-09-06-quest-item-rewards.sql moves the credit
      # server-side, which puts the same authored number in three files:
      # src/data/goal-catalogue.js, src/legacy.js QUEST_DEFS and the SQL seed. A
      # one-sided edit means a player is promised 30 shrimp and paid 5 — or
      # promised an item and paid nothing. It also refuses an authored item that
      # is not server-credited (the phantom class being re-authored) and an id
      # that exists in no catalogue (authored, shipped, silently skipped).
      # Credential-free, database-free, seconds. --selftest plants all eight
      # defect classes and requires each to be caught by a named assertion.
      - name: Quest reward parity — data, client and server agree, every id real
        if: ${{ !cancelled() }}
        run: |
          node tests/quest-reward-parity.mjs
          node tests/quest-reward-parity.mjs --selftest

      # CAN THE REPO REBUILD THE DATABASE? After cutover the database is the ONLY
      # copy of every player's progression, and disaster recovery rests entirely
      # on "we can rebuild the schema from the repo". On 2026-08-14 that was
      # FALSE — 15 objects existed in production and in no file, and applying the
      # migrations in filename order got 23 of 41 files in — and there was no
      # test that could have said so. This replays supabase/schema.sql + every
      # migration onto a real in-process PostgreSQL in the order declared by
      # tests/schema-apply-order.json, then fingerprints the result against a
      # committed baseline. It ALSO fails if a new migration is not placed in
      # that order, so a file cannot be silently omitted from a rebuild.
      # No credentials; production untouched.
      #
      # --mutate plants seven real defects in the real migration text (a gutted
      # reconstruction, a vanished policy, a renamed column, RLS switched off on
      # a watched table AND on an unwatched one, a silent type change, and the
      # A11 lockdown GUC removed) and demands every one is caught. This repo has
      # shipped a guard that asserted nothing twelve times; this one does not get
      # to claim it works.
      #
      # --live-selftest proves the PRODUCTION half can fail. That half cannot run
      # here (it needs a live database, and no credentials belong in CI), but the
      # classifier behind it can: it plants a prod-only table, a repo-only table,
      # a changed table, a changed category with no per-table breakdown, and a
      # partial paste, and requires each to be reported. From 2026-08-14 to
      # 2026-08-30 the production delta was unfalsifiable prose that had been
      # measured exactly once; this is what stops it going back to that.
      - name: Schema drift — the repo must rebuild the database
        if: ${{ !cancelled() }}
        run: |
          node tests/schema-drift.mjs
          node tests/schema-drift.mjs --mutate
          node tests/schema-drift.mjs --live-selftest

      # ...AND DOES PRODUCTION CARRY THE BODIES THE REPO BELIEVES IT CARRIES?
      # schema-drift fingerprints SIGNATURES; its own header names function
      # BODIES as blind spot (C). On 2026-08-30 the renown-faucet migration ran
      # on production while the repo went on recording it as staged for a full
      # day, and nothing in this repository could have said so: the platform's
      # migration ledger is frozen (applies go through execute_sql) and the
      # migrations' own md5 pins fire only at APPLY time — they answer "may I
      # install?", never "what is installed right now?".
      #
      # This is the credential-free half. It DERIVES every hash-pinned and
      # programmatically-patched function from supabase/migrations/** — never a
      # hand list, which would be one migration from being wrong, and the
      # function that fell off it is the one nobody is watching — replays the
      # chain, and fails if the repo no longer rebuilds to the body the baseline
      # records. --selftest plants 16 defects (a mutated live hash, a deleted
      # baseline entry, a prod-only OVERLOAD of a hash-pinned function, a STAGED
      # migration found applied, a truncated paste, an unexplained divergence,
      # --write's own REVIEW placeholder left in place, two unreadable patcher
      # idioms) and requires each to be caught by the NAMED assertion written
      # for it, after a false-positive floor check. --mutate plants three in the
      # REAL migration text, including a comment edited into a body after it was
      # applied — invisible to every other guard in this repo.
      #
      # The PRODUCTION half (--live / --live-sql / --live-compare / --codediff)
      # is deliberately NOT here: the repository is public and this job runs npm
      # lifecycle scripts, so no database credential belongs in it. It is an
      # operator ritual — run it before any migration, restore or cutover step.
      - name: Live-hash drift — the repo's belief about deployed bodies
        if: ${{ !cancelled() }}
        run: |
          node tests/live-hash-drift.mjs
          node tests/live-hash-drift.mjs --selftest
          node tests/live-hash-drift.mjs --mutate

      # ...AND DOES THE DEPLOYMENT RECORD AGREE WITH THAT MEASUREMENT?
      # The step above measures what production runs. tests/schema-apply-order.json
      # is what an OPERATOR reads to decide what still has to be run — and on
      # 2026-09-06 its `_order_notes` said "STAGED, NOT APPLIED" for FOURTEEN
      # migrations that were measurably live, including three whose own notes
      # predicted the post-apply hash the baseline had already measured as the
      # LIVE one. Both records existed; nothing compared them. An operator acting
      # on the file would have re-applied all fourteen believing they were new;
      # every one happened to be anchor-guarded and idempotent, so they would have
      # failed closed — the next one might not.
      #
      # Credential-free by construction: it reads those two JSON files and
      # nothing else, no replay and no database, so it costs milliseconds and can
      # sit next to the guard whose measurements it consumes. A file is called
      # APPLIED only when it is the LAST file in the apply order touching a
      # tracked body that production carries — "last" because a later restatement
      # already contains an earlier file's change, so anything short of that
      # proves nothing and the guard stays silent rather than accusing.
      # --selftest plants both directions (a STAGED note on a live migration, an
      # APPLIED note on a body the baseline measured as absent), a structural
      # drift between the two files, and two NEGATIVE CONTROLS that must stay
      # silent.
      - name: Apply-order honesty — the deployment record vs the measurement
        if: ${{ !cancelled() }}
        run: |
          node tests/apply-order-honesty.mjs
          node tests/apply-order-honesty.mjs --selftest

      # THE PLOT-TIER PRICE — the client and the server may never disagree.
      # b510 re-priced the farm plot tier in GOLD behind a farming level after
      # production measured farm plants per day falling to ZERO for nine days
      # (the only way off tier 1 was a 0.1%-drop Farmer's Deed, and turnip is
      # the only tier-1 crop). That price now exists in FOUR authored places —
      # the migration's UPDATE, the migration's own self-check, the client
      # mirror src/core/farm.js PLOT_TIER_PRICES, and the GENERATED deed_cost
      # catalogue — and a re-price that moves three of them quotes the player a
      # number the RPC will not charge. It also guards the RULING: every tier's
      # required farming level must stay STRICTLY BELOW the earliest crop it
      # unlocks, so the tier can never become the wall again.
      # Credential-free and text-only (it parses the four files, no replay), so
      # it costs milliseconds. --selftest plants 9 defects, each of which must
      # be caught by its NAMED assertion, plus 2 negative controls (a comment
      # edit and a whitespace edit) that must stay silent; --mutate plants 3 in
      # the real file text.
      - name: Plot-tier price parity — client mirror vs server catalogue
        if: ${{ !cancelled() }}
        run: |
          node tests/plot-tier-parity.mjs
          node tests/plot-tier-parity.mjs --selftest
          node tests/plot-tier-parity.mjs --mutate

      # THE RENOWN FAUCET'S MUTATION HARNESS — the half that proves the guard
      # itself can fail. The guard already runs inside run-smoke; its --selftest
      # was wired into NOTHING, which is the restore-census mistake below,
      # repeated. Worse, until 2026-08-31 it graded ANY throw as a catch: eight
      # of eleven mutations demonstrated only "the apply threw", and a reviewer's
      # SYNTAX-ONLY non-defect duly reported ✓ CAUGHT. Every mutation now names
      # WHICH mechanism must catch it (the migration's own §3 gate, or this
      # file's assertions) and a regex the catch must MATCH; a syntax error or an
      # unplantable anchor is classified HARNESS and exits 2; and two permanent
      # NEGATIVE CONTROLS — the reviewer's syntax-only plant and a comment-only
      # plant — must never read as catches. Making `by` explicit also exposed
      # that R2's counter equality, R6 and R9 had no mutation that reached them
      # at all (§3 refused every defect aimed at them first), so all three were
      # assertions nothing had ever fired; they now have gate-blind twins.
      # 14 mutations + 2 controls, ~2 minutes of real PostgreSQL.
      - name: Renown faucet — every mutation caught by its NAMED assertion
        if: ${{ !cancelled() }}
        run: node tests/renown-kill-faucet.mjs --selftest

      # THE BOUNTY-HUNTER XP MUTATION HARNESS — same lesson as the step above,
      # applied on the way IN rather than after the fact. The guard itself runs
      # inside run-smoke; this is the half that proves it can fail.
      #
      # It matters more here than usual because of WHAT the guard is watching.
      # Bounty-Hunter XP was never credited by any server code for the whole
      # life of the beta (production 2026-09-05: 36 characters, max(xp) = 0), so
      # every board tier above 1 was unreachable for every player — and nothing
      # in the repo noticed, because no test had ever driven the credit at all.
      # The regression that would bring it back is a LATER migration restating
      # hr_claim_bounty__ungated from a stale template, at which point the
      # migration's own §2 gate never runs and only this guard is left standing.
      # SEVEN of the fifteen mutations are therefore repeated with that gate
      # short-circuited, so the ✓ is the guard's and not the migration's.
      # 15 mutations, ~2.5 minutes of real PostgreSQL.
      - name: Bounty-Hunter XP — every mutation caught, gate-blind twins included
        if: ${{ !cancelled() }}
        run: node tests/bounty-hunter-xp.mjs --selftest

      # SA-048: crediting Bounty-Hunter XP (b504, the step above) made the board a
      # RANKED surface, but hr_accept_bounty gated the target TIER by SERVER COMBAT
      # level ONLY. The board's DIFFICULTY ladder is client-only: slot-3 'hard'
      # appears only at BH>=15 and 'elite' is never board-generated, so a BH-1
      # caller could pass difficulty='hard' directly and buy the 1.3x XP
      # multiplier on the ranked skill. (The first draft also clamped the TIER to
      # a board-tier ladder; Security proved that premise FALSE — the board posts
      # unlockedTier(combatLevel), combat only — so the clamp was REMOVED as an
      # honest lockout and this is difficulty-only.) The guard drives a REAL
      # character through the rate-gated hr_accept_bounty on a replayed chain,
      # proves an honest tier-6 accept at BH-1 is NOT locked out, and replays the
      # chain a SECOND time stopping before the migration to prove an honest
      # accept is byte-identical. Like the two guards above it is STAGED-migration
      # and had no step of its own — it gets parity here: 8 mutations (four, each
      # twinned with the migration's own §3 short-circuited so the ✓ is the
      # guard's and not the migration's). No credentials.
      - name: Bounty-accept BH-clamp — difficulty gated by BH level, honest tier not locked out
        if: ${{ !cancelled() }}
        run: node tests/bounty-accept-bh-clamp.mjs --selftest

      # MAX HP IS THE HITPOINTS LEVEL — and on the server it never was. max_hp was
      # stamped once at character creation (hr_start_kit, 10) and no credit site
      # ever moved it again, so every server-resolved fight ran at a 10 HP ceiling
      # and Auto-Eat's percentage threshold was scaled to 10 with it. The fix is a
      # derivation attached to the DATA (an AFTER trigger on player_skills) rather
      # than a copy of the rule inside each of the six RPCs that credit hitpoints
      # XP, so it cannot drift; the migration also backfills every existing
      # character from its own persisted XP. It gets a step of its own for the
      # reason the loot-credit one above did: the guard drives the real rate-gated
      # hr_credit_combat_xp AND hr_apply on a replayed migration chain, and it is
      # the ONLY thing that can see a broken BACKFILL — on a fresh replay no
      # character exists yet, so the migration's own VERIFY block passes on a
      # backfill that corrects nothing. 9 mutations, one gate-blind. No credentials.
      - name: Max HP tracks hitpoints — attended, settle, backfill, raise-only
        if: ${{ !cancelled() }}
        run: node tests/max-hp-tracks-hitpoints.mjs --selftest

      # The attended-loot top-up is the OTHER half of the beta-2 progression
      # wall (production 2026-09-04: ~62% of an attended fight's drops were
      # credited, the settle re-simulating the session as if the player had
      # been away). Its guard drives the REAL computeAccrual (A1-A10) and
      # replays the whole migration chain into in-process PostgreSQL (C1-C9).
      # Unlike the renown and Bounty-Hunter guards it had NO step of its own —
      # it ran only inside run-smoke (step 6), so a CI-specific failure in it
      # was indistinguishable from any other step-6 failure and left no
      # readable signal. It gets parity here: 26 mutations, and the clean
      # control the --selftest re-runs per arm proves the guard passes in CI
      # in its own right. No credentials; production untouched.
      - name: Attended loot-credit — top-up bounded, loot-only, botd per UTC-day segment
        if: ${{ !cancelled() }}
        run: node tests/attended-loot-credit.mjs --selftest

      # THE DUNGEON-SCRIP SERVER-OF-RECORD GUARDS (SA-015, docs/design/
      # dungeon-settlement.md). Report #3 was "dungeon scrip goes to 0 on reload"
      # — scrip minted client-side, wiped by the blob-retired rebuild. These prove
      # the server-of-record fix END TO END on the REAL migration chain (PGlite):
      # the earn (hr_dungeon_settle) with its 5,000-gross / 250-count daily fuses
      # and the Condition-3 rule that a Quartermaster SPEND (negative meta.scrip)
      # can never net down the earn cap; the spend (hr_quartermaster_buy) server-
      # priced + debit-once + replay-safe; the marketability shape (scrip/keys
      # BoP, blueprints/deed tradeable — Tyler b268); and the reload survival
      # itself (hr_state_of projects the balance, record.js reads it back). Each
      # --selftest plants real defects and demands every one turns the guard RED.
      # The GREEN pass runs inside run-smoke's dungeonServerGuardsPreflight.
      - name: Dungeon settle — scrip earn, positive-only cap, 250-count cap, key gate
        if: ${{ !cancelled() }}
        run: node tests/dungeon-settle.mjs --selftest

      - name: Quartermaster buy — server-priced, debit-once, replay-safe, negative spend row
        if: ${{ !cancelled() }}
        run: node tests/quartermaster-buy.mjs --selftest

      - name: Dungeon marketability — scrip/keys BoP, blueprints/deed stay tradeable
        if: ${{ !cancelled() }}
        run: node tests/dungeon-marketability.mjs --selftest

      - name: Dungeon scrip reload — report #3, scrip survives reload not reset to 0
        if: ${{ !cancelled() }}
        run: node tests/dungeon-scrip-reload.mjs --selftest

      # THE TWO SERVER-OWNED FARM FACTS THAT WERE LOST ON RELOAD (Q-2 + Q-5,
      # supabase/migrations/2026-09-06-state-of-farm-projection.sql). hr_state_of
      # projected NEITHER player_state.plot_level nor player_farm.waterings, so a
      # paid Plot Lv 3 read back as Lv 1 (unlocked seeds gone, the Upgrade button
      # quoting the wrong tier's price) and a crop watered 4-8x came back with a
      # ONE-element history, its client isReady disagreeing with the server's and
      # stranding a ready crop behind a Water button. The guard drives the WHOLE
      # path on a replayed chain: the real hr_farm_upgrade_plot / hr_farm_water
      # write the rows, hr_state_of projects them, the real accrue.js
      # reconcileFarm rebuilds a FRESH G, and src/core/farm.js growthHours() on
      # the rebuilt plot must EQUAL hr_farm_growth_hours() on the server row --
      # the agreement check, which a projection that is array-SHAPED but not
      # array-VALUED fails while passing every key-existence assertion.
      # 5 defects x 2 arms; the gate-blind arm short-circuits the migration's own
      # SEC-2 commit gate so the tick is the guard's and not the migration's.
      # No credentials; production untouched.
      - name: State-of farm projection - plot tier and watering history survive a reload
        if: ${{ !cancelled() }}
        run: node tests/state-of-farm-projection.mjs --selftest
      # SA-010 / Q-4: PURCHASED BANK SPACE WAS ENFORCED AT THE BASE CAP.
      # hr_unlock_buy sells bank space as a 30-rung ladder and files it as a
      # player_progress unlock row; NOTHING ever wrote player_state.bank_cap,
      # which is the only number hr_apply's bank_full check reads. Ten paid rungs
      # = client cap 300, server cap 100, and every item-touching apply past 100
      # stacks refused. The guard drives the REAL hr_unlock_buy and the REAL
      # hr_apply on a replayed chain (PGlite, no credentials): the ladder is
      # measured back against src/data (the `20` per rung is the one magnitude no
      # server catalogue carries), the boundary is driven at the cap and one past
      # it, and the chain is replayed a SECOND time stopping BEFORE the migration
      # to REPRODUCE the bug and then prove the backfill heals it. 14 mutations
      # (seven, each twinned with the migration's own §5/§6 short-circuited so the
      # ✓ is the guard's and not the migration's).
      - name: Bank cap tracks rungs — purchased bank space is the enforced bank space
        if: ${{ !cancelled() }}
        run: node tests/bank-cap-rungs.mjs --selftest
      # Security C4 (2026-09-06): a --selftest-only registration cannot tell a broken
      # migration from a working guard (every arm throws either way). Run the base too.
      - name: Bank cap tracks rungs — base run (the migration itself is green)
        if: ${{ !cancelled() }}
        run: node tests/bank-cap-rungs.mjs

      # REALTIME COST. Measured on production 2026-09-06 over 20.25 days: the
      # Realtime WAL poller is 2,706,517 calls / 15,669 s / max 9.8 s — ~61% of
      # all exec time and ~36x the #2 statement — for two published tables, one
      # of which no client subscribed to. The guard asserts an EQUALITY, both
      # directions: the publication set == the postgres_changes subscriptions in
      # src/**. Published-but-unsubscribed is pure poller cost; subscribed-but-
      # unpublished is a feature that silently never fires (which is what the
      # market panel shipped for months). Per C4, base AND selftest: a
      # selftest-only registration cannot tell a broken migration from a working
      # guard.
      - name: Realtime cost — publication == client subscriptions, both directions
        if: ${{ !cancelled() }}
        run: node tests/realtime-cost.mjs --selftest
      - name: Realtime cost — base run (the trim migration itself is green)
        if: ${{ !cancelled() }}
        run: node tests/realtime-cost.mjs

      # THE RECOVERY RULE'S SQL HALF (First-Night Idle Rescue, rev. 2).
      # A death INTERRUPTS a run; it does not terminate it. The JS half -- the
      # escalating ladder, the 40% resume, the gating of every payable kind --
      # is asserted by tests/accrual-engine.mjs RECOVER-1..8 inside run-smoke.
      # THIS is the half that lives in Postgres, driven against the real ordered
      # migration chain: hr_rest (the food-only relief valve) eats from the
      # SERVER's bag and clears the timer, is all-or-nothing, is replay-safe, and
      # refuses a free cure / a character who is up / an unpaid window; hr_apply
      # writes recovering_until absolute, ADMITS an honest 64-minute ladder stamp
      # (the assertion that would have caught rev. 1's 15-minute ceiling silently
      # deleting the top four rungs in production), refuses a forgery, and is NOT
      # voided by an activity switch; the death ledger is one value-free row per
      # death and BOUNDED; hr_set_auto_eat stamps the touch on every call so the
      # one-time switch-on offer cannot be made twice; and the ladder's two
      # counters survive a truncated `progress` array, which is the whole reason
      # they are projected as their own scalars.
      # 13 mutations, no credentials, production untouched.
      - name: Recovery rule - hr_rest, the ladder ceiling, the death ledger, the auto-eat stamp
        if: ${{ !cancelled() }}
        run: node tests/recovery-rest.mjs --selftest

      # SECURITY F1 -- THE ATTENDED HALF OF THE SAME RULE.
      # The Recovery Rule shipped with a hole its own header named: the AWAY path
      # pays nothing inside the window, but the ATTENDED cadence RPCs
      # (hr_credit_kills__ungated / hr_credit_combat_xp__ungated) did NOT floor
      # their credit window at recovering_until, so a MODIFIED client could keep
      # reporting kills and combat XP straight through a knockout and be paid at
      # the physical cap -- and those are the RANKED surfaces (combat XP is the
      # server-sourced leaderboard number; the kill counters are graded by
      # hr_renown_of and PAID by hr_claim_daily). This asserts the floor exists in
      # BOTH bodies and in all THREE windows (the bounty-free anchor, the bounty
      # accepted_at window, the combat-XP watermark), that a knockout credits ZERO
      # with a named reason, that the migration is an ANCHORED PATCH rather than a
      # restatement (a restated hr_credit_kills__ungated would silently delete the
      # renown credited counters), that the refusal writes nothing and therefore
      # retires no unpaid watermark, and that its audit row is bounded to one
      # value-free row per character per UTC day.
      # 14 mutations, static, no credentials, production untouched.
      # (`--replay` additionally reads the same properties off a rebuilt pglite
      # chain; not run here because schema-drift already replays the chain.)
      - name: Recovery floor - the attended cadence RPCs obey recovering_until
        if: ${{ !cancelled() }}
        run: node tests/cadence-recovery-floor.mjs --selftest

      # R10, THE STANDING RULE: RECOVERY IS NOT FOR SALE.
      # No trait, unlock, gold-ladder rung, Quartermaster offer, clan bond, perk,
      # renown rank, glyph or companion may key a mechanical effect on recovery
      # duration, a recovery skip, or a death counter. Relief is bought with FOOD
      # (hr_rest) or it is not bought. The catalogues are DATA and grow by rows,
      # so this fails on the day such a row is WRITTEN rather than the day it is
      # noticed. Static, credential-free, milliseconds.
      - name: Recovery relief - nothing in any catalogue sells a way off the floor
        if: ${{ !cancelled() }}
        run: node tests/recovery-relief-guard.mjs --selftest

      # A DEATH THE PLAYER WATCHED IS STILL THE SERVER'S.
      # b509's Recovery Rule held away and not live: the attended death called
      # stopCombat(), which declares `idle`, and hr_apply stamps
      # `accrued_to = now()` on any activity delta - so the window the death was
      # in was closed before anything simulated it. Measured on the QA account:
      # recovering_until NULL, hp 12/12, no deaths row, no ledger row, while the
      # sheet counted down from a rung the client had invented out of a LIFETIME
      # death tally. This guard drives the client fall-state machine headlessly
      # (up -> pending -> recovering/unconfirmed) and source-scans the three
      # places the bug can come back. 9 mutations, no credentials, milliseconds.
      - name: Attended fall - the client asks, the server answers, nobody invents a timer
        if: ${{ !cancelled() }}
        run: node tests/attended-fall.mjs --selftest

      # AND WHICH ROWS DOES THE REBUILD *NOT* GIVE BACK?
      # schema-drift proves the SCHEMA rebuilds and says, in its own header, that
      # it "says nothing about whether any row survives a restore". This is that
      # half: every base table in `public` must state whether a repo rebuild
      # reproduces its rows or whether only a BACKUP has them.
      #
      # ⚠ It existed since 2026-08-15 and was WIRED INTO NOTHING — not here, not
      #   run-smoke, not package.json. In that fortnight the schema went from 67
      #   to 90 base tables and 23 arrived with no DR class at all, including
      #   player_bank and player_workers, which hold player value, while every
      #   other player_* table was classified restore_only. Nobody could have
      #   known: no build ran it. That is the whole reason this step exists.
      #
      # The census now also fails on a rationale-free classification, on a
      # player-value table quietly downgraded to make a red build green, and on
      # any NEW table carrying a user_id that appears in neither the player-value
      # manifest nor the written exemption list. Adding a player-scoped table
      # without ruling on it is one red line and one line to fix.
      #
      # --mutate plants six defects in the real migration text (a catalogue that
      # rebuilds one row long past its own floor check, a lost retention cron, an
      # unclassified table, an unruled player-scoped table, a restore_only table
      # that starts being seeded) and demands each is caught BY THIS GUARD rather
      # than by a neighbour. --baseline-selftest does the same for the half that
      # lives in the baseline rather than in SQL: nine planted classification
      # defects, each pinned to the specific message that must fire.
      #
      # No credentials; production untouched. The PRODUCTION half is
      # `--live-sql` / `--live-compare` and is deliberately NOT here: it needs a
      # live database, and no database credential belongs in a job that runs npm
      # lifecycle scripts (see `permissions:` above). It is a pre-apply ritual —
      # run it before any migration that touches a data-bearing table, and before
      # any rebuild or restore.
      - name: Restore census — which rows only a backup gives back
        if: ${{ !cancelled() }}
        run: |
          node tests/restore-census.mjs
          node tests/restore-census.mjs --mutate
          node tests/restore-census.mjs --baseline-selftest

      # THE CONSERVATION FUZZ. Randomised, seeded operations across several
      # characters against the REAL server-authority migrations, running on an
      # in-process PostgreSQL — no database credentials, no branch, nothing to
      # clean up. --selftest runs the clean pass AND plants ten known
      # conservation violations, demanding that every one of them is caught: a
      # fuzz that cannot fail on a planted bug is decoration, and this repo has
      # shipped six always-null probes. Bounded op count here (~25s); soak with
      # `npm run test:conservation:soak`.
      - name: Conservation fuzz + injection selftest
        if: ${{ !cancelled() }}
        run: node tests/conservation-fuzz.mjs --selftest --ops=400

      # THE PLAYER INTENTS. Both run the REAL Edge-Function modules — the same
      # bytes tools/pack-edge.mjs ships — behind their one injected `exec` seam,
      # against the REAL migration chain on an in-process PostgreSQL.
      #
      # ⚠ activity-intent was NOT ON THIS LIST until b349, and it should have
      #   been from the day it landed: 27 mutation-proven invariants that
      #   nothing on any push ever ran. It is the whole contract the other eight
      #   intents copy. Found while wiring the second intent in, which is the
      #   ordinary way a coverage hole surfaces — the second time you do a thing.
      - name: The activity intent — collect-before-switch, replay, key hygiene
        if: ${{ !cancelled() }}
        run: node tests/activity-intent.mjs --selftest

      # THE GRANT INTENT (b349). The first intent that MOVES MONEY, so the
      # invariants are about payment: a claim lands exactly once, the price and
      # the period and the streak are all the server's, a replay receipts
      # nothing, and one key reused on a later day is a loud intent_mismatch
      # rather than a silent no-op. --selftest plants 23 regressions and demands
      # every one is caught.
      - name: The grant intent — claim once, server-priced, server-dated
        if: ${{ !cancelled() }}
        run: node tests/claim-intent.mjs --selftest

      # THE CLAN JOURNAL INVARIANT (F1 + F3, 2026-08-13). "Every RPC that writes
      # a shared table emits a clan_ledger row in the same transaction" — proven
      # by calling the real RPCs on an in-process PostgreSQL with the real clan
      # migration chain applied, not by a regex over migration text. --selftest
      # plants seven regressions; FOUR of them are invisible to the migrations'
      # own commit gates and are caught only here.
      - name: Clan journal + per-day caps (F1/F3)
        if: ${{ !cancelled() }}
        run: node tests/clan-journal-guard.mjs --selftest

      # THE ANON RATE GATE (F4, 2026-08-13). Reproduces Security's probe — 30
      # anonymous calls against a limit of 20 must produce refusals — with the
      # authenticated control that made the original finding legible, plus the
      # forged-x-forwarded-for test that separates a real key from a decorative
      # one. Must stay green before A11's server half is applied.
      - name: Anon rate gate (F4)
        if: ${{ !cancelled() }}
        run: node tests/anon-rate-gate.mjs --selftest

      # THE HUNT BAND. Proves, by running the real migration bodies on an
      # in-process PostgreSQL, that the retired median rule DID let one member's
      # honest good week pay a teammate nothing, that the shipped rule does not,
      # and that a free-rider still collects nothing either way. --selftest
      # mutates the real fix SQL five ways and demands every mutation is caught.
      - name: Hunt band — denial before, gone after, free-rider still refused
        if: ${{ !cancelled() }}
        run: node tests/raid-band-denial.mjs --selftest

      # ...and that the rule is READABLE. A reward rule a player cannot see is
      # the same failure as a stat that renders no number. Drives the real
      # raids.js in real Chromium and asserts on the card's own text.
      - name: Hunt card states the band rule
        if: ${{ !cancelled() }}
        run: node tests/raid-card-copy.mjs

      # THE POSTGREST RPC RESOLUTION GATE.
      # The A9 retrofit (2026-08-11) rewrapped 35 live RPCs; every wrapper had to
      # keep the original PARAMETER NAMES, because that is what PostgREST resolves
      # on. Get one wrong and the migration reports success while the RPC starts
      # answering PGRST202 to real players. That was checked by hand exactly once.
      # This checks it on every push, against a committed baseline, with a control
      # that must NOT resolve so the probe cannot silently go blind.
      #
      # Read-only against production and needs no secret: 38 of the 41 calls are
      # refused by Postgres before the body runs, 2 read the public leaderboard,
      # and the anon key is public by design and already committed in
      # src/net/supabase-bootstrap.js. `continue-on-error` is DELIBERATELY ABSENT —
      # an RPC the client can no longer see is a player-facing outage.
      - name: RPC resolution vs baseline
        if: ${{ !cancelled() }}
        run: node tests/rpc-resolution.mjs

      # IS verify_jwt ACTUALLY ON, ON THE DEPLOYED FUNCTIONS?
      # supabase/config.toml pins it true for both functions and
      # bug-report-bridge's own header states it as its contract. On
      # 2026-08-23 the deployed bug-report-bridge answered its own 400 to a
      # caller holding `Bearer aaa.bbb.ccc`, while hr-accrue — same header,
      # same project — was refused by the gateway. A file is not a deployment,
      # and the existing guard (accrual-engine.mjs) only ever read the file.
      #
      # Read-only against production and needs no secret, exactly like the RPC
      # probe above: one POST per function with a garbage token, plus a control
      # (the public leaderboard) that MUST succeed, so an unreachable project
      # is reported as INCONCLUSIVE rather than as a green tick.
      - name: Edge Functions verify JWT at the gateway
        if: ${{ !cancelled() }}
        run: node tests/edge-jwt-gate.mjs --strict

      # -- THE PRESENTATION-LAYER FLOOR (cleanup slice 1) --------------------
      # Three ratchets on the things CLAUDE.md has asserted for months while
      # nothing measured them. None of them asks for the existing debt to be paid
      # today; each one freezes today's number and goes red when it grows.
      #
      # 1. HARDCODED COLOURS. Section 7 says "every colour is a CSS token from
      #    theme-cozy.css". Nine stylesheets carry 2,011 raw colour literals and
      #    1,096 !important. Per file, per metric, that is now the ceiling.
      #    Token definitions inside :root / body[data-theme...] are exempt - the
      #    ladder is the fix, not the debt. A second table ratchets hex colours
      #    inside JS strings (533 across 43 files), the other door the same debt
      #    walks through.
      # 2. BREAKPOINTS. Twenty-eight distinct @media spellings across nine
      #    sheets, including three different spellings of the mobile rail. The
      #    set is frozen; a NEW spelling is red. (Measured: the mobile rail is
      #    540/1024 x25 vs 900/1024 x8, and the string section 7 documents
      #    appears zero times.)
      # 3. THE PLAYER'S-EYE PASS, with teeth. tests/visual-qa.mjs has always
      #    exited 0 by design - "a REPORT, not a gate" - so a clipped heading
      #    could ship at no cost. The wrapper fails ONLY on a P0/ERR or on a P1
      #    at a (screen, viewport, kind, selector) key that is not in the
      #    committed baseline. Pixel and copy deltas on a known finding are not
      #    regressions. `.hr-desktopmode-banner` is excluded as environmental -
      #    all 84 under-fixed-bar findings sit under that harness strip.
      #
      # Every one carries --selftest: planted mutations that must be caught by
      # THAT guard. A ratchet that has never bitten is a decoration.
      - name: Presentation floor - colour and !important ratchet
        if: ${{ !cancelled() }}
        run: |
          node tests/css-literal-ratchet.mjs --report
          node tests/css-literal-ratchet.mjs --selftest

      - name: Presentation floor - one set of breakpoints
        if: ${{ !cancelled() }}
        run: |
          node tests/breakpoint-guard.mjs --report
          node tests/breakpoint-guard.mjs --selftest

      # Needs the Chromium installed above. The gate half is a pure function and
      # is proven by --selftest without a browser, so a Chromium problem shows up
      # as exit 2 (harness) rather than as a visual verdict.
      - name: Presentation floor - visual QA gate (P0 / new P1)
        if: ${{ !cancelled() }}
        run: |
          node tests/visual-qa-gate.mjs --selftest
          node tests/visual-qa-gate.mjs

      # A failing run is far easier to diagnose with the page state attached.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            tests/**/*.png
            tests/**/*.log
          if-no-files-found: ignore
          retention-days: 7

      # slice 3 — deletions proven dead (derived censuses, never hand-pinned).
      # Appended at the END of the file on purpose: slice 2 is appending its own
      # steps here too, and two blocks under distinct comments merge cleanly.
      - name: Cleanup slice 3 - dead export census
        if: ${{ !cancelled() }}
        run: |
          node tests/dead-exports.mjs --selftest
          node tests/dead-exports.mjs

      - name: Cleanup slice 3 - dead CSS class census
        if: ${{ !cancelled() }}
        run: |
          node tests/dead-css.mjs --selftest
          node tests/dead-css.mjs

      # slice 3 (b515) - the window.Hearthrise* census. A misspelt global is silently
      # undefined, so the feature behind it is DEAD rather than loudly broken:
      # window.HearthriseAccrue kept the dungeon-settle arm off while the flag said ON.
      - name: Cleanup slice 3 - window globals census
        if: ${{ !cancelled() }}
        run: |
          node tests/window-globals-exist.mjs --selftest
          node tests/window-globals-exist.mjs
