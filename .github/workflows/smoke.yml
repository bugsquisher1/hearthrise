  # Budget = measured x2 = 56; re-measure from the first GitHub run and tighten.

      # Lane C2 hunt sessions — THE SETTLE (supabase/functions/hr-accrue/
      # hunt-settle.js + 2026-10-22-hunt-sessions-settle.sql, ruling
      # HR-2026-10-14 §4): TICK-2 (no ctx.away / presence / cap read on the hunt
