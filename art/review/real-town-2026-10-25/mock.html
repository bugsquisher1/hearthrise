const q = new URLSearchParams(location.search);

const img = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });

function label(g, text, x, y, size, color, align) {
  g.font = (size >= 13 ? '600 ' : '') + size + 'px Georgia, serif'; g.textAlign = align || 'center';
  const w = g.measureText(text).width + 12, x0 = align === 'left' ? x - 6 : x - w / 2;
  g.fillStyle = C.plate; g.fillRect(x0, y - size, w, size + 7);
  g.fillStyle = color || C.gold; g.fillText(text, x, y);
}

/* ═══ 2. CLOSE-UPS: Hearth Square on the 32 px grid at x2 ═════════════════ */
const T = 32;
// placeholder ground zones in blueprint tiles [x, y, w, h, kind]
const GROUND = [
  [42, 10, 30, 30, 'grass'], [51, 18, 16, 16, 'cobble'], [52, 26, 11, 2, 'flag'], [40, 10, 3, 30, 'road'], [43, 24, 8, 4, 'road'],

];

const FACADES = [[53, 12, 9, 6, 'general_store'], [58, 13, 8, 6, 'guard_barracks'], [54, 30, 11, 7, 'depot'], [56, 6, 8, 6, 'bank']];
const STALLS = [[63, 20], [63, 24], [63, 28]];

const STANDS = [[55,26],[56,26],[57,26],[58,26],[59,26],[60,26],[61,26],[54,27],[56,27],[58,27],[60,27],[62,27],[52,24],[53,24],[62,24],[63,24],

async function loadSprites() {
  const m = await (await fetch('sprites.json')).json(); Object.assign(meta, m);
  const ids = new Set([...OBJECTS.map((o) => o[0]), ...HEROES.map((h) => h[0])]);
  for (const id of ids) if (meta[id]) meta[id].img = await img('../../../art/world/' + meta[id].dir + '/' + meta[id].src);
}
function scene(opt) {   // the square at 1 art px = 1 px; returns { cv, plates, fire: [x, y] }
  const x0 = 40, y0 = 4, W = 34, H = 38;
  const cv = document.createElement('canvas'); cv.width = W * T; cv.height = H * T;
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
  const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect((x - x0) * T, (y - y0) * T, w * T, h * T); };
  g.fillStyle = C.grassA; g.fillRect(0, 0, cv.width, cv.height);
  for (const [x, y, w, h, k] of GROUND) for (let ty = y; ty < y + h; ty++) for (let tx = x; tx < x + w; tx++) {
    const odd = (tx + ty) % 2;
    R(tx, ty, 1, 1, k === 'grass' ? (odd ? C.grassA : C.grassB) : k === 'cobble' ? (odd ? C.cobble : C.cobbleB) : k === 'flag' ? (odd ? C.flag : C.flagB)
      : k === 'water' ? (ty % 2 ? C.water : C.waterB) : k === 'bridge' ? C.wood : '#9a8f7c');
    if (k === 'flag') { g.strokeStyle = 'rgba(40,34,28,0.5)'; g.strokeRect((tx - x0) * T + 1.5, (ty - y0) * T + 1.5, T - 3, T - 3); }
  }
  const draws = [];
  const tagBlock = (cx, cy, text, sub) => { g.fillStyle = C.ink; g.font = 'bold 11px Georgia, serif'; g.textAlign = 'center'; g.fillText(text, cx, cy); g.font = '9px Georgia, serif'; g.fillText(sub || 'PLACEHOLDER', cx, cy + 12); };
  for (const [x, y, w, h, name] of FACADES) draws.push({ foot: (y + h - y0) * T, f: () => {
    R(x, y - 1, w, h - 1, C.roof); R(x, y + h - 2, w, 2, C.block);
    g.strokeStyle = C.blockEdge; g.lineWidth = 2; g.strokeRect((x - x0) * T + 1, (y - 1 - y0) * T + 1, w * T - 2, (h + 1) * T - 2);
    tagBlock((x + w / 2 - x0) * T, (y + h / 2 - y0) * T, name);
  } });
  for (const [x, y] of STALLS) draws.push({ foot: (y + 2 - y0) * T, f: () => { R(x, y - 1, 3, 1, '#8c3b2c'); R(x, y, 3, 2, '#7c6a52'); tagBlock((x + 1.5 - x0) * T, (y + 1 - y0) * T, 'stall', 'later'); } });
  for (const [x, y] of BENCHES) draws.push({ foot: (y + 1 - y0) * T, f: () => { R(x, y + 0.3, 2, 0.5, C.wood); tagBlock((x + 1 - x0) * T, (y + 0.4 - y0) * T - 4, 'bench', ' '); } });
  // THE GREAT HEARTH (placeholder shape: chimney, body, two log alcoves, the firebox)
  const fire = [(58.5 - x0) * T, (24.2 - y0) * T];
  draws.push({ foot: (26 - y0) * T, f: () => {
    const fireRamp = opt.ramp || C.fire;
    const glow = g.createRadialGradient(fire[0], fire[1], 10, fire[0], fire[1], opt.named ? 330 : 260);
    glow.addColorStop(0, opt.glow || 'rgba(255,180,70,0.45)'); glow.addColorStop(1, 'rgba(255,140,40,0)');
    g.fillStyle = glow; g.fillRect(fire[0] - 360, fire[1] - 360, 720, 720);
    R(57, 17.5, 3, 4.5, '#9a8c78'); R(57, 17.5, 3, 0.5, '#6f6455');                         // chimney
    R(56.5, 19.5, 4, 2.5, C.hearthStone);                                            // chimney breast
    R(55, 22, 2, 3.8, C.hearthDark); R(60, 22, 2, 3.8, C.hearthDark);                // alcoves
    for (let i = 0; i < 6; i++) { R(55.2 + (i % 2) * 0.9, 23 + Math.floor(i / 2) * 0.8, 0.8, 0.6, '#7a5634'); R(60.2 + (i % 2) * 0.9, 23 + Math.floor(i / 2) * 0.8, 0.8, 0.6, '#7a5634'); }
    R(57, 22, 3, 3.8, C.hearthStone); R(57.3, 23, 2.4, 2.6, '#2a2018');                // firebox
    const k = opt.flare || 1;
    R(57.5, 24.2, 2, 1.3, fireRamp[1]); R(57.7, 23.6 - 0.4 * k, 1.6, 1.6 + 0.4 * k, fireRamp[2]); R(58.1, 23.9 - 0.4 * k, 0.8, 1.1 + 0.4 * k, fireRamp[3]); R(58.3, 24.4, 0.4, 0.6, fireRamp[4]);
    R(55, 25.6, 7, 0.4, '#6f6455');                                                  // hearth step
    g.fillStyle = C.ink; g.font = 'bold 12px Georgia, serif'; g.textAlign = 'center'; g.fillText('THE GREAT HEARTH', (58.5 - x0) * T, (20.9 - y0) * T); g.font = '9px Georgia, serif'; g.fillText('PLACEHOLDER (art in progress: 7 × 8 tiles)', (58.5 - x0) * T, (21.35 - y0) * T);
    if (opt.motes) for (let i = 0; i < 18; i++) { g.fillStyle = fireRamp[3]; g.fillRect(fire[0] - 60 + ((i * 37) % 120), fire[1] - 40 - ((i * 53) % 150), 2, 2); }
  } });
  const place = (id, tx, ty, row = 0) => {
    const s = meta[id]; if (!s || !s.img) return null;
    const [fw, fh] = s.fp || [1, 1], [ax, ay] = s.anchor;
    const fwPx = s.frame ? s.frame[0] : (s.cls === 'character' ? 64 : s.w), fhPx = s.frame ? s.frame[1] : (s.cls === 'character' ? 64 : s.h);
    const dx = (tx - x0) * T + Math.floor(fw * T / 2) - ax, dy = (ty - y0) * T + fh * T - 1 - ay;
    draws.push({ foot: dy + ay, f: () => {
      if (s.cls !== 'decal') { g.fillStyle = 'rgba(0,0,0,0.28)'; g.beginPath(); g.ellipse(dx + ax + 2, dy + ay + 1, 11, 4, 0, 0, 7); g.fill(); }
      g.drawImage(s.img, 0, row * fhPx, fwPx, fhPx, dx, dy, fwPx, fhPx);
    } });
    return [dx + ax, dy];
  };
  for (const [id, x, y] of OBJECTS) place(id, x, y);
  const plates = [];
  for (const [id, x, y, dir, name, own] of (opt.heroes || HEROES)) { const head = place(id, x, y, DIR[dir]); if (head) plates.push([head[0], head[1] + 8, name, own]); }
  draws.sort((a, b) => a.foot - b.foot).forEach((d) => d.f());
  if (opt.stands !== false) for (const [x, y] of STANDS) { g.strokeStyle = 'rgba(240,210,122,0.55)'; g.lineWidth = 1; g.beginPath(); g.ellipse((x - x0 + 0.5) * T, (y - y0 + 0.82) * T, 9, 3.5, 0, 0, 7); g.stroke(); }
  return { cv, plates, x0, y0, fire };
}
function present(g, sc, vx, vy, vw, vh, cx, cy, labels) {   // draw the scene at x2 into a viewport, centred on tile (cx, cy)
  const k = 2, ox = Math.round(vx + vw / 2 - (cx - sc.x0 + 0.5) * T * k), oy = Math.round(vy + vh / 2 - (cy - sc.y0 + 0.5) * T * k);
  g.save(); g.beginPath(); g.rect(vx, vy, vw, vh); g.clip();
  g.imageSmoothingEnabled = false; g.drawImage(sc.cv, ox, oy, sc.cv.width * k, sc.cv.height * k);
  const laid = [];
  for (const [x, y, name, own] of sc.plates.slice().sort((a, b) => b[1] - a[1])) {
    const px = ox + x * k; let py = oy + y * k - 2; g.font = '12px Georgia, serif'; const w = g.measureText(name).width + 12;
    while (laid.some((r) => Math.abs(r[0] - px) < (r[2] + w) / 2 && Math.abs(r[1] - py) < 19)) py -= 19;   // plates never overlap: step up a line
    laid.push([px, py, w]); label(g, name, px, py, 12, own ? C.goldHi : C.ink);
  }
  for (const [t, x, y] of labels || []) label(g, t, ox + (x - sc.x0) * T * k, oy + (y - sc.y0) * T * k, 13);
  g.restore();
  return { ox, oy, k, at: (x, y) => [ox + (x - sc.x0) * T * k, oy + (y - sc.y0) * T * k] };
}
