      # THE CORE MODEL (docs/design/CORE_MODEL.md, 2026-10-19): the Level curve, the
      # combat skills' uncapped curve, max HP / mana, Inner Flame's regen and monster levels
      # agree in JS and SQL on every boundary (core-curves, PGlite replay); the Level
