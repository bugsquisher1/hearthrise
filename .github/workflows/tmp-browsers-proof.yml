# TEMPORARY: one proof of tests/ship-browsers.mjs on GitHub without a matrix run. Only ever on this branch; removed before lane/b-ship-build hands back.
name: tmp-browsers-proof

on:
  push:
    branches: ['lane/b-ship-build-proof']

permissions:
  contents: read
  actions: read

jobs:
  built-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright + Firefox and WebKit
        uses: ./.github/actions/playwright-chromium
        with:
          browsers: firefox webkit
      - name: The site in Firefox and WebKit
        if: ${{ !cancelled() }}
        run: node tests/ship-browsers.mjs
      - name: The planted defects, Firefox
        if: ${{ !cancelled() }}
        run: node tests/ship-browsers.mjs --mutate --browsers firefox
      - name: The planted defects, WebKit
        if: ${{ !cancelled() }}
        run: node tests/ship-browsers.mjs --mutate --browsers webkit
