      # locally: plain 9 s, --mutate 2 min 47 s (91 mutants); the job ran 4.0
      # min on GitHub before this (step 1.3 min) against its 21.
      - name: Hunt sessions settle — TICK-1/TICK-2, both paths, tally = ledger, keyed seed
        if: ${{ !cancelled() }}
        run: |
          node tests/hunt-sessions-settle.mjs
          node tests/hunt-sessions-settle.mjs --closed
          node tools/mutant-gate.mjs node tests/hunt-sessions-settle.mjs --mutate
      # WHAT ONE WATCHED SETTLE MAY CALL (lane/c-settle-cost-2, 2026-10-30): tools/settle-cost.mjs's viewed door
      # (four heroes, frames on, live's 4 live asks per 3 settles) on the replay, CALL COUNTS, never ms: hr_state_of
      # <= 5.33 a settle (SB-1), the weapon lookup read once (SB-2), no stable SQL helper re-planned per call on
      # PostgreSQL 17 (SB-3), and the lane's two files change no envelope, engine input or hunt view byte (SB-4).
      # --mutate: the hunter's hello reads the envelope again (index.ts text and the bench), a per-row weapon
