      # RETIRED 2026-10-19 (core rebuild): tests/recovery-rest.mjs, hr_rest, recovering_until and the knockout ladder are deleted (a death ends the hunt); the death ledger and its price are guarded by tests/hunt-sessions-settle.mjs DEATH / DEATHXP / END.

      # THE HEARTHFIND (Feature Slate 2) -- the super-rare drop moment.
      # THE CATALOGUE IS GENERATED, NEVER HAND-TYPED. hr_hearthfind_items /
      # hr_hearthfind_sources are machine-written from src/data/hearthfind.js +
      # src/data/items.js; a hand edit to the .sql is reverted by the next
      # generation, and here the copy would be the CLAMP on the rarest odds in the
