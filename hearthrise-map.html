<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearthrise — Progression & Recipe Map</title>
<style>
  :root{
    --bg:#14100c; --panel:#1e1811; --panel2:#271f16; --line:#3a2f22;
    --ink:#f3e9d8; --muted:#a99a82; --gold:#e0b64d; --green:#8fc47a;
    --blue:#7fb0d6; --red:#d68a7f; --purple:#b58fd6; --chip:#2c2419;
    --accent:#e0b64d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:18px 20px 12px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:linear-gradient(#1a140dee,#14100cee);backdrop-filter:blur(6px);z-index:10}
  h1{margin:0;font-size:20px;letter-spacing:.3px}
  h1 span{color:var(--gold)}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .tab{padding:6px 13px;border:1px solid var(--line);border-radius:20px;background:var(--panel);
    color:var(--muted);cursor:pointer;font-size:13px;user-select:none;white-space:nowrap}
  .tab.on{background:var(--gold);color:#1a140d;border-color:var(--gold);font-weight:600}
  .searchwrap{margin-top:10px}
  #search{width:100%;max-width:420px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);font-size:14px}
  main{padding:18px 20px 80px;max-width:1200px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
  .card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:7px}
  .lvl{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;
    padding:1px 8px;margin-left:auto;white-space:nowrap}
  .xp{color:var(--green);font-size:12px}
  .flow{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:13px}
  .item{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border:1px solid var(--line);
    border-radius:7px;padding:3px 7px;cursor:pointer;transition:.12s}
  .item:hover{border-color:var(--gold);background:#332913}
  .item.hl{border-color:var(--gold);background:#40320f;box-shadow:0 0 0 1px var(--gold)}
  .arrow{color:var(--muted)}
  .qty{color:var(--muted);font-size:11px}
  .sec-title{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);
    margin:24px 0 10px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .rowmeta{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
  .prayer .flow .arrow+ .item{opacity:.6}
  .drops{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .drop{font-size:12px;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:2px 6px;cursor:pointer}
  .chance{color:var(--muted);font-size:10px}
  .tier{font-size:11px;color:var(--muted)}
  .gnode{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
  .gnode:last-child{border:0}
  .gnode .nm{flex:1}
  .gicon{font-size:20px}
  .hidden{display:none}
  #detail{position:fixed;right:0;top:0;bottom:0;width:min(400px,90vw);background:var(--panel2);
    border-left:1px solid var(--line);padding:20px;overflow:auto;transform:translateX(100%);
    transition:.22s;z-index:30;box-shadow:-8px 0 30px #0008}
  #detail.open{transform:none}
  #detail h2{margin:0 0 4px;font-size:20px;display:flex;gap:8px;align-items:center}
  #detail .close{position:absolute;top:14px;right:16px;cursor:pointer;color:var(--muted);font-size:22px}
  .dsec{margin-top:16px}
  .dsec h4{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--gold)}
  .dsec .item{margin:3px 4px 3px 0}
  .empty{color:var(--muted);font-size:13px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend b{color:var(--ink)}
  .count{color:var(--muted);font-weight:400;font-size:13px}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🏔️ <span>Hearthrise</span> — Progression & Recipe Map</h1>

</header>
<main id="main"></main>
<div id="detail">

</div>

<script>
const {skills,gathering,recipes,categorized,monsters,items}=DATA;
const itemName=id=>items[id]?items[id].n:id;
const itemIcon=id=>items[id]?(items[id].icon||'📦'):'❓';

// ---- build producer / consumer indices ----
const producedBy={}; // itemId -> [{type,label,detail}]
const consumedBy={}; // itemId -> [{skill,recipe}]
function addProd(id,rec){ if(!id)return; (producedBy[id]=producedBy[id]||[]).push(rec); }
function addCons(id,rec){ if(!id)return; (consumedBy[id]=consumedBy[id]||[]).push(rec); }

// gathering producers
const gmap=[['TREES','Woodcutting','woodcutting'],['ROCKS','Mining','mining'],['FISH_SPOTS','Fishing','fishing']];
gmap.forEach(([k,sk,skid])=>gathering[k].forEach(n=>addProd(n.prod,{type:'gather',skill:sk,skid,label:n.name,req:n.req,xp:n.xp})));
Object.values(gathering.CROPS).forEach(c=>addProd(c.prod,{type:'gather',skill:'Farming',skid:'farming',label:c.name,req:c.req,xp:c.xp}));

// recipe producers + consumers
function recInputs(r){ if(r.inputs)return r.inputs; const o={}; if(r.input)o[r.input]=1; if(r.secondary)Object.assign(o,r.secondary); return o; }
Object.entries(recipes).forEach(([sk,list])=>list.forEach(r=>{
  if(r.output) addProd(r.output,{type:'recipe',skill:sk,recipe:r});
  Object.keys(recInputs(r)).forEach(inp=>addCons(inp,{skill:sk,recipe:r}));
}));
// monster drops
Object.entries(monsters).forEach(([mid,m])=>(m.drops||[]).forEach(d=>addProd(d.id,{type:'drop',monster:m.name,micon:m.icon,tier:m.tier,chance:d.ch})));

// ---- rendering helpers ----
function itemChip(id,qty){
  const q=qty&&qty>1?`<span class="qty">×${qty}</span>`:'';
  return `<span class="item" data-id="${id}" onclick="showItem('${id}')">${itemIcon(id)} ${itemName(id)}${q}</span>`;
}
function recipeCard(r,sk){
  const ins=recInputs(r);
  const inHtml=Object.entries(ins).map(([id,q])=>itemChip(id,q)).join('<span class="arrow">+</span>');
  const outHtml=r.output?itemChip(r.output,r.outputQty):'<span class="qty">—</span>';
  const gated=r.gated?` 🔒`:'';
  return `<div class="card">
    <h3>${r.icon||''} ${r.name}${gated}<span class="lvl">Lv ${r.req||1}</span></h3>
    <div class="flow">${inHtml||'<span class="qty">—</span>'}<span class="arrow">➜</span>${outHtml}</div>
    <div class="rowmeta"><span class="xp">+${r.xp} xp</span><span>${(r.ms/1000).toFixed(1)}s</span>${r.gated?'<span>🔒 recipe-gated</span>':''}</div>
  </div>`;
}

// ---- views ----
const views={};
views.overview=()=>{
  const cats={combat:[],gather:[],artisan:[]};
  Object.entries(skills).forEach(([id,s])=>{ (cats[s.cat]||(cats[s.cat]=[])).push({id,...s}); });
  const label={combat:'⚔️ Combat',gather:'🌿 Gathering',artisan:'🔨 Artisan'};
  return Object.entries(cats).map(([c,arr])=>`
    <div class="sec-title">${label[c]||c} <span class="count">(${arr.length})</span></div>
    <div class="grid">${arr.map(s=>`<div class="card"><h3>${s.icon} ${s.name}</h3>
      <div class="rowmeta">${recipes[s.id]?recipes[s.id].length+' recipes':''}${
        s.id==='woodcutting'?gathering.TREES.length+' trees':
        s.id==='mining'?gathering.ROCKS.length+' rocks':
        s.id==='fishing'?gathering.FISH_SPOTS.length+' spots':
        s.id==='farming'?Object.keys(gathering.CROPS).length+' crops':''
      }</div></div>`).join('')}</div>`).join('');
};

views.gathering=()=>{
  const blocks=[
    ['🪓 Woodcutting',gathering.TREES],['⛏️ Mining',gathering.ROCKS],['🎣 Fishing',gathering.FISH_SPOTS],
  ].map(([t,arr])=>`<div class="sec-title">${t} <span class="count">(${arr.length})</span></div>
    <div class="card">${arr.slice().sort((a,b)=>a.req-b.req).map(n=>`<div class="gnode">
      <span class="gicon">${n.icon}</span><span class="nm">${n.name} ${itemChip(n.prod)}</span>
      <span class="xp">+${n.xp}xp</span><span class="lvl">Lv ${n.req}</span></div>`).join('')}</div>`).join('');
  const crops=Object.values(gathering.CROPS).sort((a,b)=>a.req-b.req).map(c=>`<div class="gnode">
      <span class="gicon">${c.icon}</span><span class="nm">${c.name} ${itemChip(c.prod)} <span class="qty">${c.hours}h grow${c.regrows?' · regrows':''}</span></span>
      <span class="xp">+${c.xp}xp</span><span class="lvl">Lv ${c.req}</span></div>`).join('');
  return blocks+`<div class="sec-title">🌾 Farming <span class="count">(${Object.keys(gathering.CROPS).length})</span></div><div class="card">${crops}</div>`;
};

function artisanView(sk){
  return ()=>{
    const c=categorized[sk];
    if(!c) return recipes[sk].map(r=>recipeCard(r,sk)).join('');
    let html=c.groups.map(g=>`<div class="sec-title">${g.label} <span class="count">(${g.recipes.length})</span></div>
      <div class="grid">${g.recipes.map(r=>recipeCard(r,sk)).join('')}</div>`).join('');
    if(!c.groups.length) html=`<div class="grid">${recipes[sk].map(r=>recipeCard(r,sk)).join('')}</div>`;
    return html;
  };
}
views.cooking=artisanView('cooking');
views.smithing=artisanView('smithing');
views.crafting=artisanView('crafting');
views.prayer=()=>`<div class="grid">${recipes.prayer.map(r=>recipeCard(r,'prayer')).join('')}</div>`;

views.combat=()=>{
  const tiers={};
  Object.entries(monsters).forEach(([id,m])=>(tiers[m.tier]=tiers[m.tier]||[]).push(m));
  return Object.keys(tiers).sort((a,b)=>a-b).map(t=>`<div class="sec-title">Tier ${t} <span class="count">(${tiers[t].length})</span></div>
    <div class="grid">${tiers[t].map(m=>`<div class="card">
      <h3>${m.icon} ${m.name}<span class="lvl">${m.hp} hp</span></h3>
      <div class="rowmeta"><span>${m.family}</span><span>atk ${m.atk}</span><span>def ${m.def}</span><span class="xp">+${m.xp}xp</span><span>${m.gp?m.gp[0]+'-'+m.gp[1]+'g':''}</span></div>
      <div class="drops">${(m.drops||[]).map(d=>`<span class="drop" onclick="showItem('${d.id}')">${itemIcon(d.id)} ${itemName(d.id)} <span class="chance">${Math.round(d.ch*100)}%</span></span>`).join('')}</div>
    </div>`).join('')}</div>`).join('');
};

// ---- detail drawer: trace an item ----
function showItem(id){
  const it=items[id]||{n:id};
  const prod=producedBy[id]||[], cons=consumedBy[id]||[];
  const stat=[];
  if(it.type)stat.push(it.type);
  if(it.slot)stat.push('slot: '+it.slot);
  if(it.tier)stat.push('tier '+it.tier);
  if(it.rarity)stat.push(it.rarity);
  ['atkB','strB','defB','rngB','magB'].forEach(k=>{if(it[k])stat.push(k.replace('B','')+' +'+it[k])});
  if(it.heals)stat.push('heals '+it.heals);
  if(it.v)stat.push(it.v+'g');
  const prodHtml=prod.length?prod.map(p=>{
    if(p.type==='gather')return `<div class="item">🌿 ${p.skill} — ${p.label} <span class="qty">Lv${p.req}</span></div>`;
    if(p.type==='drop')return `<div class="item">${p.micon} ${p.monster} <span class="qty">T${p.tier} · ${Math.round(p.chance*100)}%</span></div>`;
    if(p.type==='recipe')return `<div class="item" onclick="event.stopPropagation();scrollRecipe('${p.recipe.id}','${p.skill}')">${skills[p.skill]?skills[p.skill].icon:'🔨'} ${p.skill}: ${p.recipe.name} <span class="qty">Lv${p.recipe.req}</span></div>`;
    return '';
  }).join(''):'<div class="empty">Base resource / not produced.</div>';
  const consHtml=cons.length?cons.map(c=>`<div class="item" onclick="event.stopPropagation();scrollRecipe('${c.recipe.id}','${c.skill}')">${skills[c.skill]?skills[c.skill].icon:'🔨'} ${c.recipe.name} → ${itemIcon(c.recipe.output)||''} ${itemName(c.recipe.output)||''}</div>`).join(''):'<div class="empty">Not used in any recipe (final good / vendor / heal).</div>';
  document.getElementById('detailBody').innerHTML=`
    <h2>${itemIcon(id)} ${it.n}</h2>
    <div class="empty">${stat.join(' · ')||'material'}</div>
    <div class="dsec"><h4>Made / obtained from</h4>${prodHtml}</div>
    <div class="dsec"><h4>Used to make</h4>${consHtml}</div>`;
  document.getElementById('detail').classList.add('open');
}
function closeDetail(){document.getElementById('detail').classList.remove('open')}
function scrollRecipe(rid,sk){
  setTab(sk);
  setTimeout(()=>{
    const cards=[...document.querySelectorAll('.card h3')];
    // fallback: just close drawer
  },30);
  closeDetail();
}

// ---- tabs ----
const TABS=[
  ['overview','Overview'],['gathering','Gathering'],['cooking','🍳 Cooking'],
  ['smithing','🔩 Smithing'],['crafting','🔨 Crafting'],['prayer','🙏 Prayer'],['combat','⚔️ Combat Drops'],
];
let cur='overview';
function setTab(t){
  cur=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on',el.dataset.t===t));
  document.getElementById('main').innerHTML=views[t]();
  document.getElementById('search').value='';
  window.scrollTo(0,0);
}
document.getElementById('tabs').innerHTML=TABS.map(([t,l])=>`<span class="tab" data-t="${t}" onclick="setTab('${t}')">${l}</span>`).join('');

// ---- search ----
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();
  const cards=document.querySelectorAll('#main .card');
  if(!q){cards.forEach(c=>c.classList.remove('hidden'));return;}
  cards.forEach(c=>c.classList.toggle('hidden',!c.textContent.toLowerCase().includes(q)));
});

// counts in subtitle
const totalRec=Object.values(recipes).reduce((a,b)=>a+b.length,0);
document.getElementById('sub').textContent=
  `${Object.keys(skills).length} skills · ${totalRec} recipes · ${Object.keys(items).length} items · ${Object.keys(monsters).length} monsters · click any item to trace its chain`;

setTab('overview');
</script>
