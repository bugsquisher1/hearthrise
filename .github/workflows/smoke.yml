# ============================================================
# CI gate for Hearthrise (b215)
#
# The 168-test smoke suite lived only behind Ctrl+Shift+T in a browser, so it
# could never block a bad push — by the repo's own workflow note it usually ran
# *after* a bug was already live on Pages. This runs the same suite headlessly
# on every push and PR, plus the cache-buster invariant that keeps a deploy from
# shipping half-stale modules.
#
# Deliberately no build step: the game is a static folder, so CI serves the repo
# exactly as GitHub Pages does.
# ============================================================
name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The cache-buster must agree across build-info.js, index.html and every
      # ESM import specifier. Cheap, so run it before spending time on a browser.
      - name: Cache-buster invariant
        run: bash bump-version.sh --check

      - name: Install Playwright + Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke suite (headless)
        run: node tests/run-smoke.mjs

      # THE CONSERVATION FUZZ. Randomised, seeded operations across several
      # characters against the REAL server-authority migrations, running on an
      # in-process PostgreSQL — no database credentials, no branch, nothing to
      # clean up. --selftest runs the clean pass AND plants ten known
      # conservation violations, demanding that every one of them is caught: a
      # fuzz that cannot fail on a planted bug is decoration, and this repo has
      # shipped six always-null probes. Bounded op count here (~25s); soak with
      # `npm run test:conservation:soak`.
      - name: Conservation fuzz + injection selftest
        run: node tests/conservation-fuzz.mjs --selftest --ops=400

      # THE POSTGREST RPC RESOLUTION GATE.
      # The A9 retrofit (2026-08-11) rewrapped 35 live RPCs; every wrapper had to
      # keep the original PARAMETER NAMES, because that is what PostgREST resolves
      # on. Get one wrong and the migration reports success while the RPC starts
      # answering PGRST202 to real players. That was checked by hand exactly once.
      # This checks it on every push, against a committed baseline, with a control
      # that must NOT resolve so the probe cannot silently go blind.
      #
      # Read-only against production and needs no secret: 38 of the 41 calls are
      # refused by Postgres before the body runs, 2 read the public leaderboard,
      # and the anon key is public by design and already committed in
      # src/net/supabase-bootstrap.js. `continue-on-error` is DELIBERATELY ABSENT —
      # an RPC the client can no longer see is a player-facing outage.
      - name: RPC resolution vs baseline
        run: node tests/rpc-resolution.mjs

      # A failing run is far easier to diagnose with the page state attached.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            tests/**/*.png
            tests/**/*.log
          if-no-files-found: ignore
          retention-days: 7
