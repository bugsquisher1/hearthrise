  # ── db-replay ── DOES THE REPO STILL REBUILD THE DATABASE, AND DOES IT MATCH
  # WHAT PRODUCTION RUNS? The rebuild/drift/ledger/apply-execution half of the
  # family: schema drift, ledger rollup, catalogue literal drift, live-hash
  # drift, apply-order honesty, retreat apply and read-only client RPCs
  # (rejections journal, buff queue and client-state retired fields moved to
  # db-replay-4 2026-09-28, note [5] above `jobs:`). They share one PGlite chain snapshot (tests/pglite-template.mjs),
  # which is why the cache's own verification step is the FIRST thing in this
  # job: if the snapshot mechanism is not sound, nothing measured after it in
  # this job means anything.
  #
  # SPLIT FROM db-replay-2 2026-09-20 (see the note above `jobs:` for the full
  # measurement). This half MEASURED 465 s (7.75 min) on the GitHub run for
  # 7b509de8 (branch next). Budget = measured x2 = 15.5 min, rounded up to 16.
  # RE-MEASURED 2026-09-28 after the db-replay-4 split: 348 s (5.8 min) of
  # steps on job 108958707424; the 16-min timeout is unchanged.
  db-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 16

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # node_modules, NO browser. `playwright install --with-deps` is ~2 minutes
      # and buys nothing for a guard that never opens a page, so it stays in the
      # in-page job. The install itself runs in every family: a job that fails on
      # a dependency it did not know it had is a red build with no failing
      # assertion in it, and that is the class this whole slice is about.
      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # THE SNAPSHOT CACHE'S OWN PROOF. Every guard below (and every guard in
      # economy-selftests) boots its PostgreSQL from a data-directory snapshot
      # of the applied migration prefix instead of replaying it. A STALE
      # snapshot would make every ✓ in this workflow a statement about a
      # database the repo does not build — the always-null-probe family, with a
      # speedup as its motive. This replays the chain three ways (build,
      # restore, and again with the cache switched off), requires all three
      # fingerprints to be equal, and then plants two corruptions and requires
      # each to be REFUSED. It runs FIRST because nothing measured after it is
      # worth reading if it is red.
      #
      # ONE PROOF FOR THE WHOLE MATRIX (guard diet, 2026-10-10). Seven more copies
      # of this step (`--for=db-replay-2..8`) ran first in the other chain
      # families, ~70 s each. `--for` was never read: same program, same chain,
      # same arms, so each copy proved the identical statement again. The
      # per-runner half they seemed to cover is not theirs — every restore on
      # every runner re-fingerprints the snapshot and refuses a mismatch
      # (pglite-template.mjs property 2), and a family's first guard builds its
      # own snapshot cold exactly as the copy did.
      - name: PGlite snapshot cache - restored == replayed, corruption refused
        if: ${{ !cancelled() }}
        run: node tests/pglite-template.mjs --verify --for=db-replay

      # CAN THE REPO REBUILD THE DATABASE? After cutover the database is the ONLY
      # copy of every player's progression, and disaster recovery rests entirely
      # on "we can rebuild the schema from the repo". On 2026-08-14 that was
      # FALSE — 15 objects existed in production and in no file, and applying the
      # migrations in filename order got 23 of 41 files in — and there was no
      # test that could have said so. This replays supabase/schema.sql + every
      # migration onto a real in-process PostgreSQL in the order declared by
      # tests/schema-apply-order.json, then fingerprints the result against a
      # committed baseline. It ALSO fails if a new migration is not placed in
      # that order, so a file cannot be silently omitted from a rebuild.
      # No credentials; production untouched.
      #
      # --mutate plants seven real defects in the real migration text (a gutted
      # reconstruction, a vanished policy, a renamed column, RLS switched off on
      # a watched table AND on an unwatched one, a silent type change, and the
      # A11 lockdown GUC removed) and demands every one is caught. This repo has
      # shipped a guard that asserted nothing twelve times; this one does not get
      # to claim it works.
      #
      # --live-selftest proves the PRODUCTION half can fail. That half cannot run
      # here (it needs a live database, and no credentials belong in CI), but the
      # classifier behind it can: it plants a prod-only table, a repo-only table,
      # a changed table, a changed category with no per-table breakdown, and a
      # partial paste, and requires each to be reported. From 2026-08-14 to
      # 2026-08-30 the production delta was unfalsifiable prose that had been
      # measured exactly once; this is what stops it going back to that.
      - name: Schema drift — the repo must rebuild the database
        if: ${{ !cancelled() }}
        run: |
          node tests/schema-drift.mjs
          node tools/mutant-gate.mjs node tests/schema-drift.mjs --mutate
          node tests/schema-drift.mjs --live-selftest

      # MOVED TO db-replay-2 2026-10-24: Settle before mutate, Ledger rollup, Catalogue
      # literal drift, Live-hash drift, Apply-order honesty and Client RPCs read-only.
      # release/v0.2.38 (run 40043808165) CANCELLED this job at its 16-min limit in the
      # read-only step: verify 166 + schema drift 496 + those six ~290 = ~950 s, 16 min
      # with setup. What stays: verify + schema drift = 662 s, ~11.3 min (71% of 16);
      # db-replay-2 (4.4-6.6 min of 19 on 40034325773..40043808165) takes ~290 s:
      # ~11.4 min worst (60%). Each step there builds the snapshot or restores it.

      # UTC MIDNIGHT REPLAY MOVED TO ITS OWN JOB 2026-09-19 (b550). Measured on
      # the GitHub run for ab7572e7 (branch next): this step alone cost 411 s,
      # and the family's steps up to and including it (752 s) plus buff-queue
      # already running blew past this job's `timeout-minutes: 14` — CANCELLED
      # with no failing assertion, and eleven more steps never ran. See the
      # `utc-midnight-replay` job below for the guard and its full comment.

  # ── db-replay-4 ── SPLIT OUT OF db-replay 2026-09-28 (CI-SPLIT-4, see note
  # [5] above `jobs:`). Runs 36435388338 (next@d996c262) and 36435597419
  # (next@ef3cb6d1) were CANCELLED at db-replay's own 16-min timeout (964 s,
  # 989 s) with every step uniformly ~35% slower than the green run
  # 36431546863 (722 s): runner variance on a job with no headroom, not one
  # guard regressing. This half takes the three heaviest chain-driving guards
  # — Rejections journal, Buff queue, Client-state retired fields — byte for
  # byte; none of them imports the capstone chain that poisons pglite
  # re-instantiation, so none has to stay behind a predecessor in db-replay.
  # PGlite snapshot cache verification runs again, FIRST, as its own
  # independent step (CI-SHAPE-4 — no guard command may run in two jobs,
  # and that includes the cache verify).
  #
  # MEASURED from job 108958707424's own step times: verify 44 s + Rejections
  # journal 113 s + Buff queue 178 s + Client-state 67 s = 402 s, plus ~11 s
  # of checkout/setup-node/install = 413 s (6.9 min) — ~9.3 min on the slow
  # runners that cancelled db-replay. Timeout left at db-replay's 16: the split buys
  # headroom, not a bigger ceiling.
  # RE-MEASURED 2026-10-20: CANCELLED at 16 min on runs 39364441644, 39364997244,
  # 39369962537 and 39374685521 (16.3-16.5 min, every finished step green);
  # green runs measured 11.5 and 12.7 min. The slow runner's step times
  # (39364997244): Rejections 182 + Buff queue 480 + Client-state 57 + Bounty
  # fee 83 + Login reward 38 + Hunts 74 + Hunt sessions (~121) + Name moderation
  # (~54) = ~1,089 s. Buff queue (its 24-arm --selftest) moved whole to
  # db-replay-3, which had the room (3.7-6.2 min). What stays: fast 386 s
  # (39364497698), slow ~609 s, ~7 / ~10.8 min with setup. Budget = fast x2 =
  # 14, left at 16 so the slow runner keeps x1.5.
  db-replay-4:
    runs-on: ubuntu-latest
    timeout-minutes: 16

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # DOES A REFUSAL LEAVE A TRACE, WITH ITS VERB, AND CHANGE NOTHING?
      # 2026-09-11: Paione needed 4-8 taps to equip a staff and stop-combat
      # snapped back into the fight — version_conflict refusals during a fight.
      # His hr_rejections row for the day read `version_conflict | accrue | n=10`
      # and the equips were IN that 10, unreadable: the aggregate key is (user,
      # slot, day, code) and `intent` was last-writer-wins. Worse, most refusals
      # never reached the journal at all — hr_farm_plant had 12 refusal sites and
      # 0 recorder calls, and farming sat at zero for ten days with nobody able
      # to see it.
      #
      # 2026-09-12-hr-rejections-journal.sql fixes both by PATCHING 56 bodies it
      # does not own, so CHAIN END is the only place the property can be
      # asserted: a later migration restating any of them from a template
      # silently deletes the seam (the b484-b487 wave). This replays the WHOLE
      # chain and drives a real player through the REAL rate-gated RPCs.
      #
      # The load-bearing assertion is not "a row appears". It is that the
      # envelope the PLAYER receives is byte-identical across the decorator, that
      # an ACCEPTED call writes nothing, and that the journal cannot become
      # game_events: one row per (user, slot, day, code) however many verbs, at
      # most 25 keys in the map however many a caller invents, at most one
      # occurrence per transaction, and — the four the security review found in
      # the first revision — rate_limited never journalled here (a 200-call
      # storm costs 63 writes, MEASURED with pg_stat_get_xact_*, not 203), a
      # client-chosen slot folded to -1 instead of multiplying rows in the
      # primary key, a caller-shaped code folded to malformed_code, and a
      # wrapper that does not return jsonb SKIPPED rather than decorated —
      # claim_beta_invite returns json, and json -> jsonb is an ASSIGNMENT cast,
      # so decorating it installs clean, passes every text sweep and kills the
      # signup door at first execution. That one is why P6c CALLS it.
      #
      # 2026-09-13-rejections-verb-map-2.sql adds the second half, and this step
      # grades both files in one replay: it RESTATES hr_record_rejection (chain
      # depth 1 -> 0), so P15 requires every one of the 29 catalogued Security
      # rulings in c_incident / c_escalating to survive the restatement - the
      # named reason the first file refused to restate that body. P14 and P19
      # prove bad_zone and buff_not_paid escalate on the COUNTER (each normal at
      # 49, incident at 50, with a code on neither list still normal at 60;
      # buff_not_paid is ESCALATING and not c_incident because it is a release
      # code on an unwritten emitter, so the incident profile would make a
      # first-version missing-debit bug an alarm on every honest eat), P16 proves the new whys
      # breakdown splits buff_at_max's segment-budget fuse from its duration cap
      # in ONE row whose values sum to n and cap at 12 + (other), P17 proves the
      # code-to-verb fallback names the gesture under hr_apply's unattributable
      # 'apply' label and NEVER overrides a real one, and P18 bounds the why
      # token. Note for the next person restating anything: cap_loosened went
      # MISSED the first time this landed because the cap literal moved files
      # with the restatement - re-run --selftest after any restatement.
      #
      # --selftest plants twenty defects and requires each to be caught here.
      #
      # No credentials; production untouched. Base AND selftest, per C4.
      - name: Rejections journal — a refusal is recorded, and nothing else moves
        if: ${{ !cancelled() }}
        run: |
          node tests/rejections-journal.mjs
          node tools/mutant-gate.mjs node tests/rejections-journal.mjs --selftest

      # A RETIRED KEY IS NOT AN AUTHORITY KEY.
      # hr_put_client_state__ungated refused the WHOLE residue patch on any denied
      # name. Right for `gold`; wrong for `buffs`, which was legitimate residue
      # until 2026-09-13 20:47 UTC. One real player's hidden pre-b544 tab has sent
      # it ever since — 603 refusals by 2026-09-14, 927-955/day by 2026-09-22,
      # ~99% of every refusal vitals reports — and that account has saved no
      # lootFilter, achievements or bestiary for nine days while the noise hid any
      # real burst underneath it.
      # 2026-09-23-client-state-retired-fields.sql restates the body and splits the
      # list: AUTHORITY names still refuse the whole patch, RETIRED names are
      # stripped, journalled as `retired_field` (severity normal, one `why` per
      # name so the breakdown says WHICH BUILD the tab is running) and the honest
      # remainder saves.
      #
      # This replays the REAL ordered chain and drives the REAL GATED WRAPPER the
      # browser calls, so hr_rpc_gate and the hr_note_rejection decorator are
      # exercised rather than modelled. The two assertions that carry it: the
      # forged buff queue is stripped while lootFilter IS stored (the outage, and
      # the 2026-09-13 security property, in one arm), and {gold:999} is still
      # refused forbidden_field/gold with nothing stored and NOT filed as retired.
      #
      # --without replays the chain STOPPING at the migration before this one —
      # the database production runs today — and REQUIRES the guard to be RED, so
      # it cannot go green against a chain that does not contain its own file.
      # --selftest plants nine defects, each gate and gate-blind, plus --without
      # and a comment-only negative control. No credentials; production untouched.
      - name: Client-state retired fields — a retired key strips, an authority key refuses
        if: ${{ !cancelled() }}
        run: |
          node tests/client-state-retired-fields.mjs
          node tools/mutant-gate.mjs node tests/client-state-retired-fields.mjs --selftest

      # 2026-10-04-bounty-abandon-server-fee.sql (Security P2): the abandon fee is
      # priced from the server's active_bounty + Bounty-Hunter level, never a client
      # number. Replays the chain up to the K4 retirement (bounty-gems-close drops
      # these RPCs at chain end) and drives the gated wrapper as
      # `authenticated`: the file re-applies byte-identically, the retired
      # (level, reward) call does not resolve, a level-15 abandon pays 10 and ends
      # the contract, a second abandon is refused, level 9 pays 0, and the ungated
      # body reaches no client. --mutate plants four defects (§5 switched off so
      # they reach these arms) and requires each CAUGHT by its named arm.
      - name: Bounty abandon fee — server-priced, contract ends, second apply identical
        if: ${{ !cancelled() }}
        run: |
          node tests/bounty-abandon-fee.mjs
          node tools/mutant-gate.mjs node tests/bounty-abandon-fee.mjs --mutate

      # 2026-10-23-demolition-bounty-gems-close.sql (BETA_PLAN K4 + K37): at chain
      # end the bounty RPCs do not resolve for a player, and the ONE gem credit
      # refuses gems_retired (a 1-gem start kit is refused end to end, 0 gems land).
      # The file re-applies byte-identically. --mutate plants four defects (a paying
      # credit, a surviving claim, a kept baseline row, a client grant) and requires
      # each refused at install by the file's §4.
      - name: Bounty RPCs gone, gem credit refuses (K4/K37), second apply identical
        if: ${{ !cancelled() }}
        run: |
          node tests/bounty-gems-close.mjs
          node tools/mutant-gate.mjs node tests/bounty-gems-close.mjs --mutate

      # RETIRED 2026-10-22 (old-client reward cut, Tyler): tests/login-reward-off.mjs bound src/data/rewards.js (the old login cycle, deleted); hr_login_claim_verify still refuses, asserted by 2026-12-02-old-rewards-cut.sql §4(b). tests/old-rewards-gone.mjs keeps it cut.

      # Lane C1 (2026-10-20-hunts-*.sql): hunts as named areas. The hunt catalogue
      # is GENERATED from src/data/hunts.js (unknown monster ids refused); the ONE
      # engine rolls the next foe from the hunt's weights on its seeded rng; the
      # attended loop and the away span agree on a mixed hunt (AWAY-1); the server
      # files per-monster bestiary ops; training prices as before; the chain
      # replays and re-applies byte-identically with the §4 band gate executed.
      - name: Hunts as named areas — generated catalogue, one engine, band gate
        if: ${{ !cancelled() }}
        run: |
          node tools/gen-hunts.mjs --check
          node tools/mutant-gate.mjs node tools/gen-hunts.mjs --selftest
          node tests/hunts-c1.mjs
          node tools/mutant-gate.mjs node tests/hunts-c1.mjs --mutate

      # Lane C1 hunt sessions (2026-10-21-hunt-sessions*.sql, ruling HR-2026-10-14):
      # the catalogue is GENERATED from src/data (supplies, rule subjects, limits,
      # travel, vendor value); on the real chain the bag conserves across pack /
      # settle / restock / change / leave, one session is open, forged qty / time /
      # windows are refused, a press only re-orders, tally = Σ ledger, and a second
      # apply is byte-identical. --mutate plants eleven body defects (each red on
      # its arm) and two text defects the file's own §8 must refuse.
      - name: Hunt sessions DB — bag, one open session, settle applier, tally = ledger
        if: ${{ !cancelled() }}
        run: |
          node tools/gen-hunt-sessions.mjs --check
          node tools/mutant-gate.mjs node tools/gen-hunt-sessions.mjs --selftest
          node tests/settle-drop-bounds.mjs
          node tools/mutant-gate.mjs node tests/settle-drop-bounds.mjs --mutate
          node tests/hunt-sessions-db.mjs
          node tools/mutant-gate.mjs node tests/hunt-sessions-db.mjs --mutate


      # 2026-10-11-name-moderation.sql (Security): a name other players see is
      # the server's to refuse and to take back. On the WHOLE chain, as the
      # client roles: blocked variants refused name_blocked (never echoed), the
      # Scunthorpe set passes, no direct clan insert, the moderator RPC and the
      # blocklist unreachable, a moderator rename reaches the board, the ledger,
      # the stamped copies and the envelope. --mutate plants five defects, each
      # CAUGHT by a named §13 gate.
      - name: Name moderation — server content filter, moderator rename
        if: ${{ !cancelled() }}
        run: |
          node tests/name-moderation.mjs
          node tools/mutant-gate.mjs node tests/name-moderation.mjs --mutate

      # 2026-11-19-chat-stream-safe.sql (the 10-22 playtest: a new hero's first
      # Global showed old dev chat with profanity; Tyler streams). As the client
      # roles: no line before the server's epoch/horizon is read (history RPCs,
      # direct selects), a listed word is masked on write and on read with item
      # links kept, the window is not client-movable. --mutate plants eight defects.
      - name: Chat stream-safe — history epoch, word mask on write and read
        if: ${{ !cancelled() }}
        run: |
          node tests/chat-stream-safe.mjs
          node tools/mutant-gate.mjs node tests/chat-stream-safe.mjs --mutate

      # 2026-11-02-hero-creation.sql (Tyler 2026-10-20): a hero is created with a
      # name and four colours in ONE intent, owns all six starter weapon sets
      # (none sells), and an unnamed character does not enter the world. The same
      # guard holds the browser half of 2026-11-02-shop-no-supplies.sql (no Refill,
      # no Restock, no supply offer); its server half is alpha-server A-NO-SUPPLY.
      # --mutate plants four server and seven data/client defects.
      - name: Hero creation — name, colours, the practice kit, no name no world
        if: ${{ !cancelled() }}
        run: |
          node tests/hero-creation.mjs
          node tools/mutant-gate.mjs node tests/hero-creation.mjs --mutate

  # ── db-replay-2 ── THE SECOND HALF OF db-replay, SPLIT OUT 2026-09-20. Same
  # inputs (an applied migration chain), same reason for the split as
  # utc-midnight-replay: the family had outgrown one job's budget with no
  # failing assertion anywhere in it (see the note above `jobs:`). Renown
  # projection through Projected key set — the read-surface and purchase
  # guards that landed after db-replay's 2026-09-07 measurement was last
  # revised. Shares NO snapshot with db-replay: PGlite snapshot cache
  # verification runs again, FIRST, as its own independent step (CI-SHAPE-4 —
  # no guard command may run in two jobs, and that includes the cache verify).
  #
  # MEASURED 552 s (9.2 min): 494 s of this job's own steps on the GitHub run
  # for 7b509de8 (branch next), through World finds projection, plus Gem
  # unlock buy / Recipe learn / Projected key set measured locally after that
  # run's own timeout cancelled them (see the note above `jobs:`), plus this
  # job's own PGlite snapshot cache verify (46 s, not in the original single-
  # job total). Budget = measured x2 = 18.4 min, rounded up to 19.
  # ── db-replay-2 ── THE SECOND HALF OF db-replay, SPLIT OUT 2026-09-20;
  # REBALANCED 2026-09-26 (CI-SPLIT-2) as the job outgrew even that half's
  # budget: GitHub runs 36219670449 and 36221547317 (next) were CANCELLED at
  # this job's own 19-min timeout (19.3 min; three prior green runs measured
  # 18.5/16.2/14.7 min), the second AFTER readonly-rpc had already moved out
  # to db-replay. Per-step timings on the cancelled run (the slower of two
  # runners CI actually drew that day) showed the whole family running
  # 25-30% slower on some runners, not one guard regressing, so every
  # PGlite chain-replay step here only grows as the migration chain grows.
  #
  # Split at the family boundary, not alphabetically: this half keeps Renown
  # projection, Restore census, Town presence, Gem unlock buy, M8's roster/
  # settle slice and the world-tick token-derivation pair — the other half
  # (db-replay-3, below) takes the rest. PGlite snapshot cache verification
  # runs again, FIRST, as its own independent step (CI-SHAPE-4 — no guard
  # command may run in two jobs, and that includes the cache verify).
  #
  # MEASURED on the cancelled run's own per-step timings (the slow runner):
  # verify 57 s + Renown 113 s + Restore census 92 s + Town presence 136 s +
  # Gem unlock buy 115 s + M8 roster/settle 64 s + token-derivation 62 s =
  # 639 s of guards, plus ~11 s of checkout/setup-node/install = 650 s
  # (10.8 min) — comfortably inside the EXISTING 19-min timeout, which is
  # left unraised: the point of the split is headroom, not a bigger ceiling.
  db-replay-2:
    runs-on: ubuntu-latest
    timeout-minutes: 19

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # DOES THE PLAYER SEE WHAT THE SERVER HAS COUNTED?
      # b535 pointed the renown headline and the rank-up card at a SERVER mirror,
      # but hr_state_of projected no renown — so after a reload the mirror's only
      # continuous source was the `renown_claim:<rank>` once-guard flag, i.e. the
      # threshold of the last rank the player PAID for. Measured live 2026-09-11:
      # the QA account read 400 (the Serf floor) while the server had counted 779
      # toward Squire (900), and the only thing that moves the number is clicking
      # Claim.
      #
      # 2026-09-12-renown-high-projection.sql ratchets player_state.renown_high
      # from hr_renown_of inside hr_apply and projects it top-level on the
      # envelope. Both halves are ANCHORED PROGRAMMATIC SPLICES into hr_state_of
      # and hr_apply, so a later migration restating either body from a stale
      # template silently deletes them and the migration's own §3 gate never runs
      # again — CHAIN END is the only place the property can be asserted.
      #
      # The load-bearing assertion is not "a key appears". It is that the number
      # the envelope projects is the number hr_claim_rank DECIDES on (a headline
      # the authority disagrees with promises a rank and then refuses it), that
      # the REAL shipped reader (src/features/renown.js noteServerRenown) learns
      # it off a plain envelope, that a CLIENT kill credit moves it by exactly
      # zero — a cached score that counted credited kills would make the
      # 2026-09-02 faucet permanent instead of self-correcting — and that it
      # never falls when the live score does. --selftest plants six defects, each
      # twice (with and without the migration's own gate), plus a comment-only
      # negative control.
      #
      # No credentials; production untouched. Base AND selftest, per C4.
      # (Renown projection retired 2026-10-15: src/features/renown.js left with
      #  the demolition, and tests/renown-projection.mjs with it.)

      # AND WHICH ROWS DOES THE REBUILD *NOT* GIVE BACK?
      # schema-drift proves the SCHEMA rebuilds and says, in its own header, that
      # it "says nothing about whether any row survives a restore". This is that
      # half: every base table in `public` must state whether a repo rebuild
      # reproduces its rows or whether only a BACKUP has them.
      #
      # ⚠ It existed since 2026-08-15 and was WIRED INTO NOTHING — not here, not
      #   run-smoke, not package.json. In that fortnight the schema went from 67
      #   to 90 base tables and 23 arrived with no DR class at all, including
      #   player_bank and player_workers, which hold player value, while every
      #   other player_* table was classified restore_only. Nobody could have
      #   known: no build ran it. That is the whole reason this step exists.
      #
      # The census now also fails on a rationale-free classification, on a
      # player-value table quietly downgraded to make a red build green, and on
      # any NEW table carrying a user_id that appears in neither the player-value
      # manifest nor the written exemption list. Adding a player-scoped table
      # without ruling on it is one red line and one line to fix.
      #
      # --mutate plants six defects in the real migration text (a catalogue that
      # rebuilds one row long past its own floor check, a lost retention cron, an
      # unclassified table, an unruled player-scoped table, a restore_only table
      # that starts being seeded) and demands each is caught BY THIS GUARD rather
      # than by a neighbour. --baseline-selftest does the same for the half that
      # lives in the baseline rather than in SQL: nine planted classification
      # defects, each pinned to the specific message that must fire.
      #
      # No credentials; production untouched. The PRODUCTION half is
      # `--live-sql` / `--live-compare` and is deliberately NOT here: it needs a
      # live database, and no database credential belongs in a job that runs npm
      # lifecycle scripts (see `permissions:` above). It is a pre-apply ritual —
      # run it before any migration that touches a data-bearing table, and before
      # any rebuild or restore.
      - name: Restore census — which rows only a backup gives back
        if: ${{ !cancelled() }}
        run: |
          node tests/restore-census.mjs
          node tools/mutant-gate.mjs node tests/restore-census.mjs --mutate
          node tests/restore-census.mjs --baseline-selftest

      # IS PRESENCE A SERVER FACT, AND DOES THE PLAZA LEAK EXACTLY SEVEN KEYS?
      # 2026-09-13-town-presence.sql opens the first cross-player READ surface in
      # the game that is not a leaderboard: a named list of who is in town and what
      # they are doing. Nothing economic moves in it, so the failure modes are a
      # forged presence, a leaked column and an ignored opt-out — and none of those
      # is visible to any other guard in this repo.
      #
      # The migration's §13 gate asserts all of it at APPLY time and does bite
      # (measured 2026-09-12: three arms each fail the apply by name). That is the
      # second layer, and it is exactly the layer a later file restating hr_state_of
      # or hr_rpc_gate can quietly remove — so this replays the whole ordered chain
      # with §13 DISARMED and proves the properties by EXECUTION: the flag closes
      # the surface AND the cron body; a heartbeat stamps now() on the caller's own
      # row, bumps no version and journals NOTHING (at one call per 25 s a journal
      # row is the game_events 1.6M-row mistake at ledger scale); a second beat
      # inside 20 s writes nothing; the signature carries no uuid and no clock and
      # user A never moves user B's stamp; the projection is EXACTLY the 7-key peer
      # / 6-key crier allowlist by jsonb_object_keys with no economy or identity
      # key in it; a quiet character is absent from peers AND from the named crier
      # feed with one ledger row per CHANGE; away/seen_ago_s are read-time so a
      # stale snapshot shows nobody; the level is a BAND; an uncatalogued
      # active_id has no label; an account is one body; town_snapshot is reachable
      # by no client role; and the envelope gained `place` and carries no peers.
      #
      # --selftest plants 12 real defects and requires each to be caught by THIS
      # guard's assertions (0 by a declared refusal — the gate is disarmed on
      # purpose so a green arm cannot be an explosion). Per C4, base AND selftest:
      # a selftest-only registration cannot tell a broken migration from a working
      # guard. No credentials; production untouched.
      #
      # MEASURED 2026-09-12 on the dev machine: 2 s base + 16 s selftest on the
      # shared PGlite snapshot. The 12-minute budget is unmoved.
      - name: Town presence — a forged presence, a leaked key, an ignored opt-out
        if: ${{ !cancelled() }}
        run: |
          node tests/town-presence.mjs
          node tools/mutant-gate.mjs node tests/town-presence.mjs --selftest

      # ONE GEM WALLET PER ACCOUNT (2026-10-19-account-wallet.sql, Game Designer
      # ruling 2026-10-11). Gems and Hearth Tokens moved from player_state (one per
      # hero, so every gem source paid up to 5x per account and a hero-slot buy
      # charged whichever hero was playing) to public.account_wallet, written only
      # by an owner-only choke point (hr_wallet_credit / hr_wallet_debit) that keys
      # every grant ONCE PER ACCOUNT, reads the ACCOUNT's day cap and journals each
      # movement as one kind='wallet' ledger row. The migration's §8 is the arms;
      # this guard runs it on the replay, plus the carry (per-hero balances summed
      # once, journalled), the privilege probe as the real `authenticated` role, a
      # byte-identical re-apply and the edge receipt (gems_paid, not the price).
      # --mutate: eleven defects, each named by its arm. No credentials.
      - name: Account wallet — gems are paid once per account and seen by every hero
        if: ${{ !cancelled() }}
        run: |
          node tests/account-wallet.mjs
          node tools/mutant-gate.mjs node tests/account-wallet.mjs --mutate

      # b564 — THE BULK SALE (`vendor_sell_many`), against the real chain, through
      # the real edge bytes (parseIntent -> runVendorSellMany -> hr_apply as
      # hr_engine). A client `unit`/`price` on a line never reaches the delta; one
      # short line refuses the WHOLE batch (gold, stacks and ledger unchanged); one
      # sweep is ONE shop rate token and ONE ledger row; the cap sits under
      # hr_apply's c_max_item_kinds; same key + same lines replays, same key +
      # different lines is intent_mismatch; the receipt sums to the gold moved.
      # --mutate plants eight defects (client price trusted, per-line applies,
      # unknown line skipped, duplicates, cap dropped, digest dropped, receipt
      # invented, settle-first off) and each must turn it red.
      # No credentials; production untouched. MEASURED 2026-10-06: base ~30 s,
      # --mutate ~20 s on the dev machine (template-warm).
      - name: Bulk vendor sell — one answer, catalogue price, all or nothing
        if: ${{ !cancelled() }}
        run: |
          node tests/vendor-sell-many.mjs
          node tools/mutant-gate.mjs node tests/vendor-sell-many.mjs --mutate

      # THE DERIVED PER-REQUEST TOKEN, EXECUTED RATHER THAN ASSERTED
      # (SEC_WORLD_TICK_TOKEN_2026-09-23.md, security ruling T-5.3). The
      # migration's own §5 self-check CANNOT RUN THE DERIVATION on the
      # credential-free replay: PGlite has no pgcrypto, so d4-d7 skip by name and
      # only the fail-closed path is proven there. Three of that file's arms —
      # d6d (the header carries the key), d7b (the queued header binds the queued
      # body) and d8 (no credential in the fire log) — are therefore VACUOUS on
      # the replay and had never been red anywhere; the lane hand-wrote d8b for
      # exactly that reason but did not know it was true of d6d and d7b too.
      #
      # This guard gives the replay faithful stubs of the three things Supabase
      # has and PGlite does not — pgcrypto (a second implementation of RFC 2104
      # over core sha256(), PINNED against node:crypto AND the migration's own
      # vector, so it cannot agree by being wrong), vault.decrypted_secrets, and
      # pg_net's documented convert_to(body::text,'UTF8') queue insert — and then
      # runs a real fire and sweeps every observable surface for the plaintext:
      # the driver's return value, hr_tick_cron_log, every routine body in
      # `public`, and the PUBLIC-readable queue row itself. X-4 replays that
      # captured row against the real edge verifier: the verbatim pair is
      # accepted (residual R-T1, executed rather than claimed), one byte of body
      # is refused, a stale or future bucket is refused, and the old static
      # bearer is refused outright. --selftest plants five defects in the file
      # under review and all five are refused.
      - name: World tick — the derived token carries no secret and binds its body
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-token-leak.mjs
          node tools/mutant-gate.mjs node tests/world-tick-token-leak.mjs --selftest

      # THE ABSENCE IS PRICED AT THE STATE THAT EXISTED DURING IT (Security F2/F3,
      # 2026-09-28, docs/planning/SEC_ABSENCE_PRICED_AT_RETURN_2026-09-28.md).
      # R5: a client-direct RPC (and a non-stamping hr_apply) on a 7.25 h-stale row
      # is refused settle_first and writes nothing; the same claim pays once the
      # window is settled. R4: in the world-tick harness a mid-absence tool swap
      # prices each window at its own state and the split settle equals the tick
      # fold. S1: both migrations re-apply byte-identically. --selftest plants a
      # 12 h threshold and a tick that skips the version re-seed; both must go RED.
      - name: Settle before mutate — an unpaid window refuses a priced-input write
        if: ${{ !cancelled() }}
        run: |
          node tests/settle-before-mutate.mjs
          node tools/mutant-gate.mjs node tests/settle-before-mutate.mjs --selftest

      # THE 90-DAY LEDGER ROLLUP HAS NEVER FIRED ON PRODUCTION (first real fire ~2026-11-21).
      # This replays the chain, seeds aged ledger rows, runs hr_ledger_prune the way cron
      # does and asserts every currency is conserved to the unit (gold, xp in AND out, qty,
      # gems), the prune is idempotent, no per-day ceiling moves, and takes a census of every
      # function that reads a LIFETIME fact out of a 90-day table. --mutate plants five defects.
      - name: Ledger rollup — a prune conserves every currency and moves no ceiling
        if: ${{ !cancelled() }}
        run: |
          node tests/ledger-rollup.mjs
          node tools/mutant-gate.mjs node tests/ledger-rollup.mjs --mutate

      # ...AND DO THE ROWS THE REBUILD PRODUCES MATCH src/data?
      # schema-drift proves the SCHEMA replays. This is the CONTENT half, and it
      # exists because of Security finding F2 (2026-09-13, Deep Seam review):
      # several migrations hand-restate hr_items / hr_item_slots / hr_activities
      # rows that src/data/*.js already owns and tools/gen-catalogues.mjs already
      # generates. `gen-catalogues --check` compares the GENERATED file to a fresh
      # generation and is blind to those restatements — so a rebalance of
      # ITEMS.verdite_bar.v leaves the generated catalogue correct, --check green,
      # and a LAST-in-chain `on conflict do update` quietly reverting a tradeable
      # item's price on every replay or re-apply.
      #
      # The property asserted is the only one indifferent to which file holds the
      # stale copy: replay the whole chain, then compare the rows the database
      # ENDS UP WITH to the rows src/data produces, field by field.
      #
      # --selftest plants four defects and demands each is caught: a price literal
      # stale in a migration only, ITEMS re-valued in src/data only, a slot pair
      # dropped from a seeding migration, and an activity authored in src/data
      # with no migration behind it.
      # No credentials; production untouched.
      - name: Catalogue literal drift — the chain end must equal src/data
        if: ${{ !cancelled() }}
        run: |
          node tests/catalogue-literal-drift.mjs
          node tools/mutant-gate.mjs node tests/catalogue-literal-drift.mjs --selftest

      # ...AND DOES PRODUCTION CARRY THE BODIES THE REPO BELIEVES IT CARRIES?
      # schema-drift fingerprints SIGNATURES; its own header names function
      # BODIES as blind spot (C). On 2026-08-30 the renown-faucet migration ran
      # on production while the repo went on recording it as staged for a full
      # day, and nothing in this repository could have said so: the platform's
      # migration ledger is frozen (applies go through execute_sql) and the
      # migrations' own md5 pins fire only at APPLY time — they answer "may I
      # install?", never "what is installed right now?".
      #
      # This is the credential-free half. It DERIVES every hash-pinned and
      # programmatically-patched function from supabase/migrations/** — never a
      # hand list, which would be one migration from being wrong, and the
      # function that fell off it is the one nobody is watching — replays the
      # chain, and fails if the repo no longer rebuilds to the body the baseline
      # records. --selftest plants 16 defects (a mutated live hash, a deleted
      # baseline entry, a prod-only OVERLOAD of a hash-pinned function, a STAGED
      # migration found applied, a truncated paste, an unexplained divergence,
      # --write's own REVIEW placeholder left in place, two unreadable patcher
      # idioms) and requires each to be caught by the NAMED assertion written
      # for it, after a false-positive floor check. --mutate plants three in the
      # REAL migration text, including a comment edited into a body after it was
      # applied — invisible to every other guard in this repo.
      #
      # The PRODUCTION half (--live / --live-sql / --live-compare / --codediff)
      # is deliberately NOT here: the repository is public and this job runs npm
      # lifecycle scripts, so no database credential belongs in it. It is an
      # operator ritual — run it before any migration, restore or cutover step.
      - name: Live-hash drift — the repo's belief about deployed bodies
        if: ${{ !cancelled() }}
        run: |
          node tests/live-hash-drift.mjs
          node tools/mutant-gate.mjs node tests/live-hash-drift.mjs --selftest
          node tools/mutant-gate.mjs node tests/live-hash-drift.mjs --mutate

      # ...AND DOES THE DEPLOYMENT RECORD AGREE WITH THAT MEASUREMENT?
      # The step above measures what production runs. tests/schema-apply-order.json
      # is what an OPERATOR reads to decide what still has to be run — and on
      # 2026-09-06 its `_order_notes` said "STAGED, NOT APPLIED" for FOURTEEN
      # migrations that were measurably live, including three whose own notes
      # predicted the post-apply hash the baseline had already measured as the
      # LIVE one. Both records existed; nothing compared them. An operator acting
      # on the file would have re-applied all fourteen believing they were new;
      # every one happened to be anchor-guarded and idempotent, so they would have
      # failed closed — the next one might not.
      #
      # Credential-free by construction: it reads those two JSON files and
      # nothing else, no replay and no database, so it costs milliseconds and can
      # sit next to the guard whose measurements it consumes. A file is called
      # APPLIED only when it is the LAST file in the apply order touching a
      # tracked body that production carries — "last" because a later restatement
      # already contains an earlier file's change, so anything short of that
      # proves nothing and the guard stays silent rather than accusing.
      # --selftest plants both directions (a STAGED note on a live migration, an
      # APPLIED note on a body the baseline measured as absent), a structural
      # drift between the two files, and two NEGATIVE CONTROLS that must stay
      # silent.
      - name: Apply-order honesty — the deployment record vs the measurement
        if: ${{ !cancelled() }}
        run: |
          node tests/apply-order-honesty.mjs
          node tools/mutant-gate.mjs node tests/apply-order-honesty.mjs --selftest

      # (BACK IN db-replay-2 2026-10-24, with the five steps above it: see the note
      # where they left db-replay.) MOVED TO db-replay FROM db-replay-2, 2026-09-26 CI
      # REBALANCE: run 36219670449
      # (next@94767e81) was CANCELLED at db-replay-2's own 19-min timeout
      # (ran 19.3 min) with three prior runs at 18.5/16.2/14.7 min, while this
      # job finished ~9.9 min against its 16-min budget. Same PGlite chain
      # replay this job already pays for; no other job installs anything this
      # step needs. Measured locally: 31.3 s base + 2.4 s --selftest + 34.0 s
      # --mutate = ~68 s, moving load from the tighter job to the one with
      # headroom without raising either budget.
      #
      # A CLIENT RPC DECLARED STABLE/IMMUTABLE RUNS READ ONLY UNDER POSTGREST
      # (2026-09-26, live b553: hr_party_view wrote the rate bucket and every
      # roster read answered 405/25006). Calls the whole class read-only.
      - name: Client RPCs declared read-only really are (PostgREST read-only transaction)
        if: ${{ !cancelled() }}
        run: |
          node tests/readonly-rpc.mjs
          node tools/mutant-gate.mjs node tests/readonly-rpc.mjs --selftest
          node tools/mutant-gate.mjs node tests/readonly-rpc.mjs --mutate

  # ── db-replay-3 ── SPLIT OUT OF db-replay-2 2026-09-26 (CI-SPLIT-2, see the
  # note above db-replay-2 for the two cancelled runs that forced it). Same
  # inputs (an applied migration chain), fresh runner, so the PGlite snapshot
  # cache verification runs again, FIRST, as its own independent step
  # (CI-SHAPE-4 — no guard command may run in two jobs, and `--for=` exists
  # so this one is a distinct command line from db-replay-2's and db-replay's).
  #
  # Everything db-replay-2 did not keep: the bestiary/trophy family, realtime
  # cost, RPC resolution, World finds projection, Recipe learn, Projected key
  # set, the world-tick parity/combat/shadow/hydration/ledger-meta arms, M8
  # membership/split/hunt-intents, the token fail-closed arm and the client-
  # state adversarial arm.
  #
  # MEASURED on the same cancelled run's per-step timings (the slow runner):
  # verify 57 s + 501 s across the guards below = 558 s of guards, plus ~11 s
  # of checkout/setup-node/install = 569 s (9.5 min) — inside the SAME 19-min
  # timeout as db-replay-2, unraised.
  #
  # RE-MEASURED 2026-10-06 (CI-SPLIT-5): the world-tick wave grew this job to
  # 1151 s and run 37470960216 (next@e585a031) was CANCELLED at 19 min, every
  # step green. The world-tick family moved whole to db-replay-5 (see there).
  # What stays, from that run's own step times: verify 64 + trophies/collection
  # 42 + realtime 45 + frame-origin 0 + RPC resolution 20 + World finds 151 +
  # Recipe learn 133 + Projected key set 2 + M8 parties 105 + client-state
  # adversarial 52 = 614 s, + ~11 s setup = 625 s (10.4 min). Budget = measured
  # x2 = 20.8, rounded up to 21.
  # RE-MEASURED 2026-10-20: 3.7-6.2 min on the six runs 39364441644-39377980307.
  # It takes Buff queue from db-replay-4 (287 s fast / 480 s slow): ~8.5 min
  # fast, ~14.2 min slow. Budget = fast x2 = 17, left at 21.
  db-replay-3:
    runs-on: ubuntu-latest
    timeout-minutes: 21

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # THE BESTIARY TROPHY LADDER, BOTH HALVES (docs/design/BESTIARY_LADDER.md).
      # It lives in THIS job and not in client-guards because its second arm
      # rebuilds a real PostgreSQL from the chain, which is what this job already
      # pays for -- the prefix snapshot makes the whole guard 1.6 s and its
      # mutation proof 22 s (measured 2026-09-22 on the dev machine).
      #
      # The PURE arm owns the derived half: the multiplier each stage derives
      # equals the ladder as AUTHORED (compared against the raw table, never
      # against min(table, ceiling) -- pre-clamping there makes a re-priced rung
      # invisible), stage 1 pays no power, the product of the two
      # remembered-kills ladders is clamped once against MAX_MEMORY_DROP_MULT,
      # the damage half is honestly dormant, the key fits player_progress's
      # 64-char CHECK for all 108 monsters, and the ATTENDED and AWAY bindings
      # quote ONE drop rate (AWAY-1) -- including the vacuity check that the
      # trophy actually paid on both, and the fact that a binding which drops the
      # monster id pays the charm and not the trophy.
      #
      # The SQL arm owns the claimed half against the real RPC: an unknown
      # monster and a below-threshold claim refused with the SERVER's own count,
      # exactly one progress row and one ledger row per trophy, already_owned and
      # replayed kept apart, no value moved, the projection scoped to its owner,
      # and the trophy population out of hr_state_of's 1000-row envelope.
      #
      # ⚠ WHY IT EXISTS GIVEN THE MIGRATION'S OWN section 4 SELF-CHECK, which
      #   schema-drift already executes on every replay: a self-check runs inside
      #   the file it checks, so it can only ever prove that file correct AS
      #   WRITTEN. This arm MUTATES the migration -- the threshold check, the
      #   once-guard, the catalogue validation, the grant -- and requires each
      #   defect to be caught. 6 pure mutations + 4 SQL mutations, each pinned to
      #   its NAMED assertion, plus 2 negative controls that must stay silent.
      - name: Bestiary trophies - derived power, claimed row, neither trusts the client
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/bestiary-trophy.mjs --selftest

      # A --selftest-only registration cannot tell a broken guard from a caught
      # defect. Run the plain body too: only it answers "green when nothing is wrong".
      - name: Bestiary trophies - base run
        if: ${{ !cancelled() }}
        run: node tests/bestiary-trophy.mjs

      # ONE NUMBER FOR A KILL (Security F4/F5, re-pointed by the closed rebuild).
      # The Fight screen, the loot preview and the hunt engine's ctx, lifted out
      # of the shipped bytes and executed for a top-trophy/top-charm holder, quote
      # the same drop and damage multipliers and name no ladder lift. --selftest
      # plants 4 defects (each caught by name) and a silent control.
      - name: Trophy call sites - one drop rate, no ladder lift (selftest)
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/trophy-call-sites.mjs --selftest

      - name: Trophy call sites - base run
        if: ${{ !cancelled() }}
        run: node tests/trophy-call-sites.mjs

      # ABSENCE MUST STAY ABSENCE ON THE TROPHY WIRE (Security F3, 2026-09-22).
      # hr-accrue/index.ts reads the claimed trophy rows behind a savepoint that
      # degrades on 42883 -- a database without hr_trophy_of, which is also this
      # feature's own documented rollback. The emit said the key is "OMITTED
      # entirely" on that path and then sent `trophies: []`, which the client
      # mirror reads as "the server holds none for you" rather than "the server
      # did not say" -- a Claim button live on a trophy the server answers
      # already_owned with. Node cannot import a Deno .ts file, so the emit is
      # lifted out of index.ts's BYTES at named anchors and EXECUTED, and the
      # mirror is executed off disk after it: the assertions end at the question
      # a player can see, not at a JSON key.
      - name: Trophy wire - the key is absent when the server did not answer
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/trophy-wire-shape.mjs --selftest

      # A --selftest-only registration cannot tell a broken guard from a caught
      # defect. Run the plain body too: only it answers "green when nothing is wrong".
      - name: Trophy wire - base run
        if: ${{ !cancelled() }}
        run: node tests/trophy-wire-shape.mjs

      # LEDGER OF FIRSTS (2026-09-27): the Collection log earns a rung ONLY from
      # the server's counts. hr-accrue reads count(hr_collection_of) in its own
      # savepoint and emits `collection: { found }` beside every bestiary spread
      # (omitted on 42883, any other error propagates); collection-log.js gates
      # on that and on the hr_bestiary_of mirror, never on G.bestiary /
      # G.collection. The read and projection are lifted out of index.ts's bytes
      # and executed; the consumer runs in a vm. --selftest plants each defect.
      - name: Collection wire - the log earns rungs from server counts only
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/collection-wire-shape.mjs --selftest

      - name: Collection wire - base run
        if: ${{ !cancelled() }}
        run: node tests/collection-wire-shape.mjs

      # RETIRED 2026-10-22 (old-client reward cut, Tyler): tests/collection-renown-claim-drift.mjs bound the milestone and rank catalogues, both cut. tests/old-rewards-gone.mjs keeps it cut.

      # REALTIME COST. Measured on production 2026-09-06 over 20.25 days: the
      # Realtime WAL poller is 2,706,517 calls / 15,669 s / max 9.8 s — ~61% of
      # all exec time and ~36x the #2 statement — for two published tables, one
      # of which no client subscribed to. The guard asserts an EQUALITY, both
      # directions: the publication set == the postgres_changes subscriptions in
      # src/**. Published-but-unsubscribed is pure poller cost; subscribed-but-
      # unpublished is a feature that silently never fires (which is what the
      # market panel shipped for months). Per C4, base AND selftest: a
      # selftest-only registration cannot tell a broken migration from a working
      # guard.
      - name: Realtime cost — publication == client subscriptions, both directions
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/realtime-cost.mjs --selftest

      - name: Realtime cost — base run (the trim migration itself is green)
        if: ${{ !cancelled() }}
        run: node tests/realtime-cost.mjs

      # TICK FRAMES ONLY TO A LIVE WINDOW (2026-10-07-frame-emit-online-only.sql,
      # REL_M5_FLIP F4c). The gate is marked by ONE line in each tick settle;
      # the migration's §9 v1 checks the catalog at apply. This catches a later
      # restatement or a new tick writer that loses the marker, or an emitter
      # that stops asking hr_frame_wanted. No DB, milliseconds. The executed
      # arms run in schema-drift --mutate.
      - name: Frame origin marker — tick writers mark, the emitter asks (base + mutate)
        if: ${{ !cancelled() }}
        run: |
          node tests/frame-origin-marker.mjs
          node tools/mutant-gate.mjs node tests/frame-origin-marker.mjs --mutate

      # THE POSTGREST RPC RESOLUTION GATE.
      # The A9 retrofit (2026-08-11) rewrapped 35 live RPCs; every wrapper had to
      # keep the original PARAMETER NAMES, because that is what PostgREST resolves
      # on. Get one wrong and the migration reports success while the RPC starts
      # answering PGRST202 to real players. That was checked by hand exactly once.
      # This checks it on every push, against a committed baseline, with a control
      # that must NOT resolve so the probe cannot silently go blind.
      #
      # Read-only against production and needs no secret: 38 of the 41 calls are
      # refused by Postgres before the body runs, 2 read the public leaderboard,
      # and the anon key is public by design and already committed in
      # src/net/supabase-bootstrap.js. `continue-on-error` is DELIBERATELY ABSENT —
      # an RPC the client can no longer see is a player-facing outage.
      - name: RPC resolution vs baseline
        if: ${{ !cancelled() }}
        run: node tests/rpc-resolution.mjs

      # The RPC resolution comparator, mutation-proven against a REAL probe of
      # production: an RPC that vanished (PGRST202 — the shipped failure), one
      # opened to anon, a retired signature that resolved again, a changed
      # return shape, an unbaselined RPC, one that stopped being probed, and the
      # control blinded. Probes once and mutates the measurement, so this adds
      # no extra network round trips.
      - name: RPC resolution — mutation proof
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/rpc-resolution.mjs --selftest

      # IS THE FINDER'S NAME MINTED IN ONE PLACE, AND IS `presence_quiet` REAL?
      # 2026-09-08-hearthfind.sql granted SELECT on ALL of world_finds — user_id
      # and slot included — to anon AND authenticated, while profiles and
      # display_names are public-read. Naming every finder in the realm was one
      # join, and the SHIPPED client did it (src/features/hearthfind.js read
      # user_id off the board and resolved it through display_names into global
      # chat). So when 2026-09-13-town-presence.sql added presence_quiet and
      # filtered quiet characters out of the crier, its own header recorded that
      # the filter "buys nothing today". That was the named pre-launch P2.
      #
      # 2026-09-13-world-finds-projection.sql moves the name behind
      # hr_world_finds_of and revokes the identity columns. Its §6 gate asserts
      # all of it at APPLY time and does bite — and is exactly the layer a later
      # file can silently remove (a restated hr_rpc_gate, a `grant select on
      # world_finds` in a convenience sweep, a re-created wrapper without the
      # quiet rule). So this replays the whole ordered chain with §6 DISARMED and
      # proves the properties BY EXECUTION from chain end: the 8-key allowlist by
      # key set with no user_id, no slot and no account uuid in any value; a LOUD
      # finder named (the control) and a QUIET one nameless with the ROW STILL
      # PRESENT, because the board is where "the 3rd ever found" comes from and
      # one player's privacy must not renumber everybody else; `nth` a realm
      # ordinal proven against a find deliberately OUTSIDE the returned window;
      # anon AND authenticated unable to read user_id or slot by
      # has_column_privilege AND by a real SELECT under `set role` that must raise
      # 42501, while every anonymous column still reads and no write privilege
      # exists; the inner owner-only and only `authenticated` on the verb; the rate
      # gate before exactly one hr_note_rejection seam with the 6/min bucket
      # biting and six pre-existing buckets intact; the verb in
      # hr_client_rpc_baseline with grant hygiene quiet; an unauthenticated call
      # refused carrying no rows; a read that journals nothing; and the shipped
      # CLIENT no longer joining display_names.
      #
      # --selftest plants 12 real defects and requires each to turn THIS guard
      # red (12/12 by assertion, 0 by a declared refusal — the gate is disarmed on
      # purpose so a green arm cannot be an explosion). Per C4, base AND selftest:
      # a selftest-only registration cannot tell a broken migration from a working
      # guard. No credentials; production untouched.
      - name: World finds projection — a named quiet finder, a leaked user_id, a window ordinal
        if: ${{ !cancelled() }}
        run: |
          node tests/world-finds-projection.mjs
          node tools/mutant-gate.mjs node tests/world-finds-projection.mjs --selftest

      # AND DOES THE NIGHT KNOW WHICH RECIPES YOU HAVE READ?
      # 2026-08-16-artisan-progress-model.sql built the STORAGE for a learned
      # recipe and left the WRITE to a later author who never arrived: nothing has
      # ever written a `recipe:<scroll>` flag for anybody. Attended, the client
      # flips G.unlockedRecipes (residue) and deletes the scroll locally; away,
      # hr-accrue reads hr_perks_of.unlockedRecipes = {} and src/core/artisan-sim
      # .js stops the span at tick 0 — so all eight gated recipes pay NOTHING for
      # the night while the browser shows them unlocked. CLAUDE.md §6, 2026-09-14.
      #
      # The two assertions that matter are the ones a key-exists check cannot
      # make: that the ENVELOPE, the verb's verdict and hr_perks_of (what the away
      # engine prices from) all carry the SAME set, and that the REAL shipped
      # reader — src/core/artisan.js gateOk, the same pure function the browser
      # and the simulation both call — flips from locked to open off that
      # envelope. Plus: exactly one of two scrolls consumed, an uncatalogued
      # `recipe:` flag row is NOT a capability (the hr_unlocks join is the
      # allowlist), and a re-learn and a replay each eat nothing.
      # --selftest plants twelve defects, each twice, plus a negative control.
      #
      # No credentials; production untouched. Base AND selftest, per C4.
      # MEASURED 2026-09-14 on this machine: base 12 s, --selftest 39 s.
      - name: Recipe learn — a gated recipe is learned on the server or the night ignores it
        if: ${{ !cancelled() }}
        run: |
          node tests/recipe-learn.mjs
          node tools/mutant-gate.mjs node tests/recipe-learn.mjs --selftest

      # THE PROJECTED KEY SET, BY EXECUTION. hr_state_of is created once and then
      # programmatically PATCHED by later migrations, so its shipped body is in no
      # file and a grep is a guess. This replays the chain, calls hr_state_of on a
      # probe character and fails if the real key set is not the one
      # tests/no-client-copy-of-projection.baseline.json pins — i.e. the day a
      # migration adds a projection, this is red until the client half is mapped.
      # The TEXT half of the same guard (residue collisions, missing readers, the
      # raw-read ratchet) runs in client-guards with no database.
      - name: Projected key set — hr_state_of's real keys vs the client's pin
        if: ${{ !cancelled() }}
        run: node tests/no-client-copy-of-projection.mjs --execute

      # M8 SLICE 1 — THE PARTY IS A SERVER OBJECT AND ONLY THE VERBS CHANGE IT
      # (docs/planning/WORLD_TICK_DESIGN.md §18, and Security's threat model in
      # §18-SEC). Two planted users play the whole membership journey on the
      # PGlite chain replay as real auth.uid() values — create, invite, accept,
      # leave, kick — and every refusal code the design names is asserted by
      # exit code. It carries the findings the slice was briefed on: S-7 (the
      # SELECT policies neither recurse nor reach a predicate the caller cannot
      # execute, and hr_party_view is frozen at eight keys and refuses a
      # non-member), S-11 (an accept is refused party_hunt_running the day
      # hr_party_hunt_live starts answering TRUE — the body S2 will ship, proved
      # against the real call site), S-12 (the ten-level spread re-checked on
      # ACCEPT, which §18.1's "at hunt start only" does not cover) and S-13
      # (three causes, one string to the sender, three distinct codes to the
      # journal, plus the receiver clamp at the sixth live card).
      #
      # The migrations' own §4 blocks run ONCE, at apply time. This runs on
      # every push, and it adds three properties a §4 block structurally cannot:
      # that all three files RE-APPLY byte-identically (measured as a full
      # schema inventory before and after a second apply — "additive and
      # idempotent" was a claim in three headers and nothing checked it), that
      # the `party` rate bucket really refuses the 13th call in a minute, and
      # the S-11 refusal under a predicate that actually answers TRUE.
      #
      # --mutate is TWO STAGES. Stage 1 plants distinguishable refusals in
      # hr_party_invite — the pre-S-13 oracle — and requires the MIGRATION to
      # refuse to install. Stage 2 disables file 2's whole §8 self-check as well
      # so the mutant reaches this file's arms, and requires S13a to go red on
      # its own: an arm that only ever fails because the apply gate failed is
      # not a standing guard the day someone edits the verb.
      - name: M8 parties — membership, and the four findings it carries
        if: ${{ !cancelled() }}
        run: |
          node tests/party-membership.mjs
          node tools/mutant-gate.mjs node tests/party-membership.mjs --mutate

      # THE THREE PROPERTIES THE STRIP INTRODUCED THAT ITS OWN GUARD DOES NOT
      # MEASURE. Written by the security-engineer role during the review of
      # 2026-09-23-client-state-retired-fields.sql; it deliberately does NOT
      # repeat tests/client-state-retired-fields.mjs (which already proves a
      # retired key strips, an authority key refuses and a replay is one effect).
      #   X1 SIZE ACCOUNTING — the strip moved the merge from `p_patch` to
      #      `v_patch`. A later restatement that merges the raw patch while still
      #      reporting `stripped` keeps the answer saying the right thing while
      #      the forged value lands AND eats the 256 KiB bag cap. 50 KB of
      #      retired `buffs` must change `bytes` by nothing and the bag by
      #      nothing, and a bag already 200 KB full must still accept a put whose
      #      only over-cap key is retired.
      #   X2 ORDERING IS THE WHOLE FAIL-SAFE — nothing says a name cannot be on
      #      BOTH lists; what makes the authority key win is that the deny loop
      #      runs FIRST and reads the RAW patch. The arm proving it bites hoists
      #      the strip, points the deny loop at the stripped remainder and puts
      #      `gold` on both lists — the shape a restatement "simplifying" the body
      #      into one remainder would take.
      #   X3 THE JOURNAL IS BOUNDED BY A CAP IN ANOTHER FILE — hr_record_rejection
      #      folds `whys` at c_why_cap = 12 (2026-09-13-rejections-verb-map-2.sql)
      #      and v_retired holds TEN, so the breakdown naming WHICH key a stale
      #      tab sends survives on two names of headroom held in a file that has
      #      never heard of v_retired. The list is read out of the INSTALLED body,
      #      so the arm grows with it rather than going stale.
      # Registered in db-replay-2 rather than db-replay on the budget rationale
      # that split the family: this is one replay plus eight mutation boots, and
      # db-replay already took the lane's own guard.
      - name: Client-state retired fields — size accounting, list ordering, journal bound
        if: ${{ !cancelled() }}
        run: |
          node tests/client-state-retired-fields-adversarial.mjs
          node tools/mutant-gate.mjs node tests/client-state-retired-fields-adversarial.mjs --selftest

      # MOVED FROM db-replay-4 2026-10-20 (see the note above that job), byte for byte.
      # CAN A BROWSER GIVE ITSELF A BUFF?
      # 2026-09-13-consumable-buffs.sql moves the buff clock onto the server:
      # player_state.buffs = [{type, magnitude, until}] with an ABSOLUTE expiry, one
      # delta key `buff_apply = {item}` that resolves type/magnitude/duration from
      # the generated hr_item_buffs catalogue under the character lock and stamps
      # `until` from now(), merge-by-type with a 60-minute ceiling, and a top-level
      # projection the accrual engine drains. Its companion takes the forgeable
      # client_state copy away.
      #
      # The migrations' own §4 blocks are strong, but a §4 fires ONCE at apply time;
      # the regression that brings a forgery back is a LATER migration restating
      # hr_apply from a stale template, at which point no §4 runs again. So this
      # replays the REAL ordered chain and CALLS hr_apply as the engine role: a
      # forged until/magnitude/type/duration_ms/remaining_ms/scale is refused BY
      # NAME with the queue unmoved, an unknown or non-buff item is refused, a
      # second helping extends rather than restarts, magnitude is max(old,new) in
      # both directions, the tail clamps onto the ceiling and the next consume is
      # refused buff_at_max WITHOUT debiting the same delta's gold, a replayed
      # intent buffs once, the catalogue equals src/data/items.js row for row, and
      # the accrual engine is byte-identical with no live buff and demonstrably
      # richer with one (the arm that separates "inert" from "not wired").
      #
      # ⚠ IT ALREADY EARNED ITS KEEP: the first draft refused only on
      #   `base >= cap`, which is UNREACHABLE in production because the cap moves
      #   with now(). The migration's §4 passed (a migration applies inside ONE
      #   transaction, where now() is frozen) and THIS guard, which calls hr_apply
      #   the way production does, showed 200 consumes with no refusal at all.
      #
      # --selftest plants 14 defects in the REAL migration text and runs every one
      # GATE-BLIND (both §4 blocks short-circuited), so each tick comes from the
      # guard's own assertions rather than from the migration refusing to install.
      # Base AND selftest, per C4. No credentials; production untouched.
      - name: Buff queue — the server owns the buff clock, by execution
        if: ${{ !cancelled() }}
        run: |
          node tests/buff-queue.mjs
          node tools/mutant-gate.mjs node tests/buff-queue.mjs --selftest

      # A TICK OUTAGE DRAINS (lane/c-tick-span, 2027-02-04-tick-span.sql + hunt-settle.js
      # HUNT_SETTLE_SPAN_MS / HUNT_ENGINE_BUDGET_MS). tests/hunt-tick-shards.mjs OUTAGE, its
      # own step HERE because it replays a 30-min outage of a full body (4 four-hero parties on
      # the real Millrace Sewer) twice through the real cron and the shipped runTick: db-replay-8,
      # which runs the rest of that file, measured 22.1 of its 30 min. It must drain within
      # 2 x ceil(30 min / (span - cadence)) fires with every body's engine CPU under the edge's
      # 2 s, both paths (browser closed; two heroes viewing), no time lost or doubled, tally =
      # ledger, and both paths write the rows the pre-fix 15-min windows write. CATCH-UP: after a
      # 10-min outage a mid-hunt verb is refused only settle_first until the player's own settle
      # catches the hunt up slice by slice within its budget, then it lands (both paths, <= 3
      # rounds). --mutate --outage plants THE BUG (the 15-min span), a one-slice player door, and
      # 2027-02-04-tick-span.sql's four §5 bites. MEASURED 2026-10-28 locally on a busy box:
      # plain ~4.5 min, mutants ~6 min (the §5 replays); this job's fast runs were 8.5 min of 21.
      - name: Hunt tick span — a 30-min outage drains, every body under the edge's CPU
        if: ${{ !cancelled() }}
        run: |
          node tests/hunt-tick-shards.mjs --outage
          node tools/mutant-gate.mjs node tests/hunt-tick-shards.mjs --mutate --outage

  # ── db-replay-5 ── SPLIT OUT OF db-replay-3 2026-10-06 (CI-SPLIT-5). The
  # GitHub run for e585a031 (branch next, run 37470960216) CANCELLED db-replay-3
  # at its own 19-min timeout after 1151 s, every step green; the five runs
  # before it on next measured 1072-1133 s. The 09-26 line (569 s) predates the
  # world-tick wave, so the job was structurally past its budget, not one guard
  # regressing. db-replay, db-replay-2 and db-replay-4 had no room to take the
  # family: on the same run they measured 575/752/616 s against 16/19/16-min
  # timeouts, already past x2. So the WORLD TICK family moved whole into its own
  # job (every arm from "parity with the accrual path" through "the parity
  # read's ledger-meta spellings", plus "a tick that could not derive refuses
  # the apply"), with the PGlite snapshot cache verified FIRST again under its
  # own `--for=` (CI-SHAPE-4).
  #
  # MEASURED from run 37470960216's own step times: verify 64 s + 525 s of
  # world-tick guards + ~11 s checkout/setup/install = 600 s (10.0 min).
  # Budget = measured x2 = 20 min.
  db-replay-5:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Do NOT leave the token in .git/config where every later step —
          # including npm lifecycle scripts — can read it and `git push`.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # ── THE WORLD TICK, REGISTERED 2026-09-21 ──────────────────────────────
      # docs/planning/WORLD_TICK_DESIGN.md §13 asked for this the moment the
      # tick became a writer for any channel "and NOT LATER", and
      # tests/guards-unregistered.json carried the debt with that condition
      # written into it. 2026-09-21-world-tick-settle-fence.sql is that writer:
      # hr_tick_settle takes the player_state row lock, checks the lease,
      # compare-and-sets the settled watermark and then calls hr_apply. It
      # ships DISARMED (hr_tick_config.enabled = false, shadow = true), but a
      # disarmed writer is still a writer the moment somebody runs one UPDATE,
      # and a tripwire nothing runs is not a tripwire.
      #
      # All five arms cost ~9 s together against the restored snapshot, so they
      # sit in this job rather than earning one of their own.
      #
      # PARITY. The same engine, asked by two callers, must answer identically:
      # P-G1 compares N tick windows against one accrual call over the span
      # (exact — gathering has no rare roll, so a correct decomposition is equal
      # digit for digit), and P-G9 compares the SAME 90 s windows settled as
      # `caller:'tick'` against `caller:'accrue'` and demands a byte-identical
      # delta. AWAY-1's rule, on the channel the tick is about to own.
      # --mutate plants four defects (unaligned windows, a dropped fight
      # checkpoint, the cadence passed as capMs, a per-character constant seed
      # — that last one measured +48% gold and three rare drops at rate zero).
      - name: World tick — parity with the accrual path
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-parity.mjs
          node tools/mutant-gate.mjs node tests/world-tick-parity.mjs --mutate

      - name: World tick — one window is paid once, and only when armed
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-double-pay.mjs
          node tools/mutant-gate.mjs node tests/world-tick-double-pay.mjs --mutate

      # THE SECURITY VERDICT, AS AN EXIT CODE. Every arm of
      # SEC_WORLD_TICK_GATHER_2026-09-19.md, executed: the tick reaches the
      # writer only through the fence (S-1), the version CAS prevents a
      # tick/accrue double pay (S-2), a replayed window is refused on the
      # watermark alone (S-3), one gather roster call leases one channel and
      # returns the character once (S-4), and an honest deferral is no longer
      # counted as an overlap (S-5). It was RED BY DESIGN and deliberately
      # unregistered while the review was open; it is green, so it is here.
      - name: World tick — the security verdict, executed
        if: ${{ !cancelled() }}
        run: node tests/world-tick-writer-authz.mjs

      # THE SHADOW RUN MUST SURVIVE ITS OWN DRIVER
      # (SEC_WORLD_TICK_M1_2026-09-21.md finding M-1, P0, which BLOCKED the
      # cron file and SHADOW-on-production). The sibling above and
      # world-tick-double-pay both call hr_tick_settle DIRECTLY with a
      # window_from already chained on the shadow mark, so they prove the FENCE
      # chains and are blind to whether the DRIVER ever delivers the mark. No
      # test read hr_tick_cron_run's payload. That is how the lane was green and
      # wrong: while shadowed the tick pays nothing, accrued_to never moves, and
      # every fire after the first re-proposed the SAME window and was refused
      # window_already_settled — 1 shadow row per character where 1,920 are
      # expected over 48 h, so the parity measurement that GATES arming could
      # not be taken. The dangerous "fix" for that stall is to loosen the
      # watermark CAS, which is the double pay the step above exists to prevent.
      #
      # SC-3 is the built-in control and was green while SC-1/SC-2 were red,
      # which localised the defect to one jsonb_build_object key list. It was
      # RED BY DESIGN and deliberately unregistered while the review was open
      # (tests/guards-unregistered.json); it is green, so it is here.
      - name: World tick — SHADOW chains on its own watermark
        if: ${{ !cancelled() }}
        run: node tests/world-tick-shadow-chain.mjs

      # AND DOES THE ENTRY SPEAK THE TRANSPORT IT DEPLOYS ON?
      # (SEC_WORLD_TICK_M1_2026-09-21.md OP:TICK REVIEW findings T-1 and T-2,
      # both P0.) tests/edge-tick-gate.mjs drives the same entry and was GREEN
      # through both of them, because its `exec` stub answered `select now()`
      # with an ISO STRING while `postgres` — and PGlite — parse OID 1184 into a
      # JS Date. The entry did `String(<Date>)` and handed the result back as a
      # `$::timestamptz`, which Postgres refuses (22P02), so probeWatermark —
      # the FIRST engine statement of every character of every fire — threw, the
      # fire still answered HTTP 200, and the 48 h shadow parity run that GATES
      # arming would have journalled zero rows with every dashboard green.
      #
      # The same class covers the per-window PRNG label: hr_seed hashes the
      # LABEL, and the accrue path spells the instant the way Postgres renders a
      # timestamptz into JSON (`.739123+00:00`, index.ts:785) while the tick and
      # the roster spelled it `.739Z`. Same instant, different stream, so the
      # parity number would have measured the PRNG rather than the tick.
      #
      # So this file uses the transport: a real Postgres, the shipped `runTick`
      # driving its own round trips through it, tick.js's own SEED_LABEL_EXPR
      # and hr_tick_roster itself — no arm quotes the source back at itself.
      # EC-1c, EC-2b, EC-2c and EC-3d are the negatives and they stay: EC-2c in
      # particular pins a property nothing else asserts (the watermark probe is
      # WRITE-CAPABLE and what stops it is hr_tick_settle step (7)'s null-version
      # refusal — Security I-5). It was RED BY DESIGN and deliberately
      # unregistered while the review was open; it is green, so it is here.
      - name: World tick — the entry against the transport it deploys on
        if: ${{ !cancelled() }}
        run: node tests/world-tick-edge-contract.mjs

      # THE ARTISAN CHANNEL (2027-02-10-artisan-tick.sql + hr-accrue tick-artisan.js; report #68).
      # The owner's browser CLOSED: a spent Hearth run is enrolled, leased and settled to idle by
      # the shipped runTick in one fire (one craft row, src tick), another player's town read stops
      # showing it working, the tick pays what the owner's own stop pays, a long run is settled one
      # window a fire and keeps running, a second fire pays nothing. --mutate: 4 edge-copy + 4 SQL.
      - name: World tick — a town bench run is settled by the server, browser closed
        if: ${{ !cancelled() }}
        run: |
          node tests/artisan-tick.mjs
          node tools/mutant-gate.mjs node tests/artisan-tick.mjs --mutate

      # WHAT THE DATABASE STOPS KEEPING (2027-02-11-db-retention.sql): frames past an hour go, chat
      # lines stay, a run is bounded; the file's own §4 against stub Realtime + pg_cron schemas (PGlite
      # has neither, so the chain replay skips those claims). --mutate: 6.
      - name: DB retention — frames, the fire log, the run history
        if: ${{ !cancelled() }}
        run: |
          node tests/db-retention.mjs
          node tools/mutant-gate.mjs node tests/db-retention.mjs --mutate

      # ── AND WHAT DOES THE ENTRY HAND THE ENGINE? (2026-09-22, the gather
      # shadow's first armed measurement.) Every row in hr_tick_shadow for a
      # Mining 61-64 character on mithril_rock came back `would_ticks: 0,
      # would_qty: 0` carrying `activity: {kind:'idle'}` — the LEVEL gate, on a
      # character whose ACCRUE path had just paid +3,375 items for a 12 h
      # absence off the same projection. tick.js hydrated the session from
      # `env.state`, and `hr_state_of` keeps skills / inventory / equipment /
      # enchant / buffs at the ENVELOPE TOP LEVEL.
      #
      # world-tick-parity.mjs could not see it and still cannot: its fixtures
      # are already in post-hydration engine shape, so they prove the LOOP and
      # say nothing about where its fields came from. This guard starts one step
      # earlier — a probe character written into a real PGlite replay,
      # hr_state_of projecting it, and the envelope that comes back handed to
      # BOTH callers. --mutate restores `sessionFromRoster(row, env.state)` in a
      # temp copy of the function directory and requires H1b/H1c/H1d/H2c/H2d/
      # H2e/H4a to go red, so a green run is a measurement and not a belief.
      - name: World tick — the envelope the tick hands the engine
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-hydration.mjs
          node tools/mutant-gate.mjs node tests/world-tick-hydration.mjs --mutate

      # THE SHADOW STALL AFTER A RE-POINT (2026-09-28). Production ran 21.9 h
      # (combat) and 14.7 h (gather) of `window_already_settled` on every fire
      # after a set_activity: the switch stamps the mark from a MICROSECOND
      # now(), the drivers bind a MILLISECOND window start, and the fence's CAS
      # refuses it for ever. PGlite's clock is ms-resolution, so no replay saw
      # it; this guard drives the shipped runSetActivity + runTick and restores
      # the µs a production clock carries. --mutate reverts the fix in a temp
      # copy of the function directory and requires R-G-a/R-C-a to go red.
      - name: World tick — resumes within one cadence after a re-point
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-stall-after-repoint.mjs
          node tools/mutant-gate.mjs node tests/world-tick-stall-after-repoint.mjs --mutate

      # A STALLED TICK IS RED FROM THE DATABASE ALONE (2026-09-28). The 22 h
      # stall above read green on every cron-grain query because the edge's
      # verdict lived only in pg_net's ~6 h response table.
      # 2026-09-28-world-tick-stall-observability.sql folds it into
      # hr_tick_cron_log.detail.edge and states "rostered >= 1 and shadow
      # rows/h < 30 for 2 h => stalled" as hr_tick_stall_status(). This proves
      # both on planted histories plus a byte-identical second apply;
      # --selftest re-creates one function at a time with a load-bearing line
      # broken and requires its arm red.
      - name: World tick — a stall is red from the database alone
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-stall-guard.mjs
          node tools/mutant-gate.mjs node tests/world-tick-stall-guard.mjs --selftest

      # A guard's mutant replay stops at its own files (upTo / LAST_PATCHED), or
      # says why the whole chain must judge it (fullChain). Without that, a
      # NEWER migration's §0 lock refuses first and blinds the guard — CI
      # db-replay-5 on set/b564. RS1-RS3: the predicate, the engine's refusal,
      # every bootReplay caller. --selftest: 7 mutants + 5 negative controls.
      - name: Replay scope — a mutant stops at its own guard's files
        if: ${{ !cancelled() }}
        run: |
          node tests/replay-scope-guard.mjs
          node tools/mutant-gate.mjs node tests/replay-scope-guard.mjs --selftest

      # Security SEC_WORLD_TICK_ARM_2026-10-05 rulings 5 + 1 (admission):
      # armed_channels is the one arming authority. Presents hr_engine as the
      # edge does and measures: gather armed alone writes one ledger row per
      # window while combat writes none; one UPDATE de-arms every channel;
      # shadow admission ends at 7 d and is logged; the armed 24 h fence holds;
      # the migration re-applies byte-identically; a party follows combat's mode. --selftest plants eight
      # defects and requires each red (self-check or arm, by name).
      - name: World tick — each channel arms alone, one statement de-arms all
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-channel-arm.mjs
          node tools/mutant-gate.mjs node tests/world-tick-channel-arm.mjs --selftest

      # Security SEC_GATHER_ARM_RUNBOOK_2026-10-06 F1 + F2: an ARMED window
      # never pays time the offline cap forfeits (one span or a drip from an old
      # mark is refused fenced_cap), and an armed channel's stall is judged on
      # its tick ledger rate; the shadow verdict is diffed against the
      # 2026-10-06 body. --mutate re-creates one body with one line broken.
      - name: World tick — armed windows stay inside the offline cap; armed stalls are judged
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-armed-cap.mjs
          node tools/mutant-gate.mjs node tests/world-tick-armed-cap.mjs --mutate

      # Security G1 (party-fences review): tools/vitals.mjs restates the armed
      # stall judge (the read-only role cannot execute hr_tick_stall_status).
      # Both judges run on the same 15 replayed fixtures (F2b: online = not
      # judged; hr_partied: a live party hunt member is not a sentinel) and
      # must agree; --mutate: 15 vitals mutants (V16 parked, V17 logged-but-owed), each RED by name.
      - name: Vitals armed stall judge equals hr_tick_stall_status (G1)
        if: ${{ !cancelled() }}
        run: |
          node tests/vitals-armed-parity.mjs
          node tools/mutant-gate.mjs node tests/vitals-armed-parity.mjs --mutate

      # Security P3 on the party-reaper verdict: a party hunt started while
      # combat is disarmed is never ticked, so its members' accrue is refused
      # for up to 24 h. hr_party_hunt_start now refuses hunt_channel_disarmed
      # (journalled) unless the tick is enabled and combat armed. --mutate: 7.
      - name: Party hunt — start refused unless combat is armed
        if: ${{ !cancelled() }}
        run: |
          node tests/party-hunt-start-gate.mjs
          node tools/mutant-gate.mjs node tests/party-hunt-start-gate.mjs --mutate

      # Presence horizon (2026-10-10-world-tick-presence-horizon.sql, Game
      # Designer ruling on B1): the armed tick pays nothing past last REAL
      # return + hr_offline_cap_ms, and the return pays only the remainder.
      # Away (tick) and attended (return) paths; one cap source; the edge reads
      # hr_accrue_cap_ms at all four accrue-cap sites. --mutate: 13 mutants.
      - name: World tick — presence horizon, no absence paid twice or past its cap
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-presence-horizon.mjs
          node tools/mutant-gate.mjs node tests/world-tick-presence-horizon.mjs --mutate

      # Presence signal (2026-10-14-world-tick-presence-signal.sql, Game
      # Designer precondition B3): a stamped hr_heartbeat (JWT uid, server
      # clock, 20 s floor, 6/min bucket) raises the return anchor inside the
      # horizon, so a partied online player who only beats is never dropped,
      # an offline one still parks/drops at R + cap, and a beat after a spent
      # horizon pays nothing back. --mutate: 10 mutants. Measured locally
      # 2026-10-14: 2 s plain + 4 s mutate template-warm (~35 s each cold).
      - name: World tick — presence signal, the heartbeat carries the horizon
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-presence-signal.mjs
          node tools/mutant-gate.mjs node tests/world-tick-presence-signal.mjs --mutate

      # Gather widen, stage 1 (2026-10-10-world-tick-gather-widen.sql): the
      # server enrols a RETURNING gatherer into tick ownership (hash bucket <
      # permille, raw accrued_to inside 600 s, armed, unpartied, under the
      # max_owned fuse), journalled, paying nothing; unenrol restores the
      # operator cohort exactly; the stall judge names ONE stuck gatherer the
      # aggregate floor hides; vitals' V6 restatement agrees; parked (mark at the horizon) is never a sentinel. --mutate: 25 mutants.
      - name: World tick — gather widens by server enrolment; one stuck gatherer is named
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-gather-widen.mjs
          node tools/mutant-gate.mjs node tests/world-tick-gather-widen.mjs --mutate

      # World-tick scale (2026-10-11-world-tick-*.sql, the stage 2/3 gates of
      # the gather widen): the roster serves only DUE characters and never
      # hydrates them (counted calls), and the shipped runTick settles every one
      # it serves. Arms grow with S2-S4. --mutate: every mutant red on its arm.
      - name: World tick — scale (due-only roster, shards, catch-up, ledger fold)
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-scale.mjs
          node tools/mutant-gate.mjs node tests/world-tick-scale.mjs --mutate

      # EC-3d, the control, carries its own proof since 2026-09-22. It shipped
      # asserting the literal `+00:00` on the accrue path's rendering, which is
      # the replay session's TimeZone talking — PGlite takes that GUC from the
      # host's UTC offset — so the arm was red on any machine off UTC and green
      # here, where the runner is UTC, with a failure message naming a spelling
      # collision that had not happened. Database-free and milliseconds: the
      # verdict is a pure function of three renderings and a label hash, and
      # --selftest plants four defects in it (a converged tick spelling, a
      # converged roster spelling, a canonicalising hr_seed, an accrue rendering
      # that is no longer Postgres's) plus the two negative controls — a UTC
      # session and an off-UTC one — that must stay silent. Per C4 the plain run
      # above stays registered: only it answers "is this green when it should
      # be" against the real Postgres renderings.
      - name: World tick — EC-3d control, mutation proof
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/world-tick-edge-contract.mjs --selftest

      # THE PARITY READ MUST ADDRESS A LEVEL THAT EXISTS (Security S-10,
      # 2026-09-23). hr_apply writes a ledger row as
      # `jsonb_build_object('delta', v_meta) || coalesce(v_j->'meta','{}')`, so
      # the journal's keys — att, kills, ate, capped, ms — merge at the TOP of
      # player_ledger.meta and there is no `meta->'meta'` level. WORLD_TICK_
      # DESIGN.md §16.6 and the 2026-09-22 Security runbook both spelled the
      # attended partition `(meta->'meta' ? 'att')`, which does not error: it
      # evaluates to NULL, so `group by` collapses to ONE bucket and
      # `where … and not (…)` returns NO ROWS AT ALL. The combat parity read
      # would have come back empty and been read as a defect — 16.3's own
      # failure shape, planted in the instrument.
      #
      # This guard LIFTS §16.6's sql block out of the design file and EXECUTES
      # it against two real hr_apply rows on the chain replay, so the document
      # an operator actually runs is the thing under test; a transcription
      # would have gone green while the doc stayed wrong, which is how this
      # survived two reviews. --mutate plants the old spelling back into that
      # same query and requires L-1 to go red.
      - name: World tick — the parity read's ledger-meta spellings
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-ledger-meta.mjs
          node tools/mutant-gate.mjs node tests/world-tick-ledger-meta.mjs --mutate

      # SECURITY T-1 (SEC_WORLD_TICK_TOKEN_2026-09-23.md), P1. The token
      # migration used to APPLY GREEN on a database where pgcrypto could not be
      # resolved, and the world tick then answered `no_hmac` on every fire for
      # ever — a migration that succeeds while disabling the feature it
      # configures, with a `raise notice` as the only warning. This guard builds
      # all three states the discriminator (`vault.decrypted_secrets`) can be in
      # and reads the APPLY's own verdict: Vault + no pgcrypto must be REFUSED,
      # the credential-free replay must still apply and still fail closed with a
      # journalled `no_hmac`, and the working shape must pay nothing for the
      # gate. --selftest: §0b off is still caught by d10, both off reproduces
      # T-1, and §0b over-firing breaks the credential-free replay. (d10 alone
      # is unobservable behind §0b; its control is tests/mutant-control.mjs.)
      - name: World tick — a tick that could not derive refuses the apply
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-token-failclosed.mjs
          node tools/mutant-gate.mjs node tests/world-tick-token-failclosed.mjs --selftest

      # MOVED HERE FROM db-replay-7 2026-10-24: db-replay-7 ran 25.1-33.0 min of its 43
      # (77%) on runs 40034325773..40043808165, this proof 200-274 s of it; this job ran
      # 4.7-5.9 min of 20. db-replay-7 ~28.4 min worst (66%), this job ~10.5 (53%).
      - name: Goal counters — mutation proof
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/goal-counters.mjs --mutate

  # ── db-replay-6 / db-replay-7 ── MUTATION PROOFS NOTHING RAN (2026-10-07,
  # lane b564-hollow-mutants). Thirteen guards' plain bodies run in the in-page
  # job (tests/run-smoke.mjs), but their --mutate/--selftest proofs were wired
  # into no step — "a guard that has never been red is not a guard" held on
  # paper only. No existing replay job had headroom (note [6]: every one is
  # already past x2), so they get two jobs of their own, each verifying the
  # PGlite snapshot cache FIRST under its own --for= (CI-SHAPE-4).
  #
  # MEASURED locally 2026-10-07, one guard at a time on a quiet machine:
  #   db-replay-6: unlock-buy 256 + companion-codes-severity 137 + market-v2 57
  #     + auto-eat-at-creation 23 + bounty-difficulty-count 20 + client-write-
  #     sweep-5 17 + gem-daily-budget 2 plain + 16 mutate = 528 s, + verify
  #     ~64 + setup ~11 = 603 s (10.05 min). Budget = x2 = 20.1, rounded up to 21.
  #     + frame-self-echo (2026-10-07, measured locally): 2 s plain + 45 s mutate.
  #     + party-hunt-view (2026-10-15, measured locally): ~30 s plain + ~30 s
  #     mutate cold (2 s + 6 s template-warm). Job total NOT re-measured here.
  db-replay-6:
    runs-on: ubuntu-latest
    # 21 + frame-push-revive and chat-broadcast (2026-10-23: ~3 min measured locally, x2 = 6, rounded to 25 with slack)
    # + server-perf (2026-10-24: ~1.5 min measured locally, x2 = 3) = 28
    # market-v2 --selftest grew 57 -> ~100 s locally (lane c-market-account, 2026-10-24; 22-37 s
    # on GitHub before): worst 18.0 min of 28 (64%) on run 40069060383, ~18.3 projected (65%). Kept.
    timeout-minutes: 28

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      - name: Unlock buy — mutation proof
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/unlock-buy.mjs --selftest

      - name: Companion codes severity — mutation proof
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/companion-codes-severity.mjs --selftest

      - name: Market v2 — mutation proof
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/market-v2.mjs --selftest

      # (Auto-eat at creation — RETIRED 2026-10-14 by lane C2 with Auto-Eat
      # itself: tests/hunt-sessions-db.mjs D1 asserts the switch and its columns
      # are gone. Deliberately unregistered, not forgotten.)

      - name: Client write sweep 5 — mutation proof
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/client-write-sweep-5.mjs --selftest

      # Was in tests/guards-unregistered.json as "asserts:false"; re-measured
      # 2026-10-07: the plain run asserts the 5,000/day gem ceiling (2.2 s) and
      # --mutate installs a no-ceiling body and goes RED on it. Both run here.
      - name: Gem daily budget — the per-day gem ceiling, and its mutation proof
        if: ${{ !cancelled() }}
        run: |
          node tests/gem-daily-budget.mjs
          node tools/mutant-gate.mjs node tests/gem-daily-budget.mjs --mutate

      # Security, 2026-10-07: the M2 gather ARM file is excluded from the
      # replay chain, so nothing re-measured it, and its P3 (15 min freshness)
      # contradicted F2b at S2 — it refused on prod at 16:34 UTC. Executed on a
      # live-shaped fixture, rolled back: the as-found file arms in NO state,
      # the amended one arms 2-4 h after a real return and keeps every P/S
      # refusal. --mutate: 9 mutants of the arm file's own text. (~10 s each.)
      - name: World tick — the gather arm file arms only when gather will be judged
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-arm-gather.mjs
          node tools/mutant-gate.mjs node tests/world-tick-arm-gather.mjs --mutate

      # M4 (2026-10-14, lane b568-m4-combat-arm). The party path gets the
      # presence horizon and the combat cohort, the cap read loses its partied
      # short-circuit, and a combat-armed config cannot push a stack frame
      # (2026-10-14-world-tick-m4-party-horizon.sql): applied on the replayed
      # chain, self-check m1-m9, byte-identical re-apply, and P-BASE (the
      # restated settle is the frac-keys body plus inserted runs only); --mutate
      # 16 defects, §7's pins
      # re-measured so the behaviour arms are reached. Then the combat ARM file
      # (excluded from the chain, like the gather one) on a live-shaped fixture,
      # rolled back: arms only 2-4 h after a real return, only with a filled
      # pin, 12 probes with retained input, one owned sentinel; --mutate 19.
      # Measured locally 2026-10-08: 3 s + 4 s + 3 s + 24 s.
      - name: World tick — M4 party horizon + cohort, and the combat arm file arms only on its evidence
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-m4-party-horizon.mjs
          node tools/mutant-gate.mjs node tests/world-tick-m4-party-horizon.mjs --mutate
          node tests/world-tick-arm-combat.mjs
          node tools/mutant-gate.mjs node tests/world-tick-arm-combat.mjs --mutate

      # party_hunt SELECT lockdown (2026-10-15-party-hunt-select-lockdown.sql,
      # Security GO-WITH-CHANGES #2): stopped_by can carry a co-member uuid, so
      # no client reads party_hunt directly — zero policies, no client grant,
      # a grep proof over src/** + supabase/functions/**. --mutate: 5 mutants.
      - name: Party hunt — no client reads the table directly
        if: ${{ !cancelled() }}
        run: |
          node tests/party-hunt-select-lockdown.mjs
          node tools/mutant-gate.mjs node tests/party-hunt-select-lockdown.mjs --mutate

      # Discord gift (2026-10-18-discord-gift.sql): this week's server-derived
      # code (HMAC of a Vault secret) pays a server-constant gem gift ONCE PER
      # ACCOUNT, journalled, rate limited; closed with no secret; the oracles are
      # owner-only by ACL. Both states run (no Vault / Vault + pgcrypto shim).
      # --mutate: 16 SQL mutants + 4 client/tool-scan mutants. Template-warm seconds.
      - name: Discord gift — one gift per account, server code and amount, journalled
        if: ${{ !cancelled() }}
        run: |
          node tests/discord-gift.mjs
          node tools/mutant-gate.mjs node tests/discord-gift.mjs --mutate

      # Closed rebuild (2026-10-21-closed-mode.sql + 2026-10-21-closed-rebuild-wipe.sql):
      # a non-allowlisted account is refused hr_closed by the pre-request hook,
      # hr_rpc_gate, hr_rate_gate and RLS; the allowlisted one plays; the wipe
      # empties every player table once and keeps accounts and catalogues; the
      # generated allowlist files admit and remove; anon reads no player-written
      # table while closed. --mutate: 20 SQL/tool + 2 client mutants.
      - name: Closed rebuild — only the allowlist gets in; the wipe is one clean slate
        if: ${{ !cancelled() }}
        run: |
          node tests/closed-rebuild.mjs
          node tools/mutant-gate.mjs node tests/closed-rebuild.mjs --mutate

      # The playtest open switch (2027-02-10-playtest-open.sql, STAGED in `excluded`):
      # replayed CLOSED, applied twice (the second moves nothing); a brand-new account
      # signs up, boots, creates a hero and enters mill_cellar, ten at once from ten
      # addresses; anon still cannot write; the reverse UPDATE closes it again.
      # --mutate: 3 SQL mutants (no flip, churn, re-close).
      - name: Playtest open — a new account reaches its first hunt once the switch is open
        if: ${{ !cancelled() }}
        run: |
          node tests/playtest-open.mjs
          node tools/mutant-gate.mjs node tests/playtest-open.mjs --mutate

      # RETIRED 2026-10-22 (world-actions cut, Tyler): tests/absence-claim-wallet.mjs proved world_event_absence_claim's gold/gem payout; 2026-12-04-world-actions-cut.sql drops it. tests/old-rewards-gone.mjs keeps it cut (OR-4).

      # NO SELF-ECHO FRAMES (2026-10-09-frame-self-echo.sql). A player's own
      # HTTP write is not pushed back to their own topic; another character's
      # write, a world-tick settle and every client-shaped request still are.
      # Executed on the replayed chain's final state; --mutate plants five
      # defects the file's own §9 must refuse (forged marker, unbound marker,
      # self-before-tick, …), a negative control without the file, and two
      # edge defects (the tick path marking, an apply site unmarked).
      - name: Frame self-echo — own writes not echoed, tick + others + forged still sent (base + mutate)
        if: ${{ !cancelled() }}
        run: |
          node tests/frame-self-echo.mjs
          node tools/mutant-gate.mjs node tests/frame-self-echo.mjs --mutate

      # THE PUSH CHANNEL, REVIVED (2026-12-25-frame-push-revive.sql). A committed
      # settle and an accepted write each push the WHOLE character once to a
      # character open in a client, never the requester's echo; the RLS lets only
      # the owner receive its topic and no client write one. Catalog checks on the
      # chain's final state; --mutate plants 12 defects the file's §6 must refuse
      # by name. MEASURED locally 2026-10-23: ~5 s plain (template warm) + 31 s mutate.
      - name: Frame push revive — settles and writes push the whole character once, to an open client (base + mutate)
        if: ${{ !cancelled() }}
        run: |
          node tests/frame-push-revive.mjs
          node tools/mutant-gate.mjs node tests/frame-push-revive.mjs --mutate

      # CHAT ON PRIVATE BROADCAST (2026-12-26-chat-broadcast.sql + -27-chat-
      # unpublish.sql). Every stored line and whisper is broadcast once to exactly
      # who may hear it (public topics, the account inbox for party lines and
      # whispers, never a blocker), no client can send, and the chat tables are
      # unpublished. --mutate plants 12 defects the file's §5 must refuse by name.
      # MEASURED locally 2026-10-23: ~5 s plain + 139 s mutate.
      - name: Chat broadcast — every line and whisper to exactly who may hear it (base + mutate)
        if: ${{ !cancelled() }}
        run: |
          node tests/chat-broadcast.mjs
          node tools/mutant-gate.mjs node tests/chat-broadcast.mjs --mutate

      # SERVER PERF (2027-01-01-server-perf.sql). Each hero of an account has its
      # own accrue budget (two heroes, 30 each: red on the old per-account gate),
      # activity stays the account's; both hunt rosters read character_presence,
      # never the dead last_seen_at; the cron detector keeps a week of pg_cron run
      # history and logs its phase times. --mutate plants 15 defects the file's §4
      # must refuse by name. MEASURED locally 2026-10-24: ~45 s plain cold (the
      # chain boot) + 40 s mutate.
      - name: Server perf — per-hero accrue budget, rosters on live presence, cron history kept a week (base + mutate)
        if: ${{ !cancelled() }}
        run: |
          node tests/server-perf.mjs
          node tools/mutant-gate.mjs node tests/server-perf.mjs --mutate

      # UTC MIDNIGHT REPLAY, SHARD 2 of 2 (2026-10-24; shard 1 and the --selftest are the
      # utc-midnight-replay job, see there). Its arms set HR_PGLITE_CACHE=0 themselves.
      - name: UTC midnight replay, shard 2 of 2 — the chain applies at every second of the day
        if: ${{ !cancelled() }}
        run: node tests/utc-midnight-replay.mjs --shard=2/2

  # db-replay-7 (same origin as db-replay-6, above). MEASURED locally
  # 2026-10-07: intent-mismatch 123 + goal-counters 117 + goal-gold-retune 56
  # + cron-health 33 + artisan-progress-model 25 + companion-grant-hardening 24
  # + mutant-control 181 (goal-counters 137 + world-tick-token-failclosed 44,
  # each with nothing planted) + its selftest ~1 = 560 s, + verify ~64 + setup
  # ~11 = 635 s (10.6 min). Budget = x2 = 21.2, rounded up to 22.
  # + xp-frac-carry (2026-10-08, measured locally): 3 s plain + 129 s mutate
  # = 767 s (12.8 min). Budget = x2 = 25.6, rounded up to 26.
  # + companion-xp-frac (2026-10-08, measured locally): 35 s plain + 176 s
  # mutate = 978 s (16.3 min). Budget = x2 = 32.6, rounded up to 33.
  # + delta-key-allowlists (2026-10-13, measured locally): 29 s plain + 3 s
  # mutate (template-warm; ~30 s cold) = 1040 s (17.3 min). Budget = x2 = 34.7,
  # rounded up to 35.
  # + companion-equip-version-bump (2026-10-14, measured locally): 2 s plain +
  # 2 s mutate template-warm (~30 s each cold) + its mutant-control re-run
  # ~30 s = ~1130 s (18.8 min). Budget = x2 = 37.7, rounded up to 38.
  # + progress-coalesce's mutant-control re-run (2026-10-08, measured locally
  # 37 s) = ~1167 s (19.5 min). Budget = x2 = 38.9, rounded up to 39.
  # + lane S2 (2026-10-18, measured locally template-warm): gen-alpha-catalogue
  # --check/--selftest ~2 s, alpha-server 14 s plain + 35 s mutate (~60 s each
  # cold) = ~1290 s (21.5 min). Budget = x2 = 43.
  # + market-edge (2026-10-25, lane c-market-edge, measured locally on a busy box): ~2 min
  # plain + ~5 min --selftest (14 arms, prefix-cached replays) = ~1710 s (28.5 min) local;
  # GitHub has run this job's replays 1.5-3.6x faster than local. Budget 43 -> 50; re-measure
  # from the first GitHub run and tighten.
  db-replay-7:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      - name: Intent mismatch — mutation proof
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/intent-mismatch.mjs --selftest

      # (Goal counters — mutation proof moved to db-replay-5 2026-10-24: see the note there.)

      - name: Cron health — mutation proof
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/cron-health.mjs --selftest

      - name: Artisan progress model — mutation proof
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/artisan-progress-model.mjs --mutate

      - name: Companion grant hardening — mutation proof
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/companion-grant-hardening.mjs --selftest

      # FRACTIONAL XP IS CARRIED (2026-10-09-xp-frac-carry.sql). Batching moves
      # no unit, +2% pays on the slime, attended == away == world tick in XP AND
      # remainder, the seeded draws are unchanged, the remainder is clamped and
      # server-only. --mutate plants five JS defects in a copy of src/ and three
      # SQL defects into the migration, each of which its arm / §4 must stop.
      - name: XP fraction carry — exact under batching, AWAY-1 parity (base + mutate)
        if: ${{ !cancelled() }}
        run: |
          node tests/xp-frac-carry.mjs
          node tools/mutant-gate.mjs node tests/xp-frac-carry.mjs --mutate

      # EVERY DELTA-KEY ALLOWLIST COVERS EVERY KEY THE ENGINE CAN PROPOSE
      # (2026-10-13-party-settle-frac-keys.sql). The proposable set is DERIVED
      # from accrual.js / tick-gather.js; hr_apply's c_delta_keys, the party
      # settle's c_delta_ok + c_stamp and foldDeltas must cover it, and an armed
      # party window carrying xp_frac + companion_xp_frac pays each member what
      # a solo hr_apply pays their twin (control: the pre-fix body refuses it
      # unknown_delta_key). --mutate: 20 mutants, one per allowlist missing a key,
      # a NEW engine key and three dotted spellings of one (camelCase, spaced,
      # split), eight non-literal key writes (K0), a format(%I) reader
      # of c_delta_ok (KR), a dormant key's column appearing, the scan narrowed.
      - name: Delta-key allowlists cover the engine (base + mutate)
        if: ${{ !cancelled() }}
        run: |
          node tests/delta-key-allowlists.mjs
          node tools/mutant-gate.mjs node tests/delta-key-allowlists.mjs --mutate

      # EVERY WRITE OF THE EQUIPPED PET BUMPS THE ROW VERSION. hr_apply's
      # companion_not_equipped refusal is a stall, not a bug, only because a
      # swap turns an in-flight settle into version_conflict. CE0 the scan sees
      # hr_companion_equip; CE1 every UPDATE/upsert SET of companion_equipped
      # carries version = version + 1 in the same statement; CE2 no record-field,
      # dynamic-SQL or MERGE write; CE3 no client role holds UPDATE on the column;
      # CE4 a real equip moves version by exactly 1. --mutate: 10 mutants.
      - name: Companion equip bumps version (base + mutate)
        if: ${{ !cancelled() }}
        run: |
          node tests/companion-equip-version-bump.mjs
          node tools/mutant-gate.mjs node tests/companion-equip-version-bump.mjs --mutate

      # LANE S2 (2026-10-25-*.sql): the alpha windows' and the party UI's server
      # half. The catalogue (supply offers, stamina refill, blessings) is GENERATED
      # from src/data; on the real chain every S2 file re-applies byte-identically,
      # the edge shop_buy and the SQL refill price one offer alike, a locked item is
      # refused at the REAL vendor_sell_many, the loot filter and a blessed death run
      # in the REAL settle (tick and player door), a mid-hunt stamina refill raises
      # the pool the next settles read, and the leader's one start enters each member
      # with its own bag. --mutate plants twelve defects, each red on its arm.
      - name: Lane S2 server — locks, loot filter, refill, stamina, blessings, party start
        if: ${{ !cancelled() }}
        run: |
          node tools/gen-alpha-catalogue.mjs --check
          node tools/mutant-gate.mjs node tools/gen-alpha-catalogue.mjs --selftest
          node tests/alpha-server.mjs
          node tools/mutant-gate.mjs node tests/alpha-server.mjs --mutate
          node tools/build-settle-hooks.mjs --check
          node tests/settle-hooks.mjs
          node tools/mutant-gate.mjs node tests/settle-hooks.mjs --mutate

      # THE LOOT PLAN AND DISPATCH LOOT (Tyler 2026-10-25, 2027-01-23-loot-dispatch.sql): a
      # real hunt with deposit / sell / keep / sell-but-locked plans picks up loot and SELLS
      # NOTHING at pickup; Dispatch mid-hunt is refused; after the real leave it moves the
      # deposit stack whole to Storage, sells the sell stack at the catalogue bid (= the edge's
      # vendorPriceOf), one bank row and one vendor_sell_many row, one version step; a replay
      # moves nothing; Storage room by kind; the setter's refusals; a byte-identical re-apply.
      # --mutate plants seven defects, each red on its arm.
      - name: Loot plan and Dispatch loot — no pickup sale, deposit and sell in town
        if: ${{ !cancelled() }}
        run: |
          node tests/loot-dispatch.mjs
          node tools/mutant-gate.mjs node tests/loot-dispatch.mjs --mutate

      # TOWN SKILLS DRAW ON THE BAG, THEN STORAGE (Tyler 2026-10-25, a universal truth;
      # 2027-01-24-skills-from-storage.sql): a bench run through the REAL edge verb (start, then the
      # stop's collect) spends its inputs from Storage when the bag has none, the bag first when both
      # do (conservation), and a sibling's Storage move between the engine's read and its apply is
      # refused with nothing moved and paid from what is left on the next settle (the key released);
      # the Work window's "Makes up to N" and Bury all count bag + Storage; planting and replant take
      # a Storage seed (no purchase); a full bag stops the bench and says why; the resume after a
      # hunt counts Storage; a forged line cannot drain Storage; the lock order. --mutate: 11.
      - name: Town skills — inputs from the bag, then Storage
        if: ${{ !cancelled() }}
        run: |
          node tests/skills-from-storage.mjs
          node tools/mutant-gate.mjs node tests/skills-from-storage.mjs --mutate

      # HARVEST AND CLEAR PLOT (report #66; 2027-01-26-farm-harvest-clear.sql): a regrowing vine is
      # harvested once and removed (plot empty, journalled), a plain harvest still regrows, a replay
      # is cached, another account touches nothing, authenticated only, a second apply is a no-op.
      # --mutate: 4.
      - name: Farm — harvest and clear a regrowing plot
        if: ${{ !cancelled() }}
        run: |
          node tests/farm-harvest-clear.mjs
          node tools/mutant-gate.mjs node tests/farm-harvest-clear.mjs --mutate

      # THE REGROW LIMIT SURVIVES A CATALOGUE REGEN (2027-01-27-items-catalogue.generated.sql): a
      # fresh generation writes hr_crops.regrow_limit = src/core/farm.js REGROW_LIMITS for every crop,
      # and the replayed chain ends with them (every regen from 2026-08-22 to 2027-01-14 dropped it to
      # 0 = no limit). --mutate: 2 (the generator drops the column / writes 0).
      - name: Farm — regrowing crops keep their finite limit through a catalogue regen
        if: ${{ !cancelled() }}
        run: |
          node tests/catalogue-regrow-limit.mjs
          node tools/mutant-gate.mjs node tests/catalogue-regrow-limit.mjs --mutate

      # THE ONE-WAY PARTY FLOW (2026-10-28-party-flow.sql, PARTY_SPEC + Tyler
      # 10-19): every step on the real chain as `authenticated` — the first
      # invite makes the party, an own character joins at once (slot or name),
      # accept, leave (the lead passes on), kick, disband (leader, town only),
      # start on the leader's ground all-or-none (an away member holds it back),
      # the 10-minute seat keep (a hunter is never dropped), a byte-identical
      # second apply, the grants. --mutate plants nine defects into the file,
      # applied in a rolled-back transaction after a clean control.
      - name: Party flow — invite, own join, accept, leave, kick, disband, start, seat keep
        if: ${{ !cancelled() }}
        run: |
          node tests/party-flow.mjs
          node tools/mutant-gate.mjs node tests/party-flow.mjs --mutate

      # THE PLAY CAP (2027-01-19-play-cap.sql, Tyler 2026-10-17: up to four heroes
      # play at once, per account and per hashed IP), on the real chain: the browser
      # closed (the hunt door + the REAL edge set_activity refuse a fifth) and the hunt
      # viewed (a CharacterSession's Enter is refused, its words say why), a yield /
      # ground change / settle resume never counted twice, four on one network across
      # accounts, and the party view's `ready` equal to what Start does. --mutate
      # plants eleven defects on the chain end, each red on its arm.
      - name: Play cap — four heroes at once per account and per network, every start door
        if: ${{ !cancelled() }}
        run: |
          node tests/play-cap.mjs
          node tools/mutant-gate.mjs node tests/play-cap.mjs --mutate

      # THE WEIGHHOUSE THROUGH THE EDGE (market lane 2: hr-accrue market.js + 2027-01-21-
      # market-same-network.sql), on the real chain end: the wire (request.js readMarket, the
      # registry, the client builder agree), the switch OFF (market_closed, bare), list ->
      # browse -> buy -> mine -> cancel through src/session/market-intents.js with every side
      # conserved, a replay that moves nothing, the same-network sale flagged and absent from
      # every history read, settle-first on the bag path only, the counters each verb spends,
      # zero statements for a shape refusal, index.ts's literal dispatch, a byte-identical
      # second apply. --selftest plants 14 defects (edge bytes, client builder, the migration
      # with its §6 silenced so a leg must catch each).
      - name: Market edge — the six market verbs through hr-accrue, and the same-network flag
        if: ${{ !cancelled() }}
        run: |
          node tests/market-edge.mjs
          node tools/mutant-gate.mjs node tests/market-edge.mjs --selftest

      # THE CONTROL HALF OF A MUTATION PROOF. Every registered guard is re-run
      # with HR_MUTANT_CONTROL=1 (nothing planted, scope kept); any arm that
      # still reads "caught" is caught by something other than its mutant
      # (measured 2026-10-07: world-tick-token-failclosed MF2). --selftest feeds
      # it the five ways a control can lie.
      - name: Mutant control — every arm survives when nothing is planted
        if: ${{ !cancelled() }}
        run: |
          node tests/mutant-control.mjs
          node tools/mutant-gate.mjs node tests/mutant-control.mjs --selftest

  # ── db-replay-8 ── SPLIT OUT OF db-replay-5 2026-10-08 (CI-SPLIT-6). The
  # GitHub run for 3ea45544 (set/b565 on next, run 37725703255) CANCELLED
  # db-replay-5 at its own 20-min timeout: "the parity probe writes its own
  # rows and the bar bites" took 765 s (42 s on main@e6a12d3a the day before),
  # "a span crossing the Vigour line" was cut off at 292 s, 14 steps never ran.
  # ROOT CAUSE (not runner variance): the seeded replay bar (210c1065) and
  # SELFTEST_REPLICAS 40 -> 120 (d051c835) made probe-bar + the evaluator's
  # --selftest ~4 000 chain replays, and world-tick-vigour-line 300 seeds per
  # side, all on ONE core of a four-core runner, with PB-1/PB-2/PB-2p and every
  # mutant re-running the same (fixture, start, span, seed) chains. Fixed in the
  # same lane WITHOUT touching a replica count, a fixture or a bar: the
  # replicas ran across worker threads and probe-bar computed each distinct
  # chain once (both deleted with the solo combat channel, lane C2);
  # every read prints byte-identically to the serial code (diffed: probe-bar
  # plain and --mutate, the evaluator's --selftest, vigour-line plain and
  # --mutate). The pricing family (probe, resume line, perks/bestiary, Vigour
  # scale and line, max HP carry) moved here whole; db-replay-5 keeps the
  # write-safety family.
  #
  # MEASURED locally 2026-10-08 (`run-ci-local --job db-replay-8`,
  # HR_REPLAY_THREADS=4 = the runner's cores, on a dev box ~67 % busy with
  # other lanes): 1160 s. The same box ran the UNCHANGED steps 1.5-3.6x
  # slower than GitHub (verify 112 vs 36-68 s, vigour-scale 58 vs 18-40,
  # max-hp 29 vs 8), and the OLD serial probe step 1356-2034 s locally vs
  # 367-899 s on GitHub (x2.26 on the slow pair). Scaled by that slow-pair
  # factor: probe step 599 -> ~265 s, vigour-line 334 -> ~134 s; plus
  # GitHub's own slowest observed verify 68 + resume 4 + perks/bestiary 10 +
  # vigour-scale 40 + max-hp 8 + setup ~11 = ~540 s (9.0 min). Budget = x2
  # rounded up = 20 min. Re-measure from the first GitHub run and tighten.
  # + progress-coalesce (2026-10-08, measured locally): 36 s plain + 37 s
  # mutate = ~613 s (10.2 min). Budget = x2 = 20.4, rounded up to 21.
  # + hunt-tick-shards (2026-10-21, measured locally): 12 s plain + 61 s
  # mutate = ~686 s (11.4 min). Budget = x2 = 22.9, rounded up to 23.
  # 2026-10-28: MEASURED on GitHub 22.1 min (run 40519116420, v0.2.54) and
  # over 23 on run 40609031329 (Inner Flame's 2027-01-31 chain lengthens every
  # replay; cancelled mid-step, no assertion failed). Budget 30 until the job is
  # split (optimization review).
  db-replay-8:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node modules (no browser)
        run: npm install --no-audit --no-fund

      # THE SHADOW PARITY PROBE (Security ruling 1, 2026-10-05). Every 4 h per
      # rostered shadow character the tick runs ONE single-span accrual over
      # the span its windows tiled and stores it in hr_tick_probe — and nothing
      # else. world-tick-parity-probe drives the shipped runTick on the replayed
      # chain: the span tiles real windows, the stored input IS the opening
      # window's session, the chain is byte-identical with and without the
      # probe, and an open+close moves zero tuples in every other user table.
      # --mutate plants a player_state write, a shadow_accrued_to advance, a
      # shadow-journal insert, a dropped lease and a dropped chain-head check,
      # and requires each RED by name at apply AND in the guard.
      # tools/world-tick-parity.mjs --selftest proves the evaluator's
      # eligibility rules and the GATHER bar on planted rows (the solo combat
      # channel, its seeded replay bar, probe-bar calibration, resume line and
      # max-HP carry were deleted with the channel, lane C2: a fight is a hunt
      # session). world-tick-seed-no-leak holds the probe's stored seed
      # (secret-equivalent, SEC_PROBE_RETAIN_2026-10-06) out of every print,
      # export, fixture and CI read; --mutate plants eight.
      - name: World tick — the parity probe writes its own rows and the bar bites
        if: ${{ !cancelled() }}
        run: |
          node tests/world-tick-parity-probe.mjs
          node tools/mutant-gate.mjs node tests/world-tick-parity-probe.mjs --mutate
          node tools/mutant-gate.mjs node tools/world-tick-parity.mjs --selftest
          node tests/world-tick-seed-no-leak.mjs
          node tools/mutant-gate.mjs node tests/world-tick-seed-no-leak.mjs --mutate

      # THE PERK STACK (2026-09-28). hr_perks_of is not an envelope field, so
      # the tick priced every window at zero perks — the standing -2.56% XP gap.
      # tick.js (1b) now makes the accrue path's read; this fires the shipped
      # runTick for a Library-5 character and requires its shadow XP to equal
