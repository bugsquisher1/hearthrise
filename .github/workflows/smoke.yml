      - name: The activity intent — collect-before-switch, replay, key hygiene
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/activity-intent.mjs --selftest

      # SETTLE BEFORE MUTATE (Security F1, 2026-09-28). Every edge verb that adds
      # or changes a priceable input settles the open window at the OLD state
      # first. Measured orders, not markers: a pickaxe bought at return vs
      # accrue-first at production shape (R1), a claim that settles (R1c), a
