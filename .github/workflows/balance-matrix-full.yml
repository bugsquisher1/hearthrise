# ============================================================================
# balance-matrix-full on a MEASUREMENT BRANCH of the balance pass
# (docs/design/overhaul/12-balance-pass.md). Not the set's workflow: this copy
# lives only on balance-full/d-balance-pass-* branches and is never merged.
#
# Each job of tools/balance-program/bp-jobs.json plays one share of one
# measurement on the real engine and uploads its cells. A MEASUREMENT, never a
# gate.
# ============================================================================
name: balance-matrix-full

on:
  push:
    branches: ['balance-full/**']

permissions:
  contents: read

concurrency:
  group: balance-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: jobs
        run: echo "jobs=$(node -e "process.stdout.write(JSON.stringify(require('./tools/balance-program/bp-jobs.json')))")" >> "$GITHUB_OUTPUT"

  play:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    env:
      JOB_NAME: ${{ matrix.job.name }}
      JOB_ARGS: ${{ matrix.job.args }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Play ${{ matrix.job.name }}
        run: node tools/balance-program/balance-matrix.mjs $JOB_ARGS --workers 4 --out "out-$JOB_NAME.json"
      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bp-${{ matrix.job.name }}
          path: out-*.json
          retention-days: 30
