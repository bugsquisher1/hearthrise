# ============================================================================
# balance-sweeps — THE BALANCE LAB'S PRECOMPUTED SWEEPS ON THE PROPOSED GAME,
# ONE JOB A KNOB AND ONE A PROPOSAL TOGGLE.
#
# tools/balance-program/balance-matrix.mjs --sweep --base proposed on the
# representative subset (259 cells on the real engine, Level 10 to 5,000), on
# the proposed game (every recommended proposal of
# tools/balance-program/proposals.json, planted on a scratch copy):
#   k:<knob>    each live knob of tools/balance-program/formulas/knobs.json at
#               each of its steps on the proposed game
#   t:<id>      the proposed game without that proposal (its effect, judged on
#               the proposed game); t:+<id> with a proposal that is off
# Every cell's section 6 metrics and the band rows of standards.mjs. A few
# minutes a job on four cores, so they fan out as a job matrix and each
# uploads its own sweep. A MEASUREMENT, never a gate, and never on a push of a
# lane, set, release or main.
#
# Run it:   gh workflow run balance-sweeps.yml --ref <branch> [-f knobs=a,b]
#           (GitHub dispatches only a workflow the default branch holds; until
#           this file is on main, push the commit to a sweep branch instead:
#           git push origin HEAD:refs/heads/balance-sweeps/<lane>. Only a
#           branch under balance-sweeps/ starts it: no lane, set, release or
#           main push ever does.)
# Join:     node tools/balance-program/sweeps-fetch.local.mjs [--run <id>]
#           (downloads the artifacts, writes tools/balance-program/balance-sweeps.json)
# ============================================================================
name: balance-sweeps

on:
  push:
    branches: ['balance-sweeps/**']
  workflow_dispatch:
    inputs:
      knobs:
        description: 'knob ids, comma-separated (blank: every live knob in knobs.json); every proposal toggle runs too'
        required: false
        default: ''

permissions:
  contents: read

# one sweep per branch at a time: a newer dispatch replaces the run in flight
concurrency:
  group: balance-sweeps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
    env:
      KNOBS: ${{ github.event.inputs.knobs || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: jobs
        name: The knobs and toggles to sweep (validated against knobs.json and proposals.json)
        run: echo "jobs=$(node tools/balance-program/balance-matrix.mjs --sweep-jobs "$KNOBS")" >> "$GITHUB_OUTPUT"

  sweep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    env:
      JOB: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sweep ${{ matrix.job }} on the proposed game
        run: |
          case "$JOB" in
            k:*) ID="${JOB#k:}"; NAME="knob-$ID"; set -- --knobs "$ID" ;;
            t:*) ID="${JOB#t:}"; NAME="toggle-${ID/+/with-}"; set -- --knobs none --variants "$ID" ;;
            *) echo "unknown job $JOB"; exit 2 ;;
          esac
          node tools/balance-program/balance-matrix.mjs --sweep --base proposed "$@" --workers 4 --out "sweep-$NAME.json"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
      - name: Upload the sweep
        if: ${{ !cancelled() && env.NAME != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ env.NAME }}
          path: sweep-*.json
          retention-days: 30
