<!doctype html>
<!-- Town zoom review view (lane/a-havora-perf, 2026-10-26). NOT game code: the REAL renderer (compileMap +
     canvas-backend + every atlas) on town_common at a chosen zoom, no sign-in, for Tyler's x1 / x1.5 / x2 shots.
     ?x=&y=      the hero's tile (map columns); default: the map's start (the gatehouse arrival)
     ?zoom=Z     CSS px per art px (backend.setZoom); none: the screen class's zoom (today's)
     ?crowd=N    the first N stands of every station hold a hero
     Serve the worktree root and open /art/review/town-zoom-2026-10-26/view.html -->
<html><head><meta charset="utf-8"><base href="/">
<link rel="stylesheet" href="src/styles/tokens.css">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}#stage{position:fixed;inset:0}canvas{image-rendering:pixelated;display:block;width:100%;height:100%}</style>
</head><body><div id="stage"></div><script type="module">
import { BUILD } from './src/build-info.js?v=0.2.50';
import { MATERIALS, OPEN_CLASSES, LIGHTS } from './src/data/world/terrain.js?v=0.2.50';
import town from './src/data/world/maps/town_common.js?v=0.2.50';
import { STATIONS } from './src/data/world/stations.js?v=0.2.50';
import { OUTFITS } from './src/data/hunt-outfits.js?v=0.2.50';
import { compileMap } from './src/world/core/map-compile.js?v=0.2.50';
import { loadAtlases } from './src/world/atlas.js?v=0.2.50';
import { createCanvasBackend } from './src/world/render/canvas-backend.js?v=0.2.50';
const q = new URLSearchParams(location.search);
const { book, images } = await loadAtlases({ doc: document, version: BUILD.cache + '-' + Date.now() });
const tables = { materials: MATERIALS, sprites: book.sprites, openClasses: OPEN_CLASSES, lights: LIGHTS };
const map = compileMap(town, tables);
const styles = getComputedStyle(document.body), css = (n) => styles.getPropertyValue(n).trim();
const backend = createCanvasBackend({ win: window, doc: document, book, images, tables, css });
backend.mount(document.getElementById('stage'));
backend.setMap(map);
if (q.get('zoom')) backend.setZoom(Number(q.get('zoom')));
const hero = { x: Number(q.get('x') || map.start[0]), y: Number(q.get('y') || map.start[1]) };
const looks = Object.values(OUTFITS), crowd = Number(q.get('crowd') || 0);
let n = 0;
const units = STATIONS.flatMap((s) => s.stands.slice(0, crowd)).filter(([x, y]) => x !== hero.x || y !== hero.y)
  .map(([x, y]) => ({ id: looks[n++ % looks.length], x, y, anim: 'idle', dir: 's', age: (n * 137) % 1000 }));
window.drawAt = (dx) => backend.sync({ hero: { x: hero.x + (dx || 0), y: hero.y }, name: 'You', units, t: 0 });
window.snap = () => backend.snapshot();
window.drawAt(0);
document.body.dataset.ready = '1';
</script></body></html>
