      - name: Hired-crew accrual — mutation proof
        if: ${{ !cancelled() }}
        run: node tools/mutant-gate.mjs node tests/worker-accrual.mjs --selftest

      - name: Hired-crew accrual — base run
        if: ${{ !cancelled() }}
        run: node tests/worker-accrual.mjs

      # TWO MORE PROOFS ADOPTED (b569), both RED on origin/main and registered
