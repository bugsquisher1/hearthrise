      # tests/hunt-core/drop-tables.mjs's, run by the hunt-core step); bounty proof unchanged. Both
      # paths on wild_boar. 12 mutations + a clean control arm, no DB.
      - name: Field salvage - the tier armour drop rows keep the faucet rules
        if: ${{ !cancelled() }}
        run: |
          node tests/field-salvage.mjs
          node tools/mutant-gate.mjs node tests/field-salvage.mjs --selftest

      # THE SQL HALF, ON A REAL DATABASE (PGlite, the ordered migration chain).
      # An honest find pays ONE trophy + ONE ledger row + ONE broadcast + a
      # receipt, with the SERVER's odds read from the catalogue (there is no delta
      # field that could supply them); every shape forgery is bad_hearthfind and
