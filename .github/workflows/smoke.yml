          node tests/window-globals-exist.mjs



      # ── CLEANUP SLICE 1b: THE DEBT RATCHETS ─────────────────────────────
      # Four numbers that CLEANUP_PROGRAM's scoreboard tracked and nothing
      # enforced, measured from git on 2026-09-07:
      #   src/legacy.js  15,050 lines (08-10) → 22,511 (09-06) → 21,935
      #   src/render/*   0 files (08-10) → 11 (08-24) → 11, FLAT for two weeks
      #   smoke-test.js  16,008 lines → 57,853
      #   migrations     15 → 156, with hr_apply patched by anchored regex into a
      #                  body that exists in no file
      # Every one of those was added by somebody who had read the rule and agreed
      # with it. An unmeasured rule loses every argument it has with a deadline.
      # These four do not ask the debt to be paid — they refuse to let it grow,
      # and each prints the target list for the slice that pays it. All four are
      # pure text scans: credential-free, database-free, milliseconds.


      # THE NARRATIVE MAY NOT OUTGROW THE CODE. src/net/record.js is 1,145
      # comment lines over 655 code lines. The comments here are unusually good,
      # which is precisely why nobody has ever been told no. Per-file ratio
      # ceilings on the 16 largest files, plus a corpus-wide ceiling on lines
      # that narrate a BUILD NUMBER — archaeology that git log already holds,
      # and that starts lying three builds later (the b454 arm-flag class).
      - name: Comment-ratio ratchet — prose may not outgrow code
        if: ${{ !cancelled() }}
        run: |
          node tools/mutant-gate.mjs node tests/comment-ratio-ratchet.mjs --selftest
          node tests/comment-ratio-ratchet.mjs --report

      # A BODY THAT EXISTS ONLY AS A STACK OF REGEXES IS NOT AUTHORED. hr_state_of
      # has taken 12 anchored programmatic edits from 11 migrations since its last
      # full restatement, hr_apply 10 from 3. The text production actually runs is
      # in no file — it must be replayed to be read or reviewed — and each new
      # anchor depends on what the previous patch happened to leave behind, the
      # failure mode being a patch that matches nothing and no-ops IN SILENCE.
      # Today's chains are grandfathered and named so slice 7 has its target list;
      # a NEW migration may not patch a chain already >= 2 deep without writing
      # `-- RESTATEMENT-DEBT-ACK: <why>` into its own header. Text-only: no
      # database, no replay, no credential.
      - name: Patch-chain guard — no new patch onto a chain 2+ deep
        if: ${{ !cancelled() }}
        run: |
          node tools/mutant-gate.mjs node tests/patch-chain-guard.mjs --selftest
          node tests/patch-chain-guard.mjs --report

      # …AND THE RESTATEMENT THAT PAID hr_apply's CHAIN DOWN KEEPS ITS PINS. A
      # restatement is the one migration shape that can silently DISCARD work: it
      # overwrites a body wholesale, so if production has drifted the drift
      # vanishes with no error. 2026-09-14-hr-apply-restatement.sql answers that
      # with two assertions — §0 refuses to run over a body it cannot name, §3(a)
