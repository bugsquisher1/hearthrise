      # a throw (swallowed or not) or an unnamed line is HARNESS, exit 2, never a
      # catch; a clean control that throws is HARNESS. Plain: every runner that
      # imports it is off the old shapes. --selftest: a mutant whose page throws
      # before its rule runs is HARNESS, and the old any-fail rule is caught.
      - name: Catch by rule — a mutant is caught by a named rule, never by a crash
        run: |
