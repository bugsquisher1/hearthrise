      # --mutate: two JS and four SQL defects.
      # (Harvest daily retired 2026-10-15: the daily tasks left with the
      #  demolition, and tests/daily-harvest-eligibility.mjs with them.)

      # THE CLAN JOURNAL INVARIANT (F1 + F3, 2026-08-13). "Every RPC that writes
      # a shared table emits a clan_ledger row in the same transaction" — proven
      # by calling the real RPCs on an in-process PostgreSQL with the real clan
      # migration chain applied, not by a regex over migration text. --selftest
      # plants seven regressions; FOUR of them are invisible to the migrations'
      # own commit gates and are caught only here.
      - name: Clan journal + per-day caps (F1/F3)
        if: ${{ !cancelled() }}
        run: |
